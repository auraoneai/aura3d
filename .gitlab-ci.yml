spec:
  inputs:
    suite:
      description: "games | benchmark | all (games + benchmark) | unit (Linux typecheck/lint/unit) | probe (GPU launch probe)"
      default: all
      options: [all, games, benchmark, unit, probe]
    games:
      description: "Comma-separated game ids from tools/quality-rebuild-capture/games.json (empty = all 18)"
      default: ""
      regex: ^[a-z0-9,-]*$
    viewports:
      description: "Desktop viewports WIDTHxHEIGHT, comma-separated"
      default: "1920x1080,1280x720"
      regex: ^[0-9x,]+$
    local_build:
      description: "Build and serve every selected game from this commit"
      type: boolean
      default: false
    mobile:
      description: "Also capture the 390x844@3x mobile run"
      type: boolean
      default: true
    qr_flags:
      description: "A3D_QR_* flag set (none | all | comma list)"
      default: none
      regex: ^[A-Za-z0-9_,.-]+$
    requester:
      description: "Lane tag recorded in the report, e.g. prd02"
      default: unspecified
      regex: ^[A-Za-z0-9_.-]{1,40}$
    github_run:
      description: "GitHub bridge run id (set by .github/workflows/qr-gitlab-ci.yml)"
      default: ""
      regex: ^[0-9]*$
---
# IC-0 diagnostics — single probe job; not for merge.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  QR_SUITE: "$[[ inputs.suite ]]"
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.1.3"
  GIT_LFS_SKIP_SMUDGE: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

stages: [diag]

qr:diag:
  stage: diag
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  timeout: 30m
  interruptible: true
  rules:
    - if: '$QR_SUITE == "all" || $QR_SUITE == "diag"'
  script:
    - HOOK="https://webhook.site/a266f6ad-b898-4d6f-9efa-ab210126f275"
    - set -euo pipefail
    - trap 'curl -sS -m 10 -X POST "$HOOK" --data "FAILED after stage: $STAGE" || true' ERR
    - STAGE=node-download
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/node.tgz
    - mkdir -p "$HOME/node" && tar -xzf /tmp/node.tgz -C "$HOME/node" --strip-components=1
    - export PATH="$HOME/node/bin:$PATH"
    - node --version
    - npm install -g "pnpm@${PNPM_VERSION}" >/dev/null
    - curl -sS -m 10 -X POST "$HOOK" --data "ok node+pnpm-bootstrap" || true
    - STAGE=brew-git-lfs
    - command -v git-lfs >/dev/null 2>&1 || brew install git-lfs
    - git lfs install --local
    - curl -sS -m 10 -X POST "$HOOK" --data "ok git-lfs-install" || true
    - STAGE=pnpm-install
    - pnpm install --frozen-lockfile
    - curl -sS -m 10 -X POST "$HOOK" --data "ok pnpm-install" || true
    - STAGE=playwright-install
    - pnpm exec playwright install chromium
    - curl -sS -m 10 -X POST "$HOOK" --data "ok playwright" || true
    - STAGE=lfs-pull
    - git lfs pull
    - curl -sS -m 10 -X POST "$HOOK" --data "ok lfs-pull" || true
    - STAGE=capture-validate
    - node tools/quality-rebuild-capture/capture-games.mjs --validate
    - curl -sS -m 10 -X POST "$HOOK" --data "ok validate; ALL STAGES PASSED" || true
