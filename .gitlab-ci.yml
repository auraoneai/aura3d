# Aura3D quality-rebuild remote pipelines on the GitLab mirror
# (gitlab.com/chahal-foundation-group/github-auraoneai/aura3d).
#
# GitHub is the source of truth. This file is mirrored from GitHub; never edit it on GitLab.
# Pipelines run ONLY when explicitly requested (trigger token from the GitHub bridge workflow
# .github/workflows/qr-gitlab-ci.yml, `glab ci run`, or the GitLab web UI). Mirror pushes never
# start a pipeline, so the daily all-refs sync spends no compute minutes.
#
# Cost (GitLab compute minutes, 50,000/month on the group): macOS M1 medium has cost factor 6.
#   full 18-game capture  ~25 min wall -> ~150 compute min
#   18-scene benchmark    ~7 min wall  -> ~42 compute min
#   linux unit suite      cost factor 2 on saas-linux-medium-amd64
# See docs/project/aura3d-quality-rebuild/CI-ROUTING.md for the routing policy and budgets.
#
# Variables (set by the trigger):
#   QR_SUITE       games | benchmark | all | unit        (default: all = games + benchmark)
#   QRC_GAMES      comma-separated game ids (empty = all 18)
#   QRC_VIEWPORTS  desktop viewports, default "1920x1080,1280x720"
#   QRC_LOCAL_BUILD true = build and serve every selected game from source (pulls LFS)
#   QR_FLAGS       A3D_QR_* feature-flag set for the run (none | all | comma list); exported to builds
#   QR_REQUESTER   free-text tag (lane id, e.g. "prd02") recorded in the report

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  QR_SUITE: "all"
  QRC_GAMES: ""
  QRC_VIEWPORTS: "1920x1080,1280x720"
  QRC_LOCAL_BUILD: "false"
  QR_FLAGS: "none"
  QR_REQUESTER: "unspecified"
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.1.3"
  GIT_DEPTH: "50"
  GIT_LFS_SKIP_SMUDGE: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
  QR_BENCH_CHROME_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"

stages: [capture]

.macos:
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  timeout: 2h
  interruptible: true
  before_script:
    - set -euo pipefail
    - echo "requester=$QR_REQUESTER suite=$QR_SUITE flags=$QR_FLAGS ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHA"
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/node.tgz
    - mkdir -p "$HOME/node" && tar -xzf /tmp/node.tgz -C "$HOME/node" --strip-components=1
    - export PATH="$HOME/node/bin:$PATH"
    - node --version
    - npm install -g "pnpm@${PNPM_VERSION}" >/dev/null
    - command -v git-lfs >/dev/null 2>&1 || brew install git-lfs
    - git lfs install --local
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install chromium
    - export A3D_QR_FLAGS="$QR_FLAGS"

qr:games-capture:
  extends: .macos
  stage: capture
  rules:
    - if: '$QR_SUITE == "games" || $QR_SUITE == "all"'
  script:
    - export PATH="$HOME/node/bin:$PATH"
    - |
      if [ "$QRC_LOCAL_BUILD" = "true" ]; then git lfs pull; fi
    - node tools/quality-rebuild-capture/capture-games.mjs --validate
    - node tools/quality-rebuild-capture/capture-games.mjs --build-only || echo "build step failed; captures continue for production routes"
    - node tools/quality-rebuild-capture/capture-games.mjs --skip-build
  artifacts:
    when: always
    expire_in: 30 days
    name: "game-captures-$CI_PIPELINE_ID"
    paths:
      - tools/quality-rebuild-capture/out/
      - tools/quality-rebuild-capture/.build/build-report.json

qr:benchmark:
  extends: .macos
  stage: capture
  rules:
    - if: '$QR_SUITE == "benchmark" || $QR_SUITE == "all"'
  variables:
    QR_BENCH_OUT: benchmarks/quality-rebuild/out
  script:
    - export PATH="$HOME/node/bin:$PATH"
    - mkdir -p "$QR_BENCH_OUT"
    - bash benchmarks/quality-rebuild/ci.sh
  artifacts:
    when: always
    expire_in: 30 days
    name: "threejs-benchmark-$CI_PIPELINE_ID"
    paths:
      - benchmarks/quality-rebuild/out/

qr:unit:
  stage: capture
  tags: [saas-linux-medium-amd64]
  image: node:22.23.2-bookworm
  timeout: 1h
  interruptible: true
  rules:
    - if: '$QR_SUITE == "unit"'
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - npm install -g "pnpm@${PNPM_VERSION}" >/dev/null
    - pnpm install --frozen-lockfile
    - pnpm typecheck:raw
    - pnpm lint
    - pnpm test:unit
