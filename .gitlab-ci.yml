# IC-0 diagnostics branch — probes which stage of the capture jobs fails on saas-macos runners.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  QR_SUITE: "$[[ inputs.suite ]]"
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.1.3"
  GIT_LFS_SKIP_SMUDGE: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

stages: [diag]

qr:diag:
  stage: diag
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  timeout: 30m
  interruptible: true
  rules:
    - if: '$QR_SUITE == "all" || $QR_SUITE == "diag"'
  script:
    - set -x
    - uname -a
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/node.tgz && mkdir -p "$HOME/node" && tar -xzf /tmp/node.tgz -C "$HOME/node" --strip-components=1
    - export PATH="$HOME/node/bin:$PATH"
    - node --version
    - npm install -g "pnpm@${PNPM_VERSION}" >/dev/null
    - pnpm --version
    - git lfs install --local || true
    - git lfs pull --include="public/aura-assets/propRockA.52dd1f0f.glb" ; echo "LFS_PULL_ONE_EXIT=$?"
    - git lfs pull --include="apps/aura-clash-showcase/public/aura-assets/arenaNeonDowntownTextured.312f2320.glb" ; echo "LFS_PULL_GLB_EXIT=$?"
    - ls -la public/aura-assets/propRockA.52dd1f0f.glb
    - pnpm install --frozen-lockfile ; echo "PNPM_INSTALL_EXIT=$?"
  artifacts:
    when: always
    expire_in: 7 days
    paths: []
