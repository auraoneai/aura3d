<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura3D Product Configurator Template</title>
    <style>
      /* Licensed UI face, committed with the template (public/fonts/graphik). */
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Regular-Web.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-RegularItalic-Web.woff2") format("woff2");
        font-weight: 400; font-style: italic; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Medium-Web.woff2") format("woff2");
        font-weight: 500; font-style: normal; font-display: swap;
      }
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #f4f6f9; }
      body {
        font-family: "Graphik", system-ui, -apple-system, sans-serif;
        font-synthesis: none;
        font-size: 13px;
        line-height: 1.45;
        color: #1c2530;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
