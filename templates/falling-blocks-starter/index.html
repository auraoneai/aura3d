<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura3D Falling Blocks Starter</title>
    <style>
      /* Licensed UI face, committed with the template (public/fonts/graphik). */
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Regular-Web.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-RegularItalic-Web.woff2") format("woff2");
        font-weight: 400; font-style: italic; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Medium-Web.woff2") format("woff2");
        font-weight: 500; font-style: normal; font-display: swap;
      }
      :root { color-scheme: light; }
      /* Dark canvas backdrop is scene content; DOM HUD chrome is light. */
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070a;
      }
      body {
        font-family: "Graphik", system-ui, -apple-system, sans-serif;
        font-synthesis: none;
        font-size: 13px;
        color: #1c2530;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
