<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura3D Arena Shooter</title>
    <style>
      /* Licensed UI face, committed with the template (public/fonts/graphik). */
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Regular-Web.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-RegularItalic-Web.woff2") format("woff2");
        font-weight: 400; font-style: italic; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Medium-Web.woff2") format("woff2");
        font-weight: 500; font-style: normal; font-display: swap;
      }
      :root { color-scheme: light; }
      /* Dark canvas backdrop is scene content; the floating HUD is light chrome. */
      html, body { margin: 0; background: #05070f; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      body {
        font-family: "Graphik", system-ui, -apple-system, sans-serif;
        font-synthesis: none;
        font-size: 13px;
        color: #1c2530;
      }
      #app { position: relative; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      #hud .hud__panel { position: absolute; background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(28, 37, 48, 0.18); border-radius: 8px; padding: 10px 12px; font: 500 13px/1.45 "Graphik", system-ui, sans-serif; color: #1c2530; }
      #hud .hud__panel--status { left: 16px; top: 16px; min-width: 240px; }
      #hud .hud__panel--status h1 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
      #hud .hud__panel--status p { margin: 0 0 6px; font-size: 12px; color: #566272; }
      #hud .hud__bars { display: grid; gap: 2px; }
      #hud .hud__bar { display: flex; justify-content: space-between; gap: 12px; }
      #hud .hud__bar b { color: #0e7490; font-weight: 500; }
      #hud .hud__panel--meta { left: 16px; bottom: 16px; display: grid; gap: 2px; font-size: 12px; }
      #hud .hud__panel--controls { right: 16px; bottom: 16px; pointer-events: auto; display: flex; gap: 8px; align-items: center; }
      #hud button { background: #ffffff; color: #1c2530; border: 1px solid rgba(28, 37, 48, 0.22); border-radius: 6px; padding: 6px 10px; font: 500 12px "Graphik", system-ui, sans-serif; cursor: pointer; }
      #hud button:hover { background: #f0f4f8; }
      #hud .hud__help { font-size: 12px; color: #566272; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
