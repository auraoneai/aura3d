<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Clean-room configurator</title>
    <style>
      body { margin: 0; background: #0b0d10; color: #e8eef5; font: 14px system-ui; display: grid; grid-template-columns: 1fr 220px; height: 100vh; }
      #stage { width: 100%; height: 100%; }
      aside { padding: 12px; display: grid; gap: 8px; align-content: start; }
      button { padding: 7px 10px; border-radius: 6px; border: 1px solid #33404f; background: #151a20; color: inherit; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #f2c06d; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <aside>
      <button type="button" data-finish="graphite">Graphite</button>
      <button type="button" data-finish="pearl">Pearl</button>
      <button type="button" data-finish="copper">Copper</button>
      <button type="button" data-part="earcups">Earcups</button>
      <button type="button" data-part="headband">Headband</button>
      <button type="button" data-part="cushions">Cushions</button>
      <button type="button" id="reset">Reset</button>
      <p id="readout">no selection</p>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
