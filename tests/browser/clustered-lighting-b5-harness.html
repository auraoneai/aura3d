<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura3D B5 Clustered Lighting + Rigs + Rect Proof</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #05070d;
        color: #eef2ff;
        font: 13px system-ui, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      #b5-stage {
        width: 640px;
        height: 400px;
        background: #05070d;
      }

      main {
        display: grid;
        grid-template-columns: repeat(4, 320px);
        gap: 18px;
        padding: 24px;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      canvas.rect-proof {
        display: block;
        width: 320px;
        height: 200px;
        border: 1px solid #26324b;
      }
    </style>
  </head>
  <body>
    <div id="b5-stage"></div>
    <main>
      <figure><figcaption>Rect off</figcaption><canvas id="rect-off" class="rect-proof" width="320" height="200"></canvas></figure>
      <figure><figcaption>Rect on</figcaption><canvas id="rect-on" class="rect-proof" width="320" height="200"></canvas></figure>
      <figure><figcaption>Rect narrow</figcaption><canvas id="rect-narrow" class="rect-proof" width="320" height="200"></canvas></figure>
      <figure><figcaption>Rect wide</figcaption><canvas id="rect-wide" class="rect-proof" width="320" height="200"></canvas></figure>
    </main>
    <script type="module" src="./clustered-lighting-b5-harness.ts"></script>
  </body>
</html>
