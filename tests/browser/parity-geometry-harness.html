<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Aura3D threejs-parity Geometry Harness (L2)</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #020617;
        color: white;
        font: 13px system-ui, sans-serif;
      }

      #mount {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      canvas {
        width: 480px;
        height: 270px;
      }

      #run {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <button id="run" type="button">run</button>
    <div id="mount"></div>
    <script type="module" src="/tests/browser/parity-geometry-harness.js"></script>
  </body>
</html>
