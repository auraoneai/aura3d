<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>game-shell harness</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #070d0a; }
      #app { position: absolute; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      .a3g-game-hud { position: absolute; inset: 0; pointer-events: none; }
      .a3g-game-hud .a3g-tc { pointer-events: auto; }
      .a3g-hud { position: absolute; inset: 0; }
      .a3g-hud-slot { position: absolute; display: flex; flex-direction: column; gap: 4px; }
      .a3g-a-top-left { top: 12px; left: 12px; align-items: flex-start; }
      .a3g-a-top { top: 12px; left: 50%; transform: translateX(-50%); align-items: center; }
      .a3g-a-top-right { top: 12px; right: 12px; align-items: flex-end; }
      .a3g-a-left { top: 50%; left: 12px; transform: translateY(-50%); align-items: flex-start; }
      .a3g-a-center { inset: 0; }
      .a3g-a-right { top: 50%; right: 12px; transform: translateY(-50%); align-items: flex-end; }
      .a3g-a-bottom-left { bottom: 12px; left: 12px; align-items: flex-start; }
      .a3g-a-bottom { bottom: 12px; left: 50%; transform: translateX(-50%); align-items: center; }
      .a3g-a-bottom-right { bottom: 12px; right: 12px; align-items: flex-end; }
      .a3g-w { display: inline-flex; gap: 6px; padding: 4px 10px; background: rgba(8,10,16,.78); border-radius: 4px; color: #e8ecf4; font: 600 13px/1.2 system-ui; }
      .a3g-w-label { opacity: .7; }
      .a3g-hidden { display: none !important; }
      .a3g-overlay { position: absolute; inset: 0; pointer-events: none; }
      .a3g-touch { position: absolute; inset: 0; }
      .a3g-tc { position: absolute; width: 48px; height: 48px; border-radius: 8px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); }
      .a3g-shell-menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #e8ecf4; font: 700 22px/1 system-ui; background: rgba(4,6,10,.8); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
