<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>PART O2 Root Visual Scripting Harness</title>

    <div id="o2-stage"><canvas id="o2-viewport" data-testid="o2-viewport"></canvas></div>

    <div data-testid="o2-state">loading</div>
    <div data-testid="o2-score">score 0</div>
