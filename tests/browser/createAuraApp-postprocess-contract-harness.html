<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura3D Root Postprocess Contract</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #05070d;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /*
       * min-height/position are explicit because the engine's default canvas mount
       * layout applies `min-height: 100vh` to an unstyled container, which would
       * override the intended stage size and invalidate the resize measurements.
       */
      #postprocess-contract-stage {
        width: 720px;
        height: 480px;
        min-height: 0;
        position: relative;
        overflow: hidden;
        background: #05070d;
      }
    </style>
  </head>
  <body>
    <div id="postprocess-contract-stage"></div>
    <script type="module" src="./createAuraApp-postprocess-contract-harness.ts"></script>
  </body>
</html>
