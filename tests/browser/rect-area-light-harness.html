<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Aura3D Rectangular Area-Light Pixel Proof</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #05070c; color: #eef2ff; font-family: system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(3, 320px); gap: 18px; padding: 24px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
      canvas { display: block; width: 320px; height: 220px; border: 1px solid #26324b; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Small front-facing emitter</figcaption><canvas id="area-small" width="320" height="220"></canvas></figure>
      <figure><figcaption>Wide front-facing emitter</figcaption><canvas id="area-wide" width="320" height="220"></canvas></figure>
      <figure><figcaption>Wide back-facing emitter</figcaption><canvas id="area-back" width="320" height="220"></canvas></figure>
    </main>
    <script type="module" src="/tests/browser/rect-area-light-harness.js"></script>
  </body>
</html>
