<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRD-06 clip-samples binding harness</title>
  </head>
  <body>
    <canvas id="app" width="64" height="64"></canvas>
    <script>
      // Surface module-load failures (parse errors, failed imports, 404s) as a
      // real `error` status instead of a bare waitForFunction timeout.
      window.addEventListener("error", (event) => {
        if (!window.__PRD06_CLIP_SAMPLES__) {
          window.__PRD06_CLIP_SAMPLES__ = { status: "error", error: `harness module failed: ${event.message}` };
        }
      });
      window.addEventListener("unhandledrejection", (event) => {
        if (!window.__PRD06_CLIP_SAMPLES__) {
          window.__PRD06_CLIP_SAMPLES__ = { status: "error", error: `harness module rejected: ${String(event.reason)}` };
        }
      });
    </script>
    <!-- Deep `@aura3d/rendering/contracts/*` subpaths are published exports but
         have no entry in the example-dev-server alias table (owner 15; qr-request
         filed). The import map (strict JSON — no comments) resolves them here. -->
    <script type="importmap">
      {
        "imports": {
          "@aura3d/rendering/contracts/flags.state": "/packages/rendering/src/contracts/flags.state.ts",
          "@aura3d/rendering/contracts": "/packages/rendering/src/contracts/index.ts",
          "@aura3d/rendering/contracts/": "/packages/rendering/src/contracts/"
        }
      }
    </script>
    <script type="module" src="./clip-samples-harness.ts"></script>
  </body>
</html>
