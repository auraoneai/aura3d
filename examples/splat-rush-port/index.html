<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Chroma Roll</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
      canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; user-select: none; outline: none; }
      .game-ui { font-family: 'Splat Display', 'Trebuchet MS', system-ui, sans-serif; font-synthesis: none; user-select: none; }
      .hud-text { paint-order: stroke fill; font-size: clamp(22px, 5.4vh, 34px); font-weight: 900; color: #fdf0e0; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 #333, 0 4px 10px rgba(0,0,0,0.3); letter-spacing: 1px; }
      .btn { padding: clamp(8px, 2vh, 15px) 50px; font-size: clamp(22px, 5vh, 32px); font-weight: 900; font-family: inherit; background: linear-gradient(180deg, #f0433a, #d93a32); color: #fdf0e0; border: 4px solid #333; border-radius: 40px; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 0 #333, 0 15px 20px rgba(0,0,0,0.3); text-shadow: 2px 2px 0 #333; }
      .life-icon { width: clamp(24px, 6vh, 34px); height: clamp(24px, 6vh, 34px); background: radial-gradient(circle at 70% 30%, #ff8a80 0 18%, #f0433a 45%, #c42a24 100%); border-radius: 50% 50% 50% 10%; transform: rotate(-45deg); display: inline-block; margin: 0 8px; border: 3px solid #4a1612; box-shadow: 2px 3px 0 rgba(51,51,51,0.55); position: relative; overflow: hidden; }
      .life-lost { background: #888; filter: grayscale(100%); opacity: 0.5; transform: rotate(-45deg) scale(0.8); box-shadow: 0 0 0 #333; }
      .popup-text { paint-order: stroke fill; position: relative; white-space: nowrap; line-height: 1.05; animation: popup-rise 0.95s cubic-bezier(0.2,0.8,0.3,1) forwards; font-size: clamp(22px, min(8vh, 7.5vw), 48px); font-weight: 900; color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 4px 4px 0 #333; pointer-events: none; z-index: 20; transform: translate(-50%, -50%); font-family: 'Splat Display', system-ui, sans-serif; }
      @keyframes popup-rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); } 35% { transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1); } }
      .btn-gold { background: linear-gradient(180deg, #f9c647, #e0a32a); color: #fdf0e0; }
      .pu { display: inline-flex; align-items: center; font-weight: 900; font-size: 16px; color: #fff; -webkit-text-stroke: 1px #333; padding: 6px 14px; border-radius: 100px; border: 2px solid #333; box-shadow: 0 3px 0 #333; white-space: nowrap; margin: 0 6px; }
      .pu-rainbow { background: linear-gradient(90deg, #f0433a, #f9c647, #5ecaf0, #b868e8); }
      .pu-shield { background: #5ecaf0; }
      .pu-x2 { background: #f9c647; }
      .overlay-card { background: #fdf0e0; border: 6px solid #333; border-radius: 30px; padding: clamp(14px, 4.5vh, 50px) 40px; max-height: 92vh; box-sizing: border-box; box-shadow: 12px 12px 0 rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; max-width: 500px; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; text-align: center; }
      .hidden { display: none !important; }
      /* C3: the controls sit above the "Built with Aura3D" credit (left 8, bottom 8, up to two lines on a phone) */
      .icon-btn { position: fixed; left: calc(16px + env(safe-area-inset-left)); bottom: calc(56px + env(safe-area-inset-bottom)); z-index: 12; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #333; background: #fdf0e0; box-shadow: 0 4px 0 #333; font-size: 20px; line-height: 1; cursor: pointer; padding: 0; }
      .icon-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #333; }
      #btn-pause { left: calc(70px + env(safe-area-inset-left)); }
      .settings { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: clamp(6px, 1.6vh, 12px) 0 0; }
      .toggle { font-weight: 800; font-size: 13px; line-height: 1; font-family: inherit; color: #333; background: #fff; border: 2px solid #333; border-radius: 100px; padding: 7px 12px; cursor: pointer; box-shadow: 0 2px 0 #333; }
      .toggle[aria-pressed="true"] { background: #f9c647; }
      #final-stats { font-size: clamp(14px, 2.6vh, 18px); font-weight: 800; color: #555; margin: 0 0 clamp(8px, 2vh, 16px); }
      .go-best { display: inline-block; margin-top: 8px; font-size: 24px; color: #b868e8; -webkit-text-stroke: 0; }
      @media (max-height: 420px) { .hint { display: none; } }
      .hint { font-size: 14px; font-weight: 800; color: #555; margin: 14px 0 0; }
      #splash-best { font-size: 22px; font-weight: 900; color: #333; margin: 0 0 14px; min-height: 26px; }
      @media (max-width: 520px) {
        .overlay-card { width: calc(100vw - 28px); max-width: calc(100vw - 28px); padding-left: 16px; padding-right: 16px; border-width: 5px; box-shadow: 8px 8px 0 rgba(0,0,0,0.2); }
        .overlay-card h1 { font-size: min(13vw, 64px) !important; }
        #hud-lives { flex: none; white-space: nowrap; }
        #hud-score { white-space: nowrap; font-size: clamp(18px, 5.2vw, 26px); }
        #hud-combo { top: calc(72px + env(safe-area-inset-top)) !important; }
        .icon-btn { bottom: calc(64px + env(safe-area-inset-bottom)); }
        #hud-powerups { bottom: calc(118px + env(safe-area-inset-bottom)) !important; }
      }
      /* GU47 CR-H1 paint-world HUD, carnival look only (body.look-carnival; ?look=original keeps everything above).
       * Licensed GT Walsheim Bold only (no system or Trebuchet fallback); plum ink on cream paper chips. */
      .paint-only { display: none; }
      .look-carnival .paint-only { display: flex; }
      .look-carnival.game-ui, .look-carnival .popup-text, .look-carnival .btn, .look-carnival .toggle { font-family: 'Splat Display'; }
      .look-carnival .hud-text { color: #3b1f3f; -webkit-text-stroke: 0; text-shadow: none; background: #fdf0e0; padding: 4px 16px 6px; border-radius: 14px 20px 12px 22px / 18px 12px 20px 14px; box-shadow: 3px 4px 0 #3b1f3f; border: 3px solid #3b1f3f; }
      .look-carnival #hud-combo { background: #fdf0e0; color: #3b1f3f !important; }
      .look-carnival .life-icon { border-color: #3b1f3f; }
      .look-carnival .popup-text { -webkit-text-stroke: 2px #3b1f3f; text-shadow: 3px 3px 0 #3b1f3f; padding: 6px 22px 10px; background: radial-gradient(ellipse 60% 48% at 50% 55%, rgba(253,240,224,0.92) 0 62%, rgba(253,240,224,0) 64%), radial-gradient(ellipse 52% 38% at 28% 50%, rgba(253,240,224,0.85) 0 60%, rgba(253,240,224,0) 62%); }
      .look-carnival .overlay-card { color: #3b1f3f; border: 4px solid #3b1f3f; border-radius: 22px 34px 18px 40px / 30px 18px 36px 22px; box-shadow: 10px 12px 0 rgba(59,31,63,0.35); background: radial-gradient(circle at 20% 15%, rgba(243,169,107,0.10), rgba(0,0,0,0) 40%), #fdf0e0;
        -webkit-mask: radial-gradient(circle 5px at 50% 0, #0000 98%, #000) top/14px 51% repeat-x, radial-gradient(circle 5px at 50% 100%, #0000 98%, #000) bottom/14px 51% repeat-x;
        mask: radial-gradient(circle 5px at 50% 0, #0000 98%, #000) top/14px 51% repeat-x, radial-gradient(circle 5px at 50% 100%, #0000 98%, #000) bottom/14px 51% repeat-x; }
      .look-carnival .btn { border-color: #3b1f3f; box-shadow: 0 8px 0 #3b1f3f, 0 15px 20px rgba(59,31,63,0.3); text-shadow: 2px 2px 0 #3b1f3f; }
      .look-carnival .icon-btn { border-color: #3b1f3f; box-shadow: 0 4px 0 #3b1f3f; }
      .look-carnival .toggle { color: #3b1f3f; border-color: #3b1f3f; box-shadow: 0 2px 0 #3b1f3f; }
      .look-carnival .hint, .look-carnival #final-stats, .look-carnival #splash-best { color: #3b1f3f; }
      .look-carnival #splash-screen { background: linear-gradient(180deg, rgba(31,74,99,0.55), rgba(232,121,138,0.45) 60%, rgba(243,169,107,0.55)) !important; }
      .look-carnival #gameover-screen { background: linear-gradient(180deg, rgba(59,31,63,0.82), rgba(240,67,58,0.78)) !important; }
      #hud-paint { position: fixed; top: calc(clamp(52px, 10vh, 78px) + env(safe-area-inset-top)); left: calc(20px + env(safe-area-inset-left)); z-index: 5; pointer-events: none; align-items: center; gap: 10px; }
      #hud-swatch { width: 34px; height: 34px; border: 3px solid #3b1f3f; border-radius: 46% 54% 42% 58% / 52% 44% 56% 48%; box-shadow: 2px 3px 0 #3b1f3f; }
      #hud-tube { position: relative; width: 120px; height: 18px; background: #fdf0e0; border: 3px solid #3b1f3f; border-radius: 4px 10px 10px 4px; box-shadow: 2px 3px 0 #3b1f3f; overflow: hidden; }
      #hud-tube::after { content: ""; position: absolute; right: -9px; top: 3px; width: 6px; height: 6px; background: #3b1f3f; }
      #hud-tube-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 0 9px 9px 0; transition: width 0.18s ease-out; }
      /* GU47 phase 3: on a phone the combo chip ran over the paint tube (390 px: tube to ~205 px, chip from ~140 px); a shorter tube and a smaller chip keep a gap */
      @media (max-width: 520px) { #hud-tube { width: 72px; } .look-carnival #hud-combo { font-size: 18px !important; padding: 3px 10px 4px; } }
      #bars-top, #bars-bottom { position: fixed; left: 0; right: 0; height: 9vh; background: #2a1530; z-index: 4; pointer-events: none; transform: scaleY(0); }
      #bars-top { top: 0; transform-origin: top; }
      #bars-bottom { bottom: 0; transform-origin: bottom; }
      @media (prefers-reduced-motion: reduce) { #hud-tube-fill { transition: none; } }
    </style>
  </head>
  <body class="game-ui">
    <canvas id="world" tabindex="0"></canvas>
    <button id="btn-mute" class="icon-btn no-steer" type="button" aria-label="Toggle sound (M)" aria-pressed="false">&#x1F50A;</button>
    <button id="btn-pause" class="icon-btn no-steer" type="button" aria-label="Pause (P or Esc)">&#x23F8;&#xFE0E;</button>
    <div id="hud" style="position:fixed;top:0;left:0;right:0;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 20px max(20px,env(safe-area-inset-left));display:flex;justify-content:space-between;pointer-events:none;z-index:5">
      <div id="hud-lives"></div>
      <div id="hud-score" class="hud-text">SCORE: 0</div>
      <div id="hud-combo" class="hud-text" style="position:absolute;top:clamp(44px,9.5vh,70px);right:20px;color:#f9c647;font-size:clamp(20px,4.6vh,30px);display:none"></div>
    </div>
    <div id="bars-top" class="paint-only" aria-hidden="true"></div><div id="bars-bottom" class="paint-only" aria-hidden="true"></div>
    <div id="hud-paint" class="paint-only" aria-hidden="true"><div id="hud-swatch"></div><div id="hud-tube"><div id="hud-tube-fill"></div></div></div>
    <div id="hud-powerups" style="position:fixed;bottom:calc(40px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;z-index:6;pointer-events:none"></div>
    <div id="popups" style="position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;padding-top:clamp(120px,16vh,200px);box-sizing:border-box"></div>
    <div id="splash-screen" class="overlay" style="background:rgba(94,202,240,0.8)">
      <div class="overlay-card">
        <h1 style="paint-order:stroke fill;font-size:clamp(34px,11vh,72px);margin:0 0 clamp(6px,2vh,15px);color:#f0433a;-webkit-text-stroke:clamp(2px,0.6vh,4px) #333;text-shadow:clamp(3px,0.9vh,6px) clamp(3px,0.9vh,6px) 0 #333;line-height:1.1">CHROMA<br />ROLL</h1>
        <p style="font-size:clamp(14px,2.8vh,20px);margin:0 0 clamp(8px,2.5vh,20px);color:#333;font-weight:800">Drag left/right to steer.<br />Match colors for combos &amp; big scores.<br />Grab 🌈 Rainbow · 🛡 Shield · ✦ 2x · 🎨 Switch!</p>
        <div id="splash-best"></div>
        <button id="btn-start" class="btn">PLAY NOW</button>
        <div class="settings no-steer"><button class="toggle" type="button" data-setting="symbols" aria-pressed="false">Colour symbols: off</button><button class="toggle" type="button" data-setting="motion" aria-pressed="false">Reduced motion: off</button></div>
        <p class="hint">Mouse or touch: drag &middot; Keyboard: Space to start, &larr; &rarr; or A / D to steer, C symbols, P pause, M mute</p>
      </div>
    </div>
    <div id="gameover-screen" class="overlay hidden" style="background:#f0433a">
      <div class="overlay-card">
        <h1 style="paint-order:stroke fill;font-size:clamp(34px,10vh,64px);margin:0 0 clamp(6px,2vh,10px);color:#f0433a;-webkit-text-stroke:clamp(2px,0.6vh,4px) #333;text-shadow:clamp(3px,0.8vh,5px) clamp(3px,0.8vh,5px) 0 #333">SPLAT!</h1>
        <p id="final-score" style="font-size:clamp(22px,5vh,32px);font-weight:900;margin:0 0 clamp(6px,1.5vh,10px);color:#333"></p>
        <p id="final-stats"></p>
        <button id="btn-restart" class="btn btn-gold">PLAY AGAIN</button>
        <p class="hint">Space or Enter to play again</p>
      </div>
    </div>
    <div id="pause-screen" class="overlay hidden no-steer" style="background:rgba(11,16,32,0.45)">
      <div class="overlay-card">
        <h1 style="paint-order:stroke fill;font-size:clamp(30px,8vh,56px);margin:0 0 clamp(6px,2vh,14px);color:#5ecaf0;-webkit-text-stroke:clamp(2px,0.5vh,3px) #333;text-shadow:4px 4px 0 #333">PAUSED</h1>
        <button id="btn-resume" class="btn">RESUME</button>
        <div class="settings"><button class="toggle" type="button" data-setting="symbols" aria-pressed="false">Colour symbols: off</button><button class="toggle" type="button" data-setting="motion" aria-pressed="false">Reduced motion: off</button></div>
        <p class="hint">P or Esc to resume</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
