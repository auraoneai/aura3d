<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Splat Rush on Aura3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
      canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; user-select: none; outline: none; }
      .game-ui { font-family: 'Nunito', 'Trebuchet MS', system-ui, sans-serif; user-select: none; }
      .hud-text { font-size: 28px; font-weight: 900; color: #fdf0e0; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 #333, 0 4px 10px rgba(0,0,0,0.3); letter-spacing: 1px; }
      .btn { padding: 15px 50px; font-size: 32px; font-weight: 900; font-family: inherit; background: linear-gradient(180deg, #f0433a, #d93a32); color: #fdf0e0; border: 4px solid #333; border-radius: 40px; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 0 #333, 0 15px 20px rgba(0,0,0,0.3); text-shadow: 2px 2px 0 #333; }
      .life-icon { width: 32px; height: 32px; background: #f0433a; border-radius: 50% 50% 50% 10%; transform: rotate(-45deg); display: inline-block; margin: 0 8px; border: 3px solid #333; box-shadow: 2px 2px 0 #333; position: relative; overflow: hidden; }
      .life-lost { background: #888; filter: grayscale(100%); opacity: 0.5; transform: rotate(-45deg) scale(0.8); box-shadow: 0 0 0 #333; }
      .popup-text { position: absolute; font-size: 48px; font-weight: 900; color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 4px 4px 0 #333; pointer-events: none; z-index: 20; transform: translate(-50%, -50%); font-family: 'Nunito', system-ui, sans-serif; }
      .pu { display: inline-flex; align-items: center; font-weight: 900; font-size: 16px; color: #fff; -webkit-text-stroke: 1px #333; padding: 6px 14px; border-radius: 100px; border: 2px solid #333; box-shadow: 0 3px 0 #333; white-space: nowrap; margin: 0 6px; }
      .pu-rainbow { background: linear-gradient(90deg, #f0433a, #f9c647, #5ecaf0, #b868e8); }
      .pu-shield { background: #5ecaf0; }
      .pu-x2 { background: #f9c647; }
      .overlay-card { background: #fdf0e0; border: 6px solid #333; border-radius: 30px; padding: 50px 40px; box-shadow: 12px 12px 0 rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; max-width: 500px; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; text-align: center; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body class="game-ui">
    <canvas id="world" tabindex="0"></canvas>
    <div id="hud" style="position:fixed;top:0;left:0;right:0;padding:20px;display:flex;justify-content:space-between;pointer-events:none;z-index:5">
      <div id="hud-lives"></div>
      <div id="hud-score" class="hud-text">SCORE: 0</div>
      <div id="hud-combo" class="hud-text" style="position:absolute;top:60px;right:20px;color:#f9c647;font-size:24px;display:none"></div>
    </div>
    <div id="hud-powerups" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);display:none;z-index:6;pointer-events:none"></div>
    <div id="popups" style="position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden"></div>
    <div id="splash-screen" class="overlay" style="background:rgba(94,202,240,0.8)">
      <div class="overlay-card">
        <h1 style="font-size:72px;margin:0 0 15px;color:#f0433a;-webkit-text-stroke:3px #333;text-shadow:6px 6px 0 #333;line-height:1.1">SPLAT<br />RUSH</h1>
        <p style="font-size:20px;margin:0 0 20px;color:#333;font-weight:800">Drag left/right to steer.<br />Match colors for combos &amp; big scores.<br />Grab 🌈 Rainbow · 🛡 Shield · ✦ 2x · 🎨 Switch!</p>
        <button id="btn-start" class="btn">PLAY NOW</button>
      </div>
    </div>
    <div id="gameover-screen" class="overlay hidden" style="background:rgba(240,67,58,0.6)">
      <div class="overlay-card">
        <h1 style="font-size:64px;margin:0 0 10px;color:#f0433a;-webkit-text-stroke:3px #333;text-shadow:5px 5px 0 #333">SPLAT!</h1>
        <p id="final-score" style="font-size:32px;font-weight:900;margin:0 0 20px;color:#333"></p>
        <button id="btn-restart" class="btn">PLAY AGAIN</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
