<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/fonts/local.css" />
    <title>Ninja Runner on Aura3D</title>
    <style>
      :root { color-scheme: dark; --ink: #fff0cc; --muted: #c9d3cf; --panel: rgba(17, 32, 43, 0.78); --line: rgba(255, 240, 204, 0.2); --warm: #ffa135; --cyan: #83ebff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #11202b; color: var(--ink); font: 400 13px/1.45 "Graphik Web", sans-serif; overflow: hidden; }
      canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      .hidden { display: none !important; }
      .num { font-variant-numeric: tabular-nums; }
      .meta { font-size: 12px; color: var(--muted); }
      h1, h2 { margin: 0; line-height: 1.15; font-weight: 500; }
      h1 { font-size: 28px; letter-spacing: 0.04em; }
      h2 { font-size: 18px; }
      button { font: 500 13px/1 "Graphik Web", sans-serif; color: var(--ink); background: rgba(255, 240, 204, 0.1); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; cursor: pointer; }
      button.primary { background: var(--warm); color: #1d1a17; border-color: transparent; }
      button:disabled { opacity: 0.5; cursor: default; }
      #stats { position: fixed; top: 14px; right: 14px; text-align: right; display: grid; gap: 8px; }
      #stats strong { font-size: 22px; font-weight: 500; }
      #vitals { position: fixed; top: 14px; left: 14px; width: 190px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
      .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; margin: 6px 0 8px; }
      .bar > i { display: block; height: 100%; width: 0; background: var(--cyan); }
      #hearts { letter-spacing: 3px; color: var(--warm); }
      #forms { position: fixed; left: 14px; top: 130px; display: grid; gap: 6px; }
      #forms button.selected { background: var(--warm); color: #1d1a17; }
      #abilities { position: fixed; right: 14px; bottom: 14px; display: grid; gap: 6px; }
      #abilities button { min-width: 150px; text-align: left; }
      #announce { position: fixed; top: 70px; left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 1px 6px #0008; }
      #announce strong { display: block; font-size: 22px; font-weight: 500; }
      #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 16, 22, 0.55); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; max-width: 420px; display: grid; gap: 12px; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="stats" class="hidden"><div><span class="meta">DISTANCE</span><strong class="num"><span id="distance">0</span> m</strong></div><div><span class="meta">SHINOBI DEFEATED</span><strong class="num" id="kills">00</strong></div><div><span class="meta">SCORE</span><strong class="num" id="score">0</strong></div></div>
    <div id="vitals" class="hidden"><span class="meta">CHAKRA</span><div class="bar"><i id="chakra-bar"></i></div><span class="num" id="chakra">300 / 300</span><div class="meta" style="margin-top:8px">HEALTH</div><div id="hearts">&#9829;&#9829;&#9829;&#9829;&#9829;</div><div class="meta" id="district">Hidden Leaf Village</div></div>
    <div id="forms" class="hidden"><button data-form="base" class="selected">Naruto</button><button data-form="sage">Sage</button><button data-form="kurama">Kurama</button></div>
    <div id="abilities" class="hidden"><button data-action="clones">1 &middot; Shadow clones</button><button data-action="rasengan">2 &middot; Rasengan</button><button data-action="dash">Shift &middot; Chakra dash</button><button data-action="rasenshuriken">3 &middot; Rasenshuriken</button></div>
    <div id="announce"><strong id="announce-title"></strong><span class="meta" id="announce-small"></span></div>
    <div id="overlay"><div class="card" id="intro-card"><h1>NINJA RUNNER</h1><p class="meta" id="loading-status">Loading the village&hellip;</p><button class="primary" id="start" disabled>Enter the Village &rarr;</button><p class="meta">A/D move &middot; W jump &middot; S slide &middot; 1 clones &middot; 2 Rasengan &middot; Shift dash &middot; 3 Rasenshuriken &middot; Space form &middot; Esc pause</p></div></div>
    <div id="result" class="hidden" style="position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,16,22,.6)"><div class="card"><span class="meta" id="result-label">MISSION REPORT</span><h2 id="result-title"></h2><p id="result-copy" class="meta"></p><div class="meta num" id="result-stats"></div><button class="primary" id="again">Run again</button></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
