<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aura3D Editor Authored Sample</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #10151f; color: #edf2f7; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      main { display: grid; min-height: 100vh; place-items: center; padding: 24px; }
      .export-shell { display: grid; grid-template-columns: minmax(0, 920px) 300px; width: min(1244px, 100%); border: 1px solid #334155; background: #121a26; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3); }
      canvas { display: block; width: 100%; height: 520px; background: #121a26; }
      aside { padding: 24px; border-left: 1px solid #334155; background: #0d1420; }
      h1 { margin: 0 0 10px; font-size: 21px; }
      p { margin: 0 0 18px; color: #aebbd0; line-height: 1.45; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; margin: 22px 0 0; font-size: 13px; }
      dt { color: #7f90aa; }
      dd { margin: 0; color: #e7edf7; overflow-wrap: anywhere; }
      .scope { display: inline-flex; padding: 5px 8px; border: 1px solid #2c8b71; border-radius: 999px; color: #75e2bd; font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
      .hud { position: fixed; left: 20px; top: 16px; padding: 10px 12px; background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; border-radius: 6px; }
      @media (max-width: 900px) {
        .export-shell { grid-template-columns: 1fr; }
        aside { border-left: 0; border-top: 1px solid #334155; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="export-shell" aria-label="Editor static-export diagnostic">
        <canvas id="aura3d-export" width="920" height="520"></canvas>
        <aside>
          <span class="scope">Static export diagnostic</span>
          <h1>Serialized project proof</h1>
          <p>This bounded Canvas2D view verifies that editor-authored nodes and asset metadata survive save and static export. It is not a WebGL rendering-quality example.</p>
          <dl id="aura3d-export-details" aria-label="Export details"></dl>
        </aside>
      </section>
      <div class="hud" id="aura3d-export-status">Loading export...</div>
    </main>
    <script type="module" src="./runtime.js"></script>
  </body>
</html>
