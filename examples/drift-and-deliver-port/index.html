<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/fonts/local.css" />
    <title>Drift &amp; Deliver on Aura3D</title>
    <style>
      :root { color-scheme: dark; --ink: #fff6e6; --muted: #d8c9ad; --panel: rgba(38, 30, 26, 0.74); --line: rgba(255, 246, 230, 0.18); --warm: #ff9a2e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #261e1a; color: var(--ink); font: 400 13px/1.45 "Graphik Web", sans-serif; overflow: hidden; }
      canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      .hidden { display: none !important; }
      h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.15; }
      .meta { font-size: 12px; color: var(--muted); }
      button { font: 500 13px/1 "Graphik Web", sans-serif; color: #261e1a; background: var(--warm); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(38, 30, 26, 0.55); }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; width: min(420px, 90vw); display: grid; gap: 10px; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #nitro { position: absolute; bottom: 26px; left: 26px; width: 250px; }
      #nitro .label { font-size: 11px; letter-spacing: 2.5px; opacity: 0.9; margin-bottom: 7px; }
      #nitro .track { height: 9px; border-radius: 6px; background: rgba(18, 18, 22, 0.55); overflow: hidden; }
      #nitro-fill { height: 100%; width: 100%; border-radius: 6px; }
      #speedbox { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); text-align: center; }
      #speed { font-size: 44px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
      #score-box { position: absolute; top: 18px; right: 22px; text-align: right; }
      #score { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
      #streak { transition: opacity 0.2s; color: var(--warm); letter-spacing: 2px; font-size: 12px; }
      #minimap { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 160px; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="hud">
      <div id="nitro"><div class="label">NITRO</div><div class="track"><div id="nitro-fill"></div></div></div>
      <div id="speedbox"><div id="speed">0</div><div class="meta">KM/H</div></div>
      <div id="score-box"><div id="score">0</div><div id="streak" style="opacity: 0">x0  STREAK</div><div class="meta" id="count">0 / 174</div></div>
      <canvas id="minimap" width="240" height="240"></canvas>
    </div>
    <div id="splash" class="overlay">
      <div class="panel">
        <h1>Drift &amp; Deliver</h1>
        <div class="meta">W A S D or arrows to drive, Space to drift, Shift for nitro. Collect coins, stars and hearts; keep the streak alive.</div>
        <button id="start" disabled>Start</button>
      </div>
    </div>
    <div id="loading" class="overlay"><div class="panel"><h1>Loading the city</h1><div class="meta" id="loading-status">Building blocks, buildings and traffic.</div></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
