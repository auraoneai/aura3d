<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/fonts/local.css" />
    <title>The Bellkeeper's Walk</title>
    <style>
      :root { color-scheme: light; --ink: #2b2a24; --panel: rgba(255, 252, 240, 0.82); --line: rgba(43, 42, 36, 0.18); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #c9dfe9; color: var(--ink); font: 400 13px/1.45 "Graphik Web", sans-serif; overflow: hidden; }
      canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(6px); }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #quest { position: absolute; top: 12px; left: 12px; font-weight: 500; }
      #toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); max-width: min(560px, 90vw); text-align: center; opacity: 0; transition: opacity 0.25s; }
      #toast.on { opacity: 1; }
      #hint { position: absolute; top: 12px; right: 12px; font-size: 12px; color: #4b4a40; }
      @media (max-width: 560px) {
        #quest { top: max(8px, env(safe-area-inset-top)); left: 8px; }
        #hint { top: calc(max(8px, env(safe-area-inset-top)) + 44px); left: 8px; right: 8px; }
      }
      /* touch: no keyboard hint; the toast sits above the touch pad, its buttons and the reach prompt (ui.ts) */
      @media (pointer: coarse) { #hint { display: none; } #toast { bottom: calc(256px + env(safe-area-inset-bottom)); } }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #c9dfe9; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="world" tabindex="0"></canvas>
    <div id="hud">
      <div id="quest" class="panel"><span id="found">0 / 3 discovered</span><span id="complete" class="hidden"> · the bell has sung</span></div>
      <div id="hint" class="panel">WASD or arrows to walk · Space to hop · E to interact</div>
      <div id="toast" class="panel"></div>
    </div>
    <div id="loading"><div class="panel" id="loading-status">Drawing the valley…</div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
