name: Agent Skills

on:
  push:
    branches: [main, develop, 'agent-skills/**']
    paths:
      - 'packages/aura3d-cli/skills/**'
      - 'packages/create-aura3d/skills/**'
      - 'packages/create-aura3d/src/**'
      - 'packages/aura3d-cli/src/**'
      - '.cursor/skills/**'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'tools/agent-skills/**'
      - 'tools/agent-docs/**'
      - 'docs/agents/**'
      - 'llms.txt'
      - 'public/llms.txt'
      - '.github/workflows/agent-skills.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills gate + agent docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Skills gate
        run: pnpm check:skills
      - name: Skills unit tests
        run: pnpm exec vitest run tests/unit/create-aura3d/agent-skills.test.ts tests/unit/create-aura3d/templates.test.ts --reporter=dot
      - name: aura3d init test
        run: pnpm exec vitest run tests/unit/aura3d-cli/assets.test.ts -t "writes agent instruction files" --reporter=dot
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Agent docs gate (includes skills gate)
        run: pnpm check:agent-docs
