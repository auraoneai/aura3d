name: QR PRD15 specs (browser)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

concurrency:
  group: qr-prd15-specs-${{ github.ref }}
  cancel-in-progress: true

env:
  A3D_WEBGPU_BROWSER_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  NODE_EXTRA_CA_CERTS: /etc/ssl/cert.pem
  PRD15_FLAGS: none

jobs:
  specs:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox]
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build engine + rendering dists
        run: pnpm build:raw

      - name: Install ${{ matrix.project }} browser
        if: matrix.project != 'chromium'
        run: pnpm exec playwright install ${{ matrix.project }}

      - name: PRD15 specs (${{ matrix.project }})
        run: pnpm exec playwright test --project=${{ matrix.project }} --config=playwright.prd15-specs.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd15-specs-${{ matrix.project }}
          path: |
            tests/reports/prd15/**
            tests/reports/prd15-specs.json
          if-no-files-found: ignore
