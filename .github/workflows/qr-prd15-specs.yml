name: QR PRD15 specs (browser)

# Throughput: 3 macOS jobs per run. On pull_request they run only when the
# specs or the surfaces they exercise change; every main push, the nightly
# schedule and workflow_dispatch run them in full.
on:
  pull_request:
    paths:
      - "tests/qr/prd15/**"
      - "playwright.prd15-specs.config.ts"
      - "packages/engine/src/agent-api/compiler/**"
      - "packages/engine/src/agent-api/app/createAuraApp.ts"
      - "packages/engine/src/lanes/prd15.ts"
      - "packages/rendering/src/lean*"
      - "packages/rendering/src/lean/**"
      - "packages/rendering/src/LeanWebGL2Device.ts"
      - "tools/packed-consumer-check/**"
      - "tools/finalize-dist/**"
      - ".github/workflows/qr-prd15-specs.yml"
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

concurrency:
  group: qr-prd15-specs-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-main-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  A3D_WEBGPU_BROWSER_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  NODE_EXTRA_CA_CERTS: /etc/ssl/cert.pem
  PRD15_FLAGS: none

jobs:
  specs:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox]
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build engine + rendering dists
        run: pnpm build:raw

      - name: Install ${{ matrix.project }} browser
        if: matrix.project != 'chromium'
        run: pnpm exec playwright install ${{ matrix.project }}

      - name: PRD15 specs (${{ matrix.project }})
        run: pnpm exec playwright test --project=${{ matrix.project }} --config=playwright.prd15-specs.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd15-specs-${{ matrix.project }}
          path: |
            tests/reports/prd15/**
            tests/reports/prd15-specs.json
          if-no-files-found: ignore
