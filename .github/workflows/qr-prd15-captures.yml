name: QR-15 lean fixture captures

# PRD-15 T4.7 / §16.3 — builds the lane's lean-template fixture scenes
# (prd15-lean-product, prd15-lean-minigame) from the PACKED engine + lean
# tarballs and captures them at 1920×1080 and 390×844 on an Apple-silicon GPU
# runner (ANGLE Metal). Images + diagnostics land in a GitHub artifact; the
# §16.3 review packet compares product against the 02-pbr-product three r185
# frame and minigame against its absolute four-feature criterion.

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/qr/prd15/fixtures/lean-templates/**"
      - "packages/lean/**"
      - "tools/lean-fixture-capture/**"
      - "tools/packed-consumer-check/**"
      - ".github/workflows/qr-prd15-captures.yml"
  push:
    branches: ["qr/**"]
    paths:
      - "tests/qr/prd15/fixtures/lean-templates/**"
      - "packages/lean/**"
      - "tools/lean-fixture-capture/**"
      - "tools/packed-consumer-check/**"
      - ".github/workflows/qr-prd15-captures.yml"
  workflow_dispatch:

concurrency:
  group: qr-prd15-captures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-fixture-captures:
    name: Lean fixture captures (macos-14, ANGLE Metal)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dist/ must exist so the packed tarballs carry real output.
      - run: pnpm build:raw
      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium
      - name: Build fixtures from packed tarballs and capture
        run: >-
          pnpm exec tsx --tsconfig tsconfig.base.json tools/lean-fixture-capture/index.ts
          --out "$RUNNER_TEMP/lean-fixtures"
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd15-lean-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/lean-fixtures
          retention-days: 30
