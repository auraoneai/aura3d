# Managed by org automation: one-way mirror GitHub -> GitLab.
# GitHub is the source of truth. Do not edit by hand.
name: mirror-to-gitlab
on:
  push:
    branches: ['main']
    tags: ['**']
  schedule:
    - cron: '23 5 * * *'  # daily full reconcile of all refs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true  # no-op on repos without LFS; required for LFS push-through
      - name: Push all refs to GitLab mirror
        run: |
          git remote remove gitlab 2>/dev/null || :
          git remote add gitlab "${{ secrets.GITLAB_MIRROR_URL }}"
          # LFS repos: fetch objects for ALL refs (checkout only fetches some).
          # No-op on repos without LFS.
          git lfs fetch --all origin || true
          # Mirror every GitHub branch (refs/remotes/origin/*), not only local
          # ones: a checkout has just one local branch, so `--all --prune`
          # deleted every other branch on GitLab, including the qr/** branches
          # the qr-gitlab-ci bridge had just synced. Prune still drops branches
          # deleted on GitHub. If a protected ref blocks pruning, fall back to a
          # plain push so content still syncs (prune retried next run).
          git remote set-head origin -d 2>/dev/null || :   # never mirror origin/HEAD as a branch
          refspec='refs/remotes/origin/*:refs/heads/*'
          git push gitlab --force --prune "$refspec" || git push gitlab --force "$refspec"
          git push gitlab --force --tags
