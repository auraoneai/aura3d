name: QR prd02 lighting quality

# PRD-02 lane gate (Lighting, IBL, Reflections and Shadows). Mirrors
# qr-contracts.yml conventions: unit + browser + lane-capture on the
# PR/push path; workflow_dispatch controls which lane flags and whether
# the committed flag-none baseline (§16.1) is refreshed.

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/quality-rebuild/scenes/prd02/**"
      - "benchmarks/quality-rebuild/aura3d/scenes/prd02/**"
      - "benchmarks/quality-rebuild/three/scenes/prd02/**"
      - "tests/qr/prd02/**"
      - "tests/unit/contracts/impl/prd02-*"
      - "tests/unit/agent-api/prd02-*"
      - "packages/rendering/src/environment/**"
      - "packages/rendering/src/probes/**"
      - "packages/rendering/src/shadows/**"
      - "packages/rendering/src/environment/sh9.ts"
      - "packages/rendering/src/runtime/lightingAdapter.ts"
      - "packages/rendering/src/agent-api/environment.ts"
      - "packages/rendering/src/agent-api/lights.ts"
      - "packages/rendering/src/shaders/chunks/lighting_ibl.glsl.ts"
      - "packages/rendering/src/shaders/chunks/lighting_punctual.glsl.ts"
      - "packages/rendering/src/shaders/chunks/shadow_receive.glsl.ts"
      - "packages/rendering/src/shaders/chunks/shadow_caster.glsl.ts"
      - "packages/rendering/src/shaders/chunks/sh9.glsl.ts"
      - "packages/rendering/src/shaders/chunks/contact_shadow.glsl.ts"
      - "packages/rendering/src/passes/ContactShadowPass.ts"
      - "packages/rendering/src/passes/Prd02*.ts"
      - "packages/rendering/src/renderer/ShadowOrchestration.ts"
      - "packages/rendering/src/renderer/Background.ts"
      - "packages/rendering/src/forward/Lighting.ts"
      - "packages/rendering/src/LightUniforms.ts"
      - "packages/rendering/src/DepthPass.ts"
      - "packages/rendering/src/ShadowPass.ts"
      - "packages/rendering/src/ShadowMap.ts"
      - "packages/rendering/src/CascadedShadowMaps.ts"
      - "packages/rendering/src/ReflectionProbe.ts"
      - "packages/rendering/src/ClusteredForwardLighting.ts"
      - "packages/rendering/src/EnvironmentMapResources.ts"
      - "packages/rendering/src/EnvironmentLighting.ts"
      - "packages/rendering/src/EnvironmentBackgroundPass.ts"
      - "packages/rendering/src/EnvironmentBackgroundResources.ts"
      - "packages/rendering/src/EnvironmentPipeline.ts"
      - "packages/rendering/src/EnvironmentPlatform.ts"
      - "packages/rendering/src/ExternalParityRenderPreset.ts"
      - "packages/rendering/src/webgl2/Samplers.ts"
      - "packages/rendering/src/production-runtime/environment/**"
      - "packages/rendering/src/production-runtime/PBRHDRPipeline.ts"
      - "packages/rendering/src/lanes/prd02.ts"
      - "packages/rendering/src/workers/cpuPrefilter.ts"
      - "packages/rendering/src/build/prefilterBaker.ts"
      - "packages/aura3d-cli/src/commands/prd02/**"
      - "packages/engine/src/lanes/prd02.ts"
      - "packages/engine/src/agent-api/compiler/environment.ts"
      - "packages/engine/src/agent-api/compiler/lights.ts"
      - "packages/engine/src/agent-api/compiler/shadows.ts"
      - "packages/engine/src/agent-api/compiler/compileScene.ts"
      - "public/aura-environments/**"
      - "eslint/qr/prd02*.js"
      - "docs/project/aura3d-quality-rebuild/evidence/prd02/**"
      - "docs/project/aura3d-quality-rebuild/PRD-02-lighting-ibl-reflection-shadows.md"
      - ".github/workflows/lighting-quality.yml"
  push:
    branches:
      - "main"
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      flags:
        description: "Flags to capture under (none / lighting / lighting,csm / lighting,probes / lighting,contact)"
        default: "none"
      scenes:
        description: "Comma-separated prd02- scene ids; empty = all"
        default: ""
      engines:
        description: "Comma-separated engines (aura3d,three)"
        default: "aura3d,three"
      update_baseline:
        description: "Commit captures as the flag-none baseline (flags=none only)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: unit (prd02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lane typecheck
        run: pnpm exec tsc --noEmit -p benchmarks/quality-rebuild/scenes/prd02/tsconfig.json
      - name: lane unit tests
        run: pnpm exec vitest run --config tests/qr/prd02/vitest.config.ts
      - name: scene lint (lane config)
        run: pnpm exec eslint "benchmarks/quality-rebuild/scenes/prd02/**/*.ts" "benchmarks/quality-rebuild/{aura3d,three}/scenes/prd02/**/*.ts" "tests/qr/prd02/**/*.ts"

  browser:
    name: browser conformance (prd02)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Specs import engine/rendering src, which resolves @aura3d/* bare
      # specifiers to packages/*/dist — build it or contracts/flags.state
      # is a missing module (the 2/5 lane.spec failure in run 37774324490).
      - name: build package dist
        run: pnpm build
      # 02-S8/S10 pixel specs render lane.html from the lane bundle
      # (tests/qr/prd02/browser/lane-page.ts throws if it is missing).
      - name: build lane bundle
        run: pnpm exec vite build --config benchmarks/quality-rebuild/scenes/prd02/vite.lane.config.ts
      - run: pnpm exec playwright install chromium
      - name: prd02 browser specs
        run: pnpm exec playwright test tests/qr/prd02/browser --config tests/qr/prd02/playwright.prd02.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd02-browser-report-${{ github.sha }}
          path: tests/reports/qr-prd02-browser.json
          if-no-files-found: warn
          retention-days: 30

  lane-capture:
    name: lane capture + baselines
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: build lane bundle
        run: pnpm exec vite build --config benchmarks/quality-rebuild/scenes/prd02/vite.lane.config.ts
      - name: capture flag=none
        run: |
          SCENES_ARG=""
          if [ -n "${{ github.event.inputs.scenes }}" ]; then SCENES_ARG="--scenes ${{ github.event.inputs.scenes }}"; fi
          pnpm exec tsx benchmarks/quality-rebuild/scenes/prd02/capture-lane.ts \
            --flags "${{ github.event.inputs.flags || 'none' }}" \
            --engines "${{ github.event.inputs.engines || 'aura3d,three' }}" \
            $SCENES_ARG \
            --out benchmarks/quality-rebuild/scenes/prd02/out
      - name: commit flag-none baseline
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_baseline == 'true' && (github.event.inputs.flags == '' || github.event.inputs.flags == 'none')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "qr-prd02-bot"
          git config user.email "qr-prd02-bot@users.noreply.github.com"
          mkdir -p docs/project/aura3d-quality-rebuild/evidence/prd02/lighting-baseline
          cp -r benchmarks/quality-rebuild/scenes/prd02/out docs/project/aura3d-quality-rebuild/evidence/prd02/lighting-baseline/prd02-"$(date +%Y%m%d)"
          git add docs/project/aura3d-quality-rebuild/evidence/prd02/lighting-baseline
          git diff --cached --quiet && echo "no baseline changes — nothing to commit" || git commit -m "chore(qr-02): refresh prd02 flag-none baseline"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd02-lane-capture-${{ github.sha }}
          path: benchmarks/quality-rebuild/scenes/prd02/out
          retention-days: 30

  # Lane-02 GPU job (program-lead ruling 2026-10-11): the prd02 browser specs
  # and the lane capture on the self-hosted NVIDIA scale set (labels
  # self-hosted + azure-gpu, Vulkan ANGLE), alongside the macos-14 jobs.
  # Dispatch-only, so PR code (forks included) never reaches the self-hosted
  # runner. Chrome args follow qr-azure-gpu.yml (#956):
  # vars.QR_AZURE_GPU_CHROME_ARGS, else the Vulkan ANGLE default below.
  # The renderer step fails the job on a missing WebGL2 context or a software
  # rasterizer. Frames are never compared across runner types.
  gpu:
    name: prd02 specs + lane capture (azure-gpu)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, azure-gpu]
    timeout-minutes: 180
    env:
      QR_AZURE_GPU_CHROME_ARGS: ${{ vars.QR_AZURE_GPU_CHROME_ARGS }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: chrome args
        run: |
          args="${QR_AZURE_GPU_CHROME_ARGS:---headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist}"
          source="default"; [ -n "$QR_AZURE_GPU_CHROME_ARGS" ] && source="vars.QR_AZURE_GPU_CHROME_ARGS"
          echo "chrome args ($source): $args" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "QR_PRD02_CHROME_ARGS=$args"; echo "QR_BENCH_CHROME_ARGS=$args"; } >> "$GITHUB_ENV"
      - name: WebGL renderer must be the GPU
        id: renderer
        run: |
          mkdir -p benchmarks/quality-rebuild/scenes/prd02/out
          pnpm exec tsx benchmarks/quality-rebuild/scenes/prd02/gpu-probe.ts | tee benchmarks/quality-rebuild/scenes/prd02/out/renderer.json
          echo "renderer: $(cat benchmarks/quality-rebuild/scenes/prd02/out/renderer.json)" >> "$GITHUB_STEP_SUMMARY"
      - name: build package dist
        run: pnpm build
      - name: build lane bundle
        id: bundle
        run: pnpm exec vite build --config benchmarks/quality-rebuild/scenes/prd02/vite.lane.config.ts
      - name: prd02 browser specs
        run: pnpm exec playwright test tests/qr/prd02/browser --config tests/qr/prd02/playwright.prd02.config.ts
      # Runs after a red spec step too (the job stays red): the captures are
      # the screenshots that go with the spec numbers.
      - name: lane capture
        if: (success() || failure()) && steps.renderer.outcome == 'success' && steps.bundle.outcome == 'success'
        env:
          IN_FLAGS: ${{ github.event.inputs.flags || 'none' }}
          IN_SCENES: ${{ github.event.inputs.scenes }}
          IN_ENGINES: ${{ github.event.inputs.engines || 'aura3d,three' }}
        run: |
          scenes_arg=()
          if [ -n "$IN_SCENES" ]; then scenes_arg=(--scenes "$IN_SCENES"); fi
          pnpm exec tsx benchmarks/quality-rebuild/scenes/prd02/capture-lane.ts \
            --flags "$IN_FLAGS" \
            --engines "$IN_ENGINES" \
            "${scenes_arg[@]}" \
            --out benchmarks/quality-rebuild/scenes/prd02/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd02-gpu-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/reports/qr-prd02-browser.json
            benchmarks/quality-rebuild/scenes/prd02/out
          if-no-files-found: warn
          retention-days: 30
