name: QR prd13 looks capture

# Lane 13 (PRD-13) visual proof for A3D_QR_LOOKS: builds every create-aura3d
# template against the workspace sources (tools/agent-templates/
# build-templates-workspace.ts; no publish-all pack, so the #442 package cycle
# does not block it) and captures each one with flags `none` and `looks` on
# an Apple-silicon GPU runner (ANGLE Metal). Frames are compared only within
# this workflow's macos-14 runs. No secrets; artifacts always upload; the job
# result is the capture result (no continue-on-error).

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/engine/src/agent-api/looks/**"
      - "packages/create-aura3d/templates/**"
      - "tools/agent-templates/**"
      - "fixtures/environment-corpus/hdri/**"
      - ".github/workflows/qr-prd13-looks-capture.yml"
  push:
    branches: [main]
    paths:
      - "packages/engine/src/agent-api/looks/**"
      - "packages/create-aura3d/templates/**"
      - "tools/agent-templates/**"
      - ".github/workflows/qr-prd13-looks-capture.yml"
  workflow_dispatch:
    inputs:
      templates:
        description: "Comma-separated template dirs (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: qr-prd13-looks-capture-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-main-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  capture:
    name: Looks capture (macos-14, flags=${{ matrix.flags }}, shard ${{ matrix.shard.id }})
    # Same-repo PRs only; fork code never reaches this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flags: [none, looks]
        shard:
          - { id: 1, templates: "product-viewer,cinematic-scene,mini-game,racing-starter,falling-blocks-starter" }
          - { id: 2, templates: "fighting-game,arena-shooter,character-controller,animation-channel,prompt-animation-channel" }
          - { id: 3, templates: "animation-studio,episode-builder,premium-product-viewer,architecture-interior,material-authoring" }
          - { id: 4, templates: "asset-inspector,character-viewer,postprocess-scene,custom-scene,large-scene" }
    env:
      QRC_TEMPLATES: ${{ github.event_name == 'workflow_dispatch' && inputs.templates || matrix.shard.templates }}
      QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Build templates against workspace sources
        id: build
        run: |
          set -o pipefail
          pnpm exec tsx --tsconfig tsconfig.base.json tools/agent-templates/build-templates-workspace.ts \
            --out tools/agent-templates/out/workspace-build | tee build.log
          echo "sources=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"
      - name: Capture templates (flags=${{ matrix.flags }})
        env:
          QRC_FLAGS: ${{ matrix.flags }}
          QRC_OUT: tools/agent-templates/out/looks-capture-${{ matrix.flags }}
        run: node tools/agent-templates/capture-templates.mjs --source "${{ steps.build.outputs.sources }}"
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd13-looks-capture-${{ matrix.flags }}-s${{ matrix.shard.id }}
          path: |
            tools/agent-templates/out/looks-capture-${{ matrix.flags }}/
            tools/agent-templates/out/workspace-build/build-report.json
            build.log
          retention-days: 30
          if-no-files-found: warn

  # Same capture on the L4 GPU runners (Vulkan ANGLE). Frames are compared only
  # within one runner type: never macos-14 vs gpu-l4.
  capture-gpu:
    name: Looks capture (gpu-l4 Vulkan, flags=${{ matrix.flags }}, shard ${{ matrix.shard.id }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, azure-gpu]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flags: [none, looks]
        shard:
          - { id: 1, templates: "product-viewer,cinematic-scene,mini-game,racing-starter,falling-blocks-starter" }
          - { id: 2, templates: "fighting-game,arena-shooter,character-controller,animation-channel,prompt-animation-channel" }
          - { id: 3, templates: "animation-studio,episode-builder,premium-product-viewer,architecture-interior,material-authoring" }
          - { id: 4, templates: "asset-inspector,character-viewer,postprocess-scene,custom-scene,large-scene" }
    env:
      QRC_TEMPLATES: ${{ github.event_name == 'workflow_dispatch' && inputs.templates || matrix.shard.templates }}
      QRC_GPU_ARGS: "--headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Build templates against workspace sources
        id: build
        run: |
          set -o pipefail
          pnpm exec tsx --tsconfig tsconfig.base.json tools/agent-templates/build-templates-workspace.ts \
            --out tools/agent-templates/out/workspace-build | tee build.log
          echo "sources=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"
      - name: Capture templates (flags=${{ matrix.flags }})
        env:
          QRC_FLAGS: ${{ matrix.flags }}
          QRC_OUT: tools/agent-templates/out/looks-capture-gpu-${{ matrix.flags }}
        run: node tools/agent-templates/capture-templates.mjs --source "${{ steps.build.outputs.sources }}"
      - name: Runner resources on failure
        if: failure()
        run: |
          free -m
          nvidia-smi
          df -h .
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd13-looks-capture-gpu-${{ matrix.flags }}-s${{ matrix.shard.id }}
          path: |
            tools/agent-templates/out/looks-capture-gpu-${{ matrix.flags }}/
            tools/agent-templates/out/workspace-build/build-report.json
            build.log
          retention-days: 30
          if-no-files-found: warn
