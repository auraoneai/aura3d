name: QR PRD-04 materials

# Lane 04 workflow (PRD-04 §13 P1-13): unit tests + ChunkHarness conformance +
# flag-`none`/flag-set scene captures on macos-14 (Chromium, ANGLE Metal) — the
# same runner class as quality-rebuild-capture.yml / qr-contracts.yml.
# Artifacts: tests/reports/material-conformance.json + tests/reports/prd04/.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/rendering/src/shaders/physical/**"
      - "packages/rendering/src/shaders/physical-wgsl/**"
      - "packages/rendering/src/materials/**"
      - "packages/rendering/src/lanes/prd04.ts"
      - "packages/rendering/src/textures/**"
      - "packages/rendering/src/forward/**"
      - "packages/assets/src/**"
      - "packages/engine/src/production-runtime/{TypedGLBActor,ModelMaterialOverrides}.ts"
      - "packages/engine/src/production-runtime/material-physical/**"
      - "packages/engine/src/agent-api/compiler/{modelMaterials,textures}.ts"
      - "packages/engine/src/agent-api/nodes/material.ts"
      - "packages/engine/src/lanes/prd04.ts"
      - "packages/aura3d-cli/src/commands/prd04/**"
      - "tools/codemods/pin-emissive-defaults.mjs"
      - "tools/codemods/prd04-model-tint-report.mjs"
      - "tools/generate-extension-matrix.mjs"
      - "benchmarks/quality-rebuild/{scenes,aura3d/scenes,three/scenes}/prd04/**"
      - "tests/qr/prd04/**"
      - "fixtures/asset-corpus/**"
      - ".github/workflows/qr-prd04-materials.yml"
  push:
    branches: ['qr/**', 'main']
    paths:
      - "tests/qr/prd04/**"
      - "benchmarks/quality-rebuild/{scenes,aura3d/scenes,three/scenes}/prd04/**"
      - "packages/rendering/src/shaders/physical/**"
      - "packages/rendering/src/shaders/physical-wgsl/**"
      - "packages/rendering/src/materials/**"
      - "packages/rendering/src/lanes/prd04.ts"
      - "packages/rendering/src/textures/**"
      - "packages/rendering/src/forward/**"
      - "packages/assets/src/**"
      - "packages/engine/src/lanes/prd04.ts"
      - ".github/workflows/qr-prd04-materials.yml"
  schedule:
    # Daily green-signal on main (04-PROMO): promotion is judged off a fresh
    # main run, so main itself must be exercised on a cadence.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      flags:
        description: "QrFlag list for the capture job (none|materials|comma list)"
        required: false
        default: "none"

concurrency:
  group: qr-prd04-materials-${{ github.ref }}
  # 04-PROMO / CI-0: never cancel main runs (promotion is judged off main runs);
  # superseded runs on PR/branch refs may still be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PRD04_CHROMIUM_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI-0/T0-31: lane-scoped typecheck (tests/qr/prd04 + import graph).
      # The repo-wide `pnpm typecheck:raw` gate stays in its own workflow —
      # other lanes' breakers are filed as qr-requests #777/#778/#779.
      - run: pnpm exec tsc --noEmit -p tests/qr/prd04/tsconfig.lane.json
      - name: Lane unit tests (chunk registration, r185 oracle, scenes, codemods)
        run: pnpm exec vitest run -c tests/qr/prd04/vitest.config.ts
      - name: Contract conformance
        run: pnpm exec vitest run tests/unit/contracts
      - name: Ownership check
        run: node tools/qr-ownership/check.mjs

  browser:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Browser conformance (ChunkHarness, ANGLE Metal)
        # All PRD-04 unit-gated browser specs: chunk conformance, lobe numeric parity,
        # transmission capture, decoders/variants. Scene captures run in the `capture` job.
        run: pnpm exec playwright test --config tests/qr/prd04/playwright.config.ts --grep "PRD-04 lobe chunks|PRD-04 physical lobes|PRD-04 transmission|PRD-04 glTF decoders|PRD-04 WGSL twins|PRD-04 S3|PRD-04 S6|PRD-04 S7|PRD-04 S9|PRD-04 S16|PRD-04 §16.2"
      - name: Extension matrix --check (P6-2 truthful matrix)
        # material-conformance.json was just written by the chunk-conformance spec;
        # the tool fails when the report is missing or the matrices drift from it.
        run: node tools/generate-extension-matrix.mjs --check
      - name: Upload material-conformance.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd04-material-conformance
          path: |
            tests/reports/material-conformance.json
            tests/reports/prd04-chunk-harness.json
            tests/reports/physical-lobes-numeric.json
            tests/reports/prd04-decoders-variants.json
            tests/reports/prd04-wgsl-twins.json
            tests/reports/prd04/probes/**/*.json
          if-no-files-found: warn

  browser-all:
    name: Browser conformance (flags=all)
    runs-on: macos-14
    env:
      # P-22: the integrated probes (integrated-acceptance §16.2/§16.3,
      # scene-perf S16 all-vs-all,-materials) only run when PRD04_FLAGS
      # contains 'all' — this job is the all-flags arm they were deferred to.
      PRD04_FLAGS: "all"
      PRD04_CHROMIUM_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist --enable-unsafe-webgpu"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: All-flags browser specs (integrated acceptance, S16, WGSL twins)
        run: pnpm exec playwright test --config tests/qr/prd04/playwright.config.ts --grep "PRD-04 §16.2|PRD-04 S16|PRD-04 WGSL twins|PRD-04 transmission"
      - name: Upload all-flags reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd04-allflags-reports
          path: tests/reports/prd04/
          if-no-files-found: warn

  capture:
    name: Lane captures (flags=${{ github.event_name == 'workflow_dispatch' && inputs.flags || 'none' }})
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Scene captures (prd04-* + legacy reference scenes, both engines)
        env:
          PRD04_FLAGS: ${{ github.event_name == 'workflow_dispatch' && inputs.flags || 'none' }}
          PRD04_SCENES: "prd04-texture-transform,prd04-normal-tangent,prd04-iridescence,prd04-anisotropy,prd04-dispersion,prd04-variants,prd04-ktx2,prd04-tiled-ground,prd04-tinted-hero,prd04-alpha-mask,prd04-damaged-helmet,prd04-transmission,02-pbr-product,03-damaged-helmet,04-clearcoat,05-transmission,06-metal-roughness-sweep,07-sheen-fabric,08-skinned-character"
          PRD04_ENGINES: "aura3d,three"
        run: pnpm exec playwright test --config tests/qr/prd04/playwright.config.ts --grep "lane captures"
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd04-captures-${{ github.event_name == 'workflow_dispatch' && inputs.flags || 'none' }}
          path: tests/reports/prd04/
          if-no-files-found: warn
