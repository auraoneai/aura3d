name: Muse 3.0.1 Aurora 7763aebe
on:
  push:
    branches: [ops/muse301-browser-refresh]
permissions: {contents: read}
env:
  SOURCE_COMMIT: 7763aebe17b4a933c6dc0b56aba2fdff899942ef
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {ref: 7763aebe17b4a933c6dc0b56aba2fdff899942ef, lfs: true}
      - uses: pnpm/action-setup@v4
        with: {version: 11.1.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" && test -z "$(git status --porcelain --untracked-files=all)"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: pnpm build:raw
      - name: Run lane
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_JSON_OUTPUT_NAME=tests/reports/aurora-7763aebe.json pnpm exec playwright test tests/browser/aurora-lander-campaign.spec.ts tests/browser/aurora-lander-terrain.spec.ts tests/browser/aurora-lander-playable.spec.ts --reporter=line,json
          pnpm --dir apps/showcase-aurora-lander evidence:route-health
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse301-aurora-7763aebe
          path: |
            tests/reports/
            apps/showcase-aurora-lander/route-health.json
          if-no-files-found: warn
