name: qr-prd07-vfx
# PRD-07 P1-T16 — lane-owned CI subset (CONTRACTS §4.1 lane row:
# `.github/workflows/prd07-vfx.yml` + `qr-prd07-*.yml`). Runs the lane's unit
# tests on macOS (the browser/capture fleet is darwin-only in this org) plus
# the tsc gate. P-03: no masks — capture and games go red on any non-ready,
# zero-draw or blank scene; every run captures with the full sub-flag set.

on:
  pull_request:
    paths:
      - "packages/rendering/src/{vfx,atmosphere,effects,cinematic}/**"
      - "packages/rendering/src/{DayNightSky,Weather,VolumetricFog,SpriteFlipbook}.ts"
      - "packages/rendering/src/lanes/prd07.ts"
      - "packages/engine/src/{agent-api/vfx,production-runtime/effects}/**"
      - "packages/engine/src/agent-api/{Decals.ts,compiler/{fog,effects,sky}.ts,nodes/{effects,sky,weather,particles}.ts,compiler/diagnosticOnly.prd07.ts}"
      - "packages/engine/src/lanes/prd07.ts"
      - "packages/engine/assets/vfx/**"
      - "packages/aura3d-cli/src/commands/prd07/**"
      - "benchmarks/quality-rebuild/{scenes,aura3d/scenes,three/scenes}/prd07/**"
      - "tools/{vfx-atlas-bake,effects-vfx-visual-audit}/**"
      - "tests/qr/prd07/**"
      - "tests/unit/contracts/impl/prd07-*"
      - "docs/project/aura3d-quality-rebuild/evidence/prd07/**"
      - ".github/workflows/prd07-*.yml"
      - ".github/workflows/qr-prd07-*.yml"
  push:
    branches: [main]
    paths:
      - "packages/rendering/src/{vfx,atmosphere,effects,cinematic}/**"
      - "packages/rendering/src/{DayNightSky,Weather,VolumetricFog,SpriteFlipbook}.ts"
      - "packages/rendering/src/lanes/prd07.ts"
      - "packages/engine/src/{agent-api/vfx,production-runtime/effects}/**"
      - "packages/engine/src/agent-api/{Decals.ts,compiler/{fog,effects,sky}.ts,nodes/{effects,sky,weather,particles}.ts,compiler/diagnosticOnly.prd07.ts}"
      - "packages/engine/src/lanes/prd07.ts"
      - "packages/engine/assets/vfx/**"
      - "packages/aura3d-cli/src/commands/prd07/**"
      - "benchmarks/quality-rebuild/{scenes,aura3d/scenes,three/scenes}/prd07/**"
      - "tools/{vfx-atlas-bake,effects-vfx-visual-audit}/**"
      - "tests/qr/prd07/**"
      - "tests/unit/contracts/impl/prd07-*"
      - "docs/project/aura3d-quality-rebuild/evidence/prd07/**"
      - ".github/workflows/prd07-*.yml"
      - ".github/workflows/qr-prd07-*.yml"
  # Nightly lane audit so a broken main cannot sit green-looking until a PR touches it.
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}

jobs:
  unit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lane unit tests
        run: |
          pnpm exec vitest run --config tests/qr/prd07/vitest.config.ts
          pnpm exec vitest run tests/unit/contracts/impl/prd07-registration.test.ts

  grep-gate:
    # P7-T3 / §10 item 6 — fails when a legacy-seam symbol appears outside the
    # allowlist (new seams are forbidden; after the removal PR the emptied
    # allowlist makes any leftover fail).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Grep gate
        run: bash tests/qr/prd07/grep-gate.sh

  typecheck:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.build.json --noEmit

  bake:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Re-bake atlas and diff against committed output
        run: |
          node tools/vfx-atlas-bake/bake.mjs --seed 7 --size 2048 --out /tmp/vfx-baked
          for f in manifest.json aura-vfx-1k.png aura-vfx-2k.png aura-vfx-2k-decals.png aura-vfx-2k-decals-normal.png aura-vfx-2k-decals-roughness.png aura-vfx-2k-decals-half.png aura-vfx-2k-decals-half-normal.png aura-vfx-2k-decals-half-roughness.png LICENSE.md; do
            shasum -a 256 "packages/engine/assets/vfx/$f" "/tmp/vfx-baked/$f"
            cmp "packages/engine/assets/vfx/$f" "/tmp/vfx-baked/$f" || { echo "::error::bake drift on $f — re-run bake.mjs and commit"; exit 1; }
          done

  browser:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Lane browser tests
        run: pnpm exec playwright test --config tests/qr/prd07/playwright.config.ts
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd07-browser-${{ github.run_id }}
          path: tests/reports/prd07-browser.json
          retention-days: 30
          if-no-files-found: warn
      - name: Capability-degraded codes
        if: always()
        run: |
          if [ -f tests/reports/prd07-browser.json ]; then
            grep -o 'capability-degraded[^"]*' tests/reports/prd07-browser.json | sort -u || echo "none"
          else
            echo "no report"
          fi

  capture:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      QR_BENCH_CHROME_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
      SCENE_LIST: "14-particles,09-outdoor-environment,17-large-environment,18-game-scene,prd07-particles-fountain,prd07-flipbook,prd07-particles-stress,prd07-impact-library,prd07-trails-beams,prd07-sky-timeofday,prd07-outdoor-sky,prd07-fog-height,prd07-fog-transition,prd07-underwater,prd07-rain-night,prd07-snow,prd07-volumetric-shafts,prd07-lit-smoke,prd07-soft-particles,prd07-water-interleave,prd07-decals"
      VFX_FLAGS: "vfx,vfx.sky,vfx.fog,vfx.volumetric,vfx.decals"
      EVIDENCE_DIR: "docs/project/aura3d-quality-rebuild/evidence/prd07/${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch bench LFS blobs
        run: |
          git lfs pull --include="fixtures/asset-corpus/damaged-helmet.glb,fixtures/asset-corpus/antique-camera.glb,fixtures/asset-corpus/clear-coat-test.glb,fixtures/asset-corpus/sheen-test-grid.glb,public/aura-assets/propRockA.52dd1f0f.glb,public/aura-assets/propRockB.c94b2733.glb,public/aura-assets/deepRecoveryCrateStandard.02520123.glb" || echo "::warning::git lfs pull failed"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Build benchmark bundle
        run: pnpm exec vite build --config benchmarks/quality-rebuild/vite.config.ts
      - name: Capture (flags vfx + sub-flags)
        run: >-
          node benchmarks/quality-rebuild/capture.mjs
          --dist benchmarks/quality-rebuild/dist
          --out "$EVIDENCE_DIR/capture-vfx"
          --scenes "$SCENE_LIST"
          --flags "$VFX_FLAGS"
          --strict
      - name: Capture (flags none)
        run: >-
          node benchmarks/quality-rebuild/capture.mjs
          --dist benchmarks/quality-rebuild/dist
          --out "$EVIDENCE_DIR/capture-none"
          --scenes "$SCENE_LIST"
          --flags none
          --strict
      - name: Verify capture reports (no non-ready / zero-draw / missing frame)
        if: always()
        run: node -e '
          const fs = require("fs"), path = require("path");
          const dir = process.env.EVIDENCE_DIR;
          const reports = [];
          (function walk(d) {
            if (!fs.existsSync(d)) return;
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p); else if (e.name === "report.json") reports.push(p);
            }
          })(dir);
          const bad = [];
          for (const rp of reports) {
            const r = JSON.parse(fs.readFileSync(rp, "utf8"));
            for (const s of r.scenes ?? []) {
              for (const [eng, res] of Object.entries(s.engines ?? {})) {
                const p = res?.payload ?? {};
                if (res?.status !== "ready") bad.push(`${rp}:${s.scene}/${eng} status=${res?.status}`);
                else if (eng === "aura3d" && (p.drawCalls ?? 0) === 0) bad.push(`${rp}:${s.scene}/${eng} drawCalls=0`);
                else if (eng === "aura3d" && (p.errors ?? []).length > 0) bad.push(`${rp}:${s.scene}/${eng} errors=${p.errors[0]}`);
              }
            }
          }
          if (reports.length === 0) bad.push(`${dir}: no report.json produced`);
          for (const b of bad) console.error("::error::" + b);
          process.exit(bad.length ? 1 : 0);
        '
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd07-capture-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 30
          if-no-files-found: warn
      - name: Capability-degraded codes
        if: always()
        run: |
          for f in "$EVIDENCE_DIR"/capture-*/report.json; do
            [ -f "$f" ] && echo "== $f" && grep -o '"capability-degraded[^"]*"' "$f" | sort -u || true
          done

  games:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
      GAME_LIST: "showcase-turbo-drift-circuit,showcase-skyline-runner,showcase-neon-swarm,showcase-deep-recovery,showcase-blockfall-reactor"
      VFX_FLAGS: "vfx,vfx.sky,vfx.fog,vfx.volumetric,vfx.decals"
      EVIDENCE_DIR: "docs/project/aura3d-quality-rebuild/evidence/prd07/${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Games (flags vfx + sub-flags)
        run: node tools/quality-rebuild-capture/capture-games.mjs --games "$GAME_LIST" --flags "$VFX_FLAGS" --skip-build --strict --out "$EVIDENCE_DIR/games-vfx" --no-mobile
      - name: Games (flags none)
        run: node tools/quality-rebuild-capture/capture-games.mjs --games "$GAME_LIST" --flags none --skip-build --strict --out "$EVIDENCE_DIR/games-none" --no-mobile
      - name: Verify games report (no non-ready / blank / zero-draw game)
        if: always()
        run: node -e '
          const fs = require("fs"), path = require("path");
          const dir = process.env.EVIDENCE_DIR;
          const reports = [];
          (function walk(d) {
            if (!fs.existsSync(d)) return;
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p); else if (/^report.*\.json$/.test(e.name)) reports.push(p);
            }
          })(dir);
          const bad = [];
          for (const rp of reports) {
            const r = JSON.parse(fs.readFileSync(rp, "utf8"));
            const rows = r.games ?? r.results ?? [];
            for (const g of rows) {
              const shots = g.shots ?? g.screenshots ?? g.captures ?? [];
              if (g.status && g.status !== "ready" && g.status !== "ok" && g.status !== "captured") bad.push(`${rp}:${g.game ?? g.id} status=${g.status}`);
              if (g.drawCalls === 0) bad.push(`${rp}:${g.game ?? g.id} drawCalls=0`);
              if (g.blank === true || g.blankShots > 0) bad.push(`${rp}:${g.game ?? g.id} blank frame`);
              if (Array.isArray(shots) && shots.length === 0) bad.push(`${rp}:${g.game ?? g.id} no screenshots`);
            }
          }
          if (reports.length === 0) bad.push(`${dir}: no report.json produced`);
          for (const b of bad) console.error("::error::" + b);
          process.exit(bad.length ? 1 : 0);
        '
      - name: Upload game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd07-games-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 30
          if-no-files-found: warn

  mobile:
    # §20 — mobile emulation: 390×844, DPR 3, touch. Coverage: the impact
    # library (juice-automount hitSpark), rain/weather production
    # (particles-production) and the sky scenes (sky-background,
    # sky-daynight-identity). PRD07_MOBILE=1 drives the viewport/profile in
    # tests/qr/prd07/playwright.config.ts.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PRD07_MOBILE: "1"
      PLAYWRIGHT_JSON_OUTPUT_NAME: tests/reports/prd07-mobile.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Lane mobile-emulation specs
        run: |
          pnpm exec playwright test --config tests/qr/prd07/playwright.config.ts \
            browser/juice-automount.spec.ts \
            browser/particles-production.spec.ts \
            browser/sky-background.spec.ts \
            browser/sky-daynight-identity.spec.ts
      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd07-mobile-${{ github.run_id }}
          path: tests/reports/prd07-mobile.json
          retention-days: 30
          if-no-files-found: warn
