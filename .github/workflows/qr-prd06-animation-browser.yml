name: QR prd06 animation browser

# Lane 06 (PRD-06 T0.0) — the lane animation-matrix: lane unit impl tests on
# ubuntu and the tests/qr/prd06 browser specs plus the animated-character
# baseline on macos-14 across chromium/webkit/firefox. Public-repo-safe steps
# only; no cloud credentials.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/animation/**"
      - "packages/engine/src/agent-api/AnimationController.ts"
      - "packages/engine/src/agent-api/GameCharacterAnimation.ts"
      - "packages/engine/src/agent-api/VisemeController.ts"
      - "packages/engine/src/agent-api/FootPlanting.ts"
      - "packages/engine/src/agent-api/humanoid-walk-runtime.ts"
      - "packages/engine/src/agent-api/app/actorAnimationHandle.ts"
      - "packages/engine/src/agent-api/compiler/animation.ts"
      - "packages/engine/src/production-runtime/actor/TypedGLBActorAnimation.ts"
      - "packages/assets/src/GLTFAnimationRuntime.ts"
      - "packages/rendering/src/Skinning*"
      - "packages/rendering/src/WebGPUSkinningLimits.ts"
      - "packages/rendering/src/MorphTargetPlan.ts"
      - "packages/rendering/src/Texture.ts"
      - "packages/rendering/src/resources/MorphTargetTexture.ts"
      - "packages/rendering/src/shaders/deform/**"
      - "packages/rendering/src/forward/Deform.ts"
      - "packages/rendering/src/webgl2/TextureUpload.ts"
      - "packages/rendering/src/renderer/SkinnedBounds.ts"
      - "tests/qr/prd06/**"
      - "benchmarks/quality-rebuild/**"
      - "tests/unit/contracts/impl/prd06-*"
      - "tests/unit/agent-api/production-actor-dispatch.test.ts"
      - "tests/unit/agent-api/runtime-node-empty-pose.test.ts"
      - "playwright.animation-matrix.config.ts"
      - ".github/workflows/qr-prd06-animation-browser.yml"
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: qr-prd06-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    # §13 fixed micro-budgets are specified "Node on GH macos-14" — the timing
    # gates are calibrated to that runner class; ubuntu shared vCPUs measure
    # ~1.7x slower and fail the gate on otherwise-correct code.
    runs-on: macos-14
    steps:
      # Real GLBs — LFS-tracked; without this the checkout serves pointer text
      # and clip-fixture tests fall back to the synthetic manifest.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lane impl unit tests
        run: pnpm exec vitest run "tests/unit/contracts/impl/prd06-" "tests/unit/agent-api/production-actor-dispatch" "tests/unit/agent-api/runtime-node-empty-pose" "tests/unit/rendering/texture-update" "tests/unit/rendering/skinning-palette-cache" "tests/unit/assets/gltf-skinning-palette-identity" "tests/unit/animation/animation-controller" "tests/qr/prd06/unit/" --reporter=dot
      # 06-S12 — lane bundle budget gate (lazy-subpath invariant, P1). There is
      # no `check:bundle-size` script in package.json; run the same packed
      # consumer measurement as qr-prd15-bundle-size.yml (fails on budget).
      - name: Build workspace packages (bundle gate)
        run: pnpm build:raw
      - name: Bundle size gate
        run: pnpm exec tsx --tsconfig tsconfig.base.json tools/bundle-size/lit-scene.ts

  browser:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox]
    steps:
      # Real GLBs — specs fetch LFS-tracked rigs/showcase assets over HTTP;
      # a pointer checkout fails scene loads with "version https://git-lfs…"
      # JSON errors (same convention as browser-matrix.yml).
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Specs import @aura3d/engine, which resolves workspace deps (e.g.
      # @aura3d/apps) through their built dist/ — browser-matrix.yml builds
      # before playwright for the same reason.
      - name: Build workspace packages
        run: pnpm build:raw
      - name: Install ${{ matrix.project }} browser
        run: pnpm exec playwright install ${{ matrix.project }}
      - name: Configure native Metal browser (chromium)
        if: matrix.project == 'chromium'
        run: |
          cat > "$RUNNER_TEMP/chrome-metal" <<'SH'
          #!/bin/sh
          exec "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --use-angle=metal "$@"
          SH
          chmod +x "$RUNNER_TEMP/chrome-metal"
      - name: Animation-matrix specs (${{ matrix.project }})
        env:
          A3D_WEBGPU_BROWSER_EXECUTABLE: ${{ matrix.project == 'chromium' && format('{0}/chrome-metal', runner.temp) || '' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: "tests/reports/prd06-animation-matrix-${{ matrix.project }}.json"
        run: pnpm exec playwright test --config playwright.animation-matrix.config.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd06-animation-matrix-${{ matrix.project }}
          path: |
            tests/reports/
            test-results/
          if-no-files-found: ignore

  # Lane-06 GPU visual proof (self-hosted NVIDIA L4, Vulkan ANGLE): base scenes
  # 01-simple-geometry (rigid control), 08-skinned-character (bind pose) and
  # 15-animation-skinning (walk clip) plus the prd06 lane scenes, captured per flag set
  # (none / animation / $ALL / $ALL,strict) on both engines, PNGs and
  # report.json uploaded. Same-repo PRs and manual dispatch only, so fork PR
  # code never reaches the self-hosted runner. Frames compare only within this
  # job's GPU class (renderer string recorded first).
  gpu:
    name: GPU lane capture (self-hosted azure-gpu / Vulkan)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, azure-gpu, gpu-l4]
    timeout-minutes: 120
    env:
      QR_BENCH_OUT: benchmarks/quality-rebuild/out
      QR_BENCH_SCENES: "01-simple-geometry,08-skinned-character,15-animation-skinning,prd06-skinned-character-posed,prd06-crossfade-filmstrip,prd06-morph-face,prd06-ik-slope,prd06-character-hero"
      QR_BENCH_ENGINES: "aura3d,three"
      QR_ALL_FLAGS: "core,lighting,post,materials,assets,animation,vfx,camera,game,world,tiers,looks,compiler"
      QR_AZURE_GPU_CHROME_ARGS: ${{ vars.QR_AZURE_GPU_CHROME_ARGS }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Chromium GPU args
        run: |
          set -euo pipefail
          args="${QR_AZURE_GPU_CHROME_ARGS:---headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist}"
          echo "QR_BENCH_CHROME_ARGS=$args" >> "$GITHUB_ENV"
          echo "chromium args: $args" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record the WebGL renderer (fails on a software renderer)
        run: |
          set -euo pipefail
          mkdir -p "$QR_BENCH_OUT"
          node --input-type=module -e '
            import { chromium } from "@playwright/test";
            const args = (process.env.QR_BENCH_CHROME_ARGS ?? "").split(/\s+/).filter(Boolean);
            const browser = await chromium.launch({ args });
            const page = await browser.newPage();
            const r = await page.evaluate(() => {
              const gl = document.createElement("canvas").getContext("webgl2");
              if (!gl) return "no-webgl2";
              const ext = gl.getExtension("WEBGL_debug_renderer_info");
              return String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
            });
            await browser.close();
            console.log(r);
            if (/swiftshader|llvmpipe|software|no-webgl2/i.test(r)) { console.error("software renderer: " + r); process.exit(1); }
          ' | tee "$QR_BENCH_OUT/renderer.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runner: $RUNNER_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Capture lane scenes per flag set
        run: |
          set -euo pipefail
          export QR_BENCH_FLAG_SETS="none;animation;$QR_ALL_FLAGS;$QR_ALL_FLAGS,strict"
          bash benchmarks/quality-rebuild/ci.sh
      - name: Build workspace packages (lane specs)
        if: always()
        run: pnpm build:raw
      - name: Lane browser specs on the GPU (chromium, Vulkan ANGLE)
        if: always()
        env:
          A3D_DISABLE_SYSTEM_WEBGPU_BROWSER: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "benchmarks/quality-rebuild/out/prd06-animation-matrix-gpu.json"
        run: |
          set -euo pipefail
          export A3D_PRD06_CHROME_ARGS="$QR_BENCH_CHROME_ARGS"
          pnpm exec playwright test --config playwright.animation-matrix.config.ts --project=chromium --output benchmarks/quality-rebuild/out/test-results
      - name: Upload GPU evidence (PNGs, report.json, bisect-summary.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd06-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/quality-rebuild/out/
          retention-days: 30
          if-no-files-found: error
