name: Native WebGPU Functional Evidence 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l01-exact-package-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92b96c0ac7cdb53669ba416159ebb78daafe7840
          fetch-depth: 1
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify immutable candidate
        run: |
          test "$(git rev-parse HEAD)" = 92b96c0ac7cdb53669ba416159ebb78daafe7840
          test -z "$(git status --short)"
      - name: Install exact dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build, pack once, and replay L01
        env:
          AURA3D_REMOTE_PROVIDER: github-actions
          AURA3D_REMOTE_WORKER_ID: ${{ runner.name }}
        run: pnpm exec tsx --tsconfig tsconfig.base.json tools/release/l01-producer.ts tests/reports/muse3jsparity/l01/92b96c0a
      - name: Retain exact L01 evidence and tarballs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse301-l01-92b96c0a-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tests/reports/muse3jsparity/l01/92b96c0a/
            tests/reports/release-tarballs/
            docs/project/release-artifacts.json
            tests/reports/release-frozen-lock.json
            tests/reports/agent-templates.json
            tests/reports/installed-template-lifecycle.json
            tests/reports/public-surface-diff-3.0.1.json
            tests/reports/package-clean-install.json
            tests/reports/import-smoke.json
            tests/reports/exports.json
            tests/reports/package-install-smoke.json
            tests/reports/package-provenance.json
            tests/reports/bundle-size.json
            tests/reports/installed-tree-shaking.json
