name: Worktree consolidation validation
on:
  push:
    branches: [consolidate/worktrees-20261012]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'f26a9f79f6d1fdf65bacd5643aa4473eea443ffc' || github.sha }}
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Release helper tests
        if: ${{ !cancelled() }}
        run: node --test tests/unit/release/exact-plan.test.mjs
      - name: Camera and game unit tests
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tests/unit/apps tests/qr/prd14/pulse-tunnel --maxWorkers=2 --reporter=dot
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build:raw
  gpu:
    runs-on: [self-hosted, azure-gpu, gpu-l4]
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
        batch: [a, b, c]
    env:
      QRC_LOCAL_BUILD: 'true'
      QRC_FLAGS: 'core,lighting,camera,materials,assets,animation,post,vfx'
      QRC_FLAGS_EXACT: 'true'
      QRC_VIEWPORTS: '1280x720'
      QRG_VARIANTS: 'engine-default'
      QRC_GPU_ARGS: '--headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'f26a9f79f6d1fdf65bacd5643aa4473eea443ffc' || github.sha }}
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Select batch
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          case "$BATCH" in
            a) games='showcase-blockfall-reactor,showcase-vault-breakers,showcase-courier-rush,showcase-neon-swarm,showcase-rooftop-buckets,showcase-mech-hangar' ;;
            b) games='showcase-skyline-runner,showcase-turbo-drift-circuit,showcase-siege-golf,showcase-aurora-lander,showcase-gravity-post,showcase-pulse-tunnel' ;;
            c) games='aura-clash-showcase,showcase-gallery-shift,showcase-deep-recovery,showcase-patrol-wing,showcase-bank-shot,showcase-orbital-defense' ;;
          esac
          echo "QRC_GAMES=$games" >> "$GITHUB_ENV"
      - name: Verify L4 renderer
        run: node tools/quality-rebuild-capture/gpu-renderer.mjs | tee renderer.txt && grep -q ' L4' renderer.txt
      - name: Game assets
        run: git lfs pull --include='public/aura-assets/**,apps/*/public/**'
      - name: Build games
        run: node tools/quality-rebuild-capture/capture-games.mjs --build-only
      - name: Capture
        run: node tools/quality-rebuild-capture/capture-games.mjs --skip-build
      - name: Gameplay
        if: ${{ !cancelled() }}
        run: node tools/quality-rebuild-capture/gameplay-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-${{ matrix.revision }}-${{ matrix.batch }}
          path: |
            renderer.txt
            tools/quality-rebuild-capture/out/
            tools/quality-rebuild-capture/out-gameplay/
            tools/quality-rebuild-capture/.build/build-report.json
          include-hidden-files: true
          retention-days: 14
