name: Muse 3.0.1 Aura Clash e300225d
on:
  push:
    branches: [ops/muse301-clash-adc0c3bf]
permissions: {contents: read}
env: {SOURCE_COMMIT: e300225d5beeaafb6f84d93ee3ed38998773b2f4}
jobs:
  clash:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: e300225d5beeaafb6f84d93ee3ed38998773b2f4, lfs: true}
      - uses: pnpm/action-setup@v4
        with: {version: 11.1.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" && test -z "$(git status --porcelain --untracked-files=all)"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install chromium
      - run: test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - run: pnpm build:raw
      - name: Instrument retained first-frame telemetry
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('apps/aura-clash-showcase/tests/visual-regression.spec.ts')
          s=p.read_text().replace('  expect(proof.lighting?.readable).toBe(true);', '  console.log("AURA_CLASH_VISUAL_TELEMETRY", JSON.stringify({state, performance: proof.performance, postProcess: proof.postProcess, renderer: proof.renderer}));\n  expect(proof.lighting?.readable).toBe(true);')
          p.write_text(s)
          PY2
      - run: pnpm --dir apps/aura-clash-showcase exec playwright test tests/visual-regression.spec.ts --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse301-clash-e300225d
          path: |
            apps/aura-clash-showcase/launch-evidence/aura-clash-visual-*.png
            apps/aura-clash-showcase/test-results/
          if-no-files-found: warn
