name: QR flicker probe

# Temporal-stability probe (tools/quality-rebuild-capture/flicker/probe.mjs): 120 virtual-clock
# 60 Hz frames per game per qr-flag arm on the Track 0 L4 runners. Diagnostic only; never gates.
on:
  workflow_dispatch:
    inputs:
      arms: { description: "';'-separated arms (default | none | -flag | comma list)", required: false, default: "default;-post;-vfx;-animation;-lighting" }
      mode: { description: "timeline | idle", required: false, default: "timeline" }
      games: { description: "Comma-separated game ids (empty = shard all 18)", required: false, default: "" }
  push:
    branches: ["qr/flicker-probe-*"]

permissions:
  contents: read

concurrency:
  group: qr-flicker-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    name: "flicker probe shard ${{ matrix.shard }}"
    # Shards alternate track0 / azure-gpu L4 pools; every comparison is within one game (one runner).
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            labels: '["self-hosted","track0","gpu-l4"]'
            games: "aura-clash-showcase,showcase-blockfall-reactor,showcase-skyline-runner"
          - shard: b
            labels: '["self-hosted","azure-gpu","gpu-l4"]'
            games: "showcase-turbo-drift-circuit,showcase-siege-golf,showcase-aurora-lander"
          - shard: c
            labels: '["self-hosted","track0","gpu-l4"]'
            games: "showcase-neon-swarm,showcase-gravity-post,showcase-courier-rush"
          - shard: d
            labels: '["self-hosted","azure-gpu","gpu-l4"]'
            games: "showcase-pulse-tunnel,showcase-mech-hangar,showcase-vault-breakers"
          - shard: e
            labels: '["self-hosted","track0","gpu-l4"]'
            games: "showcase-rooftop-buckets,showcase-gallery-shift,showcase-deep-recovery"
          - shard: f
            labels: '["self-hosted","azure-gpu","gpu-l4"]'
            games: "showcase-patrol-wing,showcase-bank-shot,showcase-orbital-defense"
    env:
      QRC_GAMES: ${{ inputs.games || matrix.games }}
      FLK_GAMES: ${{ inputs.games || matrix.games }}
      FLK_ARMS: ${{ inputs.arms || vars.FLK_ARMS || 'default;-post;-vfx;-lighting;none' }}
      FLK_MODE: ${{ inputs.mode || 'timeline' }}
      QRC_LOCAL_BUILD: "true"
      QRC_GPU_ARGS: "--headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Game assets (LFS)
        run: git lfs pull --include="public/aura-assets/**,apps/*/public/**"
      - name: Build games
        run: node tools/quality-rebuild-capture/capture-games.mjs --build-only
      - name: Probe
        timeout-minutes: 110
        run: node tools/quality-rebuild-capture/flicker/probe.mjs
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-flicker-${{ matrix.shard }}-${{ github.run_id }}
          path: tools/quality-rebuild-capture/out/flicker/
          retention-days: 14
          if-no-files-found: error
