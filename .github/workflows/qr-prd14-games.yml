name: QR PRD-14 games

# Lane 14 gate (T1.9). On PRs touching lane-owned paths: runs the T1.x unit
# suite, check-route-health and check-art-direction for the changed routes,
# then captures only the changed games on macos-14 (ANGLE Metal) with
# QRC_LOCAL_BUILD=true and --flags route-<id>, runs the runtime art-direction
# audit, and uploads evidence/prd14/<run>/ artifacts.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/game/src/art/**"
      - "tools/quality-gate/**"
      - "tools/quality-rebuild-capture/games.json"
      - "tests/qr/prd14/**"
      - "scripts/check-route-health.mjs"
      - "scripts/check-art-direction.mjs"
      - ".github/workflows/qr-prd14-games.yml"
  push:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      games:
        description: "QRC_GAMES override (comma-separated app dirs)"
        required: false
        default: ""
      runner:
        # 14-S1..S9 on the GPU pool (program-lead ruling): same labels as
        # qr-azure-gpu.yml (#956). Frames compare within one runner class only.
        description: "Capture runner: macos-14 (default) | azure-gpu (L4) | track0 (L4)"
        type: choice
        options: [macos-14, azure-gpu, track0]
        default: macos-14

concurrency:
  group: qr-prd14-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"

jobs:
  unit:
    name: T1.x unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lane 14 vitest suite
        # CI-1: scoped to lane-14 suites. Other lanes' impl tests run in the
        # repo-wide qr-contracts gate; their reds must not mask lane 14's.
        run: pnpm exec vitest run --config tests/qr/prd14/vitest.config.ts tests/qr/prd14 tests/unit/contracts/impl/prd14-* tests/unit/contracts/C-35-art.test.ts

  routes:
    name: Detect changed routes
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.changed.outputs.ids }}
      dirs: ${{ steps.changed.outputs.dirs }}
      flags: ${{ steps.changed.outputs.flags }}
      count: ${{ steps.changed.outputs.count }}
      skip_ok: ${{ steps.changed.outputs.skip_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          GAMES_INPUT: ${{ inputs.games }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          # CI-1: no shallow re-fetch — it broke "$BASE...HEAD" merge-base
          # resolution and silently emptied DIRS, skipping static+capture.
          set -o pipefail
          DIRS="$(git diff --name-only "$BASE"...HEAD -- 'apps/' | cut -d/ -f2 | sort -u | paste -sd, -)"
          APPS_TOUCHED="$(git diff --name-only "$BASE"...HEAD -- 'apps/' | wc -l)"
          if [ -n "${GAMES_INPUT:-}" ]; then DIRS="${GAMES_INPUT}"; fi
          # 14-CI: the nightly run covers all 18 routes so every job executes
          # on main even when the last commit touched no app.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DIRS="$(python3 -c 'import json; print(",".join(e.get("appDir", e["id"]) for e in json.load(open("tools/quality-rebuild-capture/games.json"))["games"]))')"
            GAMES_INPUT="$DIRS"
          fi
          echo "changed dirs: ${DIRS:-<none>}"
          if [ "${APPS_TOUCHED:-0}" -gt 0 ] && [ -z "${DIRS:-}" ]; then
            echo "::error:: PR touches apps/** but resolved 0 route dirs — detection broken"
            exit 1
          fi
          RESOLVED="$(DIRS="$DIRS" python3 - << 'PY'
          import json, os
          want = set([d for d in os.environ["DIRS"].split(",") if d])
          g = json.load(open("tools/quality-rebuild-capture/games.json"))
          ids, flags, dirs = [], [], []
          for e in g["games"]:
              if e.get("appDir", e["id"]) in want:
                  ids.append(e["id"])
                  dirs.append(e.get("appDir", e["id"]))
                  # qrFlags entries are URL-form flags (route_<id> + engine
                  # short names) — pass them all through to QRC_FLAGS.
                  flags.extend(e.get("qrFlags", []))
          print(",".join(ids) + "|" + ",".join(dirs) + "|" + ",".join(sorted(set(flags))))
          PY
          )"
          IFS='|' read -r IDS APPDIRS FLAGS <<< "$RESOLVED"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "dirs=${APPDIRS:-$DIRS}" >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "count=$(tr ',' '\n' <<< "$DIRS" | awk 'NF' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          # CI-1: downstream jobs may only skip when nothing under apps/**
          # changed and no explicit games input was given. An empty route set
          # on a code-touching PR fails the routes job above instead of
          # silently skipping static+capture.
          SKIP_OK="false"
          if [ "${APPS_TOUCHED:-0}" -eq 0 ] && [ -z "${GAMES_INPUT:-}" ]; then SKIP_OK="true"; fi
          echo "skip_ok=${SKIP_OK}" >> "$GITHUB_OUTPUT"
  static:
    name: Static gates (route-health + art-direction)
    runs-on: ubuntu-latest
    needs: routes
    if: needs.routes.outputs.dirs != '' || needs.routes.outputs.skip_ok == 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail when route detection produced no dirs on a code PR
        if: needs.routes.outputs.dirs == ''
        run: |
          echo "::error:: static gates have no route set — detection regressed"
          exit 1
      - run: node scripts/check-route-health.mjs --routes "${{ needs.routes.outputs.dirs }}"
      - run: node scripts/check-art-direction.mjs --routes "${{ needs.routes.outputs.dirs }}"

  capture:
    name: Capture changed games + runtime audit (${{ inputs.runner || 'macos-14' }})
    # Fork PR heads never reach a self-hosted runner (non-dispatch events and
    # unset input stay on macos-14).
    runs-on: ${{ (inputs.runner || 'macos-14') == 'azure-gpu' && fromJSON('["self-hosted","azure-gpu","gpu-l4"]') || ((inputs.runner || 'macos-14') == 'track0' && fromJSON('["self-hosted","track0","gpu-l4"]')) || 'macos-14' }}
    # 14-S1..S9: capture + every lane chromium spec for the selected routes
    # (18 routes on the nightly run, each with a 60 s S9 window).
    timeout-minutes: 180
    needs: [unit, routes]
    if: needs.routes.outputs.dirs != '' || needs.routes.outputs.skip_ok == 'false'
    env:
      QRC_GAMES: ${{ needs.routes.outputs.ids }}
      QRC_LOCAL_BUILD: "true"
      QRC_FLAGS: ${{ needs.routes.outputs.flags }}
      A3D_QR_ROUTES: ${{ needs.routes.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Chromium GPU flags for this runner
        env:
          RUNNER_KIND: ${{ inputs.runner || 'macos-14' }}
          QR_AZURE_GPU_CHROME_ARGS: ${{ vars.QR_AZURE_GPU_CHROME_ARGS }}
        run: |
          set -euo pipefail
          case "$RUNNER_KIND" in
            macos-14) args="--use-angle=metal --enable-gpu --ignore-gpu-blocklist" ;;
            azure-gpu|track0) args="${QR_AZURE_GPU_CHROME_ARGS:---headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist}" ;;
            *) echo "::error::unknown runner '$RUNNER_KIND'"; exit 1 ;;
          esac
          { echo "QRC_GPU_ARGS=$args"; echo "QR_CHROMIUM_ARGS=$args"; } >> "$GITHUB_ENV"
      - name: Fail when route detection produced no dirs on a code PR
        if: needs.routes.outputs.dirs == ''
        run: |
          echo "::error:: capture has no route set — detection regressed"
          exit 1
      - name: Build + capture changed games
        id: capture
        # P-05: capture failures fail the job — no masking.
        run: node tools/quality-rebuild-capture/capture-games.mjs --strict
      - name: Static art-direction gates (S4, S5 static half)
        id: static
        if: always() && needs.routes.outputs.dirs != ''
        run: |
          node scripts/check-route-health.mjs --routes "$A3D_QR_ROUTES"
          node scripts/check-art-direction.mjs --routes "$A3D_QR_ROUTES"
      - name: Lane chromium specs for the selected routes (S1, S2, S5-S9)
        id: specs
        # P-05: spec failures fail the job — no masking. Includes the runtime
        # art-direction audit. Runs even when capture fails so the evidence
        # still lands in the artifact.
        if: always() && needs.routes.outputs.dirs != ''
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tests/qr/prd14/reports/browser.json
        run: |
          # macOS bash 3.2 has no mapfile; the selector exits 1 on a route
          # with no spec, which fails this step before Playwright starts.
          node tests/qr/prd14/select-specs.mjs "$A3D_QR_ROUTES" > "$RUNNER_TEMP/prd14-specs.txt"
          xargs pnpm exec playwright test -c tests/qr/prd14/playwright.config.ts < "$RUNNER_TEMP/prd14-specs.txt"
      - name: Write S1-S9 evidence (evidence/prd14/<game>/<run-id>/report.json)
        id: evidence
        if: always() && needs.routes.outputs.dirs != ''
        run: |
          node tests/qr/prd14/write-evidence.mjs \
            --capture tools/quality-rebuild-capture/out/report.json \
            --browser tests/qr/prd14/reports/browser.json \
            --static "${{ steps.static.outcome }}" \
            --run-id "${{ github.run_id }}" --sha "${{ github.sha }}" \
            --routes "$A3D_QR_ROUTES"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd14-evidence-${{ inputs.runner || 'macos-14' }}-${{ github.sha }}
          path: |
            tools/quality-rebuild-capture/out/
            tests/qr/prd14/reports/
            docs/project/aura3d-quality-rebuild/evidence/prd14/
          retention-days: 30
          if-no-files-found: warn
      - name: Report step outcomes
        if: always()
        run: |
          echo "capture=${{ steps.capture.outcome }} static=${{ steps.static.outcome }} specs=${{ steps.specs.outcome }} evidence=${{ steps.evidence.outcome }}"
          test "${{ steps.capture.outcome }}" = "success"
          test "${{ steps.static.outcome }}" = "success"
          test "${{ steps.specs.outcome }}" = "success"
          test "${{ steps.evidence.outcome }}" = "success"

  browser-matrix:
    # WEBKIT-FF (PRD-14 §18): WebKit covers S1/S2/S11; Firefox covers the S1
    # boot + 60 s timeline with 0 errors (A3D_DISPATCH_SOAK_MS).
    name: WebKit + Firefox S-matrix (macos-14)
    runs-on: macos-14
    timeout-minutes: 120
    needs: [unit, routes]
    if: needs.routes.outputs.dirs != ''
    env:
      QRC_GAMES: ${{ needs.routes.outputs.ids }}
      QRC_LOCAL_BUILD: "true"
      QRC_FLAGS: ${{ needs.routes.outputs.flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit firefox
      - name: Build changed games
        run: node tools/quality-rebuild-capture/capture-games.mjs --build-only --local-build
      - name: Select the specs for the built routes
        env:
          A3D_QR_ROUTES: ${{ needs.routes.outputs.dirs }}
        run: node tests/qr/prd14/select-specs.mjs "$A3D_QR_ROUTES" > "$RUNNER_TEMP/prd14-specs.txt"
      - name: WebKit — S1 dispatch + S2/S11 v2 specs
        # Only the built routes: each config's testMatch narrows the list.
        run: xargs pnpm exec playwright test -c tests/qr/prd14/playwright.webkit.config.ts < "$RUNNER_TEMP/prd14-specs.txt"
      - name: Firefox — S1 boot + 60 s timeline
        env:
          A3D_DISPATCH_SOAK_MS: "60000"
        run: xargs pnpm exec playwright test -c tests/qr/prd14/playwright.firefox.config.ts < "$RUNNER_TEMP/prd14-specs.txt"
