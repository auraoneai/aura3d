name: QR PRD-14 games

# Lane 14 gate (T1.9). On PRs touching lane-owned paths: runs the T1.x unit
# suite, check-route-health and check-art-direction for the changed routes,
# then captures only the changed games on macos-14 (ANGLE Metal) with
# QRC_LOCAL_BUILD=true and --flags route-<id>, runs the runtime art-direction
# audit, and uploads evidence/prd14/<run>/ artifacts.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/game/src/art/**"
      - "tools/quality-gate/**"
      - "tools/quality-rebuild-capture/games.json"
      - "tests/qr/prd14/**"
      - "scripts/check-route-health.mjs"
      - "scripts/check-art-direction.mjs"
      - ".github/workflows/qr-prd14-games.yml"
  push:
    branches: ["qr/prd14-*"]
  workflow_dispatch:
    inputs:
      games:
        description: "QRC_GAMES override (comma-separated app dirs)"
        required: false
        default: ""

concurrency:
  group: qr-prd14-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"

jobs:
  unit:
    name: T1.x unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lane 14 vitest suite
        run: pnpm exec vitest run --config tests/qr/prd14/vitest.config.ts tests/qr/prd14 tests/unit/contracts/impl

  routes:
    name: Detect changed routes
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.changed.outputs.ids }}
      dirs: ${{ steps.changed.outputs.dirs }}
      flags: ${{ steps.changed.outputs.flags }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          GAMES_INPUT: ${{ inputs.games }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          DIRS="$(git diff --name-only "$BASE"...HEAD -- 'apps/*/' | cut -d/ -f2 | sort -u | paste -sd, -)"
          if [ -n "${GAMES_INPUT:-}" ]; then DIRS="${GAMES_INPUT}"; fi
          echo "changed dirs: ${DIRS:-<none>}"
          RESOLVED="$(DIRS="$DIRS" python3 - << 'PY'
          import json, os
          want = set([d for d in os.environ["DIRS"].split(",") if d])
          g = json.load(open("tools/quality-rebuild-capture/games.json"))
          ids, flags, dirs = [], [], []
          for e in g["games"]:
              if e.get("appDir", e["id"]) in want:
                  ids.append(e["id"])
                  dirs.append(e.get("appDir", e["id"]))
                  for f in e.get("qrFlags", []):
                      if f.startswith("A3D_QR_ROUTE_"):
                          flags.append("route-" + f[len("A3D_QR_ROUTE_"):].lower().replace("_", "-"))
          print(",".join(ids) + "|" + ",".join(dirs) + "|" + ",".join(sorted(set(flags))))
          PY
          )"
          IFS='|' read -r IDS APPDIRS FLAGS <<< "$RESOLVED"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "dirs=${APPDIRS:-$DIRS}" >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "count=$(tr ',' '\n' <<< "$DIRS" | grep -c . || true)" >> "$GITHUB_OUTPUT"
  static:
    name: Static gates (route-health + art-direction)
    runs-on: ubuntu-latest
    needs: routes
    if: needs.routes.outputs.dirs != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-route-health.mjs --routes "${{ needs.routes.outputs.dirs }}"
      - run: node scripts/check-art-direction.mjs --routes "${{ needs.routes.outputs.dirs }}"

  capture:
    name: Capture changed games + runtime audit (macos-14)
    runs-on: macos-14
    timeout-minutes: 90
    needs: routes
    if: needs.routes.outputs.dirs != ''
    env:
      QRC_GAMES: ${{ needs.routes.outputs.ids }}
      QRC_LOCAL_BUILD: "true"
      QRC_FLAGS: ${{ needs.routes.outputs.flags }}
      A3D_QR_ROUTES: ${{ needs.routes.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Build + capture changed games
        id: capture
        continue-on-error: true
        run: node tools/quality-rebuild-capture/capture-games.mjs
      - name: Runtime art-direction audit
        id: audit
        continue-on-error: true
        run: pnpm exec playwright test -c tests/qr/prd14/playwright.config.ts tests/qr/prd14/browser/art-direction-audit.spec.ts
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd14-evidence-${{ github.sha }}
          path: |
            tools/quality-rebuild-capture/out/
            docs/project/aura3d-quality-rebuild/evidence/prd14/
          retention-days: 30
          if-no-files-found: warn
      - name: Report step outcomes
        if: always()
        run: |
          echo "capture=${{ steps.capture.outcome }} audit=${{ steps.audit.outcome }}"
          test "${{ steps.capture.outcome }}" = "success"
