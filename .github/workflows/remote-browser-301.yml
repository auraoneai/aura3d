name: Remote Browser Acceptance 3.0.1

on:
  workflow_dispatch:
  push:
    branches: [codex/native-webgpu-probe-301]
    paths: [.github/workflows/remote-browser-301.yml]

permissions:
  contents: read

env:
  SOURCE_SHA256: 3a4504bb25245994bfcb55f4e5ff7fdcc6123e57c5ac680643fcacc83c888aaf
  DELTA_SHA256: d449f6c1000454088df3552d870e36b12f518dc8f80a997e15aee5983f65feac

jobs:
  route-primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/native-webgpu-probe
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - name: Restore immutable current source
        env:
          SOURCE_URL: ${{ secrets.AURA3D_NATIVE_SOURCE_URL }}
          SOURCE_DELTA_URL: ${{ secrets.AURA3D_NATIVE_DELTA_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-acceptance/source" "$RUNNER_TEMP/browser-acceptance/evidence"
          cp -R tools/native-webgpu-probe "$RUNNER_TEMP/browser-acceptance/orchestration"
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'browser-acceptance'
          def download(url,path,label):
              try:
                  with urllib.request.urlopen(url,timeout=90) as response, path.open('wb') as out:
                      while chunk:=response.read(1024*1024): out.write(chunk)
              except Exception as error:
                  raise RuntimeError(label+' download failed: '+type(error).__name__) from None
          archive=root/'source.tar.gz'; download(os.environ['SOURCE_URL'],archive,'Source')
          actual=hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()
          if actual!=os.environ['SOURCE_SHA256']: raise RuntimeError('Source SHA mismatch: '+actual)
          with tarfile.open(archive,'r:gz') as bundle: bundle.extractall(root/'source',filter='data')
          delta=root/'delta.tar.gz'; download(os.environ['SOURCE_DELTA_URL'],delta,'Delta')
          delta_actual=hashlib.file_digest(delta.open('rb'),'sha256').hexdigest()
          if delta_actual!=os.environ['DELTA_SHA256']: raise RuntimeError('Delta SHA mismatch: '+delta_actual)
          with tarfile.open(delta,'r:gz') as bundle: bundle.extractall(root/'source',filter='data')
          (root/'evidence'/'source-verification.json').write_text(__import__('json').dumps({'baseArchiveSha256':actual,'overlayArchiveSha256':delta_actual,'passed':True},indent=2)+'\n')
          PY
          cd "$RUNNER_TEMP/browser-acceptance/source"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Browser semantic check
        run: |
          cd "$RUNNER_TEMP/browser-acceptance/source"
          pnpm exec tsc --noEmit -p tsconfig.browser-301.json --pretty false
      - name: Full route-primary capture and aggregate
        env:
          A3D_ROUTE_PRIMARY_WORKERS: '4'
        run: |
          cd "$RUNNER_TEMP/browser-acceptance/source"
          pnpm exec tsx --tsconfig tsconfig.base.json tools/showcase-library/run-route-primary-parallel.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-acceptance/evidence/
            ${{ runner.temp }}/browser-acceptance/source/tests/reports/showcase-route-primary-probes/
          retention-days: 14
          if-no-files-found: error

  installed-head-to-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/native-webgpu-probe
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - name: Restore immutable current source
        env:
          SOURCE_URL: ${{ secrets.AURA3D_NATIVE_SOURCE_URL }}
          SOURCE_DELTA_URL: ${{ secrets.AURA3D_NATIVE_DELTA_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-acceptance/source" "$RUNNER_TEMP/browser-acceptance/evidence"
          cp -R tools/native-webgpu-probe "$RUNNER_TEMP/browser-acceptance/orchestration"
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'browser-acceptance'
          def download(url,path,label):
              try:
                  with urllib.request.urlopen(url,timeout=90) as response, path.open('wb') as out:
                      while chunk:=response.read(1024*1024): out.write(chunk)
              except Exception as error:
                  raise RuntimeError(label+' download failed: '+type(error).__name__) from None
          archive=root/'source.tar.gz'; download(os.environ['SOURCE_URL'],archive,'Source')
          actual=hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()
          if actual!=os.environ['SOURCE_SHA256']: raise RuntimeError('Source SHA mismatch: '+actual)
          with tarfile.open(archive,'r:gz') as bundle: bundle.extractall(root/'source',filter='data')
          delta=root/'delta.tar.gz'; download(os.environ['SOURCE_DELTA_URL'],delta,'Delta')
          delta_actual=hashlib.file_digest(delta.open('rb'),'sha256').hexdigest()
          if delta_actual!=os.environ['DELTA_SHA256']: raise RuntimeError('Delta SHA mismatch: '+delta_actual)
          with tarfile.open(delta,'r:gz') as bundle: bundle.extractall(root/'source',filter='data')
          (root/'evidence'/'source-verification.json').write_text(__import__('json').dumps({'baseArchiveSha256':actual,'overlayArchiveSha256':delta_actual,'passed':True},indent=2)+'\n')
          PY
          cd "$RUNNER_TEMP/browser-acceptance/source"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Exact-installed 15-workload reproduction
        run: |
          cd "$RUNNER_TEMP/browser-acceptance/source"
          pnpm head-to-head:installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-head-to-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-acceptance/evidence/
            ${{ runner.temp }}/browser-acceptance/source/tests/reports/current-head-to-head-installed/
            ${{ runner.temp }}/browser-acceptance/source/tests/reports/current-head-to-head/
            ${{ runner.temp }}/browser-acceptance/source/tests/reports/release-tarballs/
          retention-days: 14
          if-no-files-found: error
