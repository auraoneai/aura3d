name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build and Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ['22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run source package tests
        run: pnpm test:packages

      - name: Build
        run: pnpm build:raw

      - name: Run distribution package tests
        run: pnpm test:packages:dist

      - name: Verify build outputs
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.d.ts || exit 1
          test -f packages/aura3d-cli/dist/index.js || exit 1
          test -f packages/create-aura3d/dist/cli.js || exit 1
          echo "All build outputs verified!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  test-coverage:
    name: Package Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source package tests
        run: pnpm test:packages
