name: Quality Gate

# PRD-12 T3.3. The pixel gate: bench + game captures on macos-15 (ANGLE Metal),
# analytic pixel specs under the GPU-string guard, then metrics and verdicts on
# ubuntu-latest. No secrets — the gate measures and blocks; it never asserts
# quality claims. Human review is a separate workflow (quality-review.yml).

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # RF8 (lane 12). Two capture arms with disjoint artifact names:
  #   none  — qr_flags=none, the shipped engine. BLOCKING: metrics and the gate
  #           verdict read only `*-gate-none-*` artifacts.
  #   flags — qr_flags=all, the in-development flag set. REPORT-ONLY: its jobs
  #           still conclude truthfully red or green, and flag-captures-report
  #           prints each result, but no gate job needs them.
  # Game-capture shards are 3 x macos-15 jobs per arm. The org has 5 macOS
  # runners, so on pull_request they starved every other lane (#839). They run
  # on every main push, workflow_call and dispatch; PRs get the bench + analytic
  # pixel gate.
  capture-bench:
    name: Capture benchmark, none (macos-15)
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "aura-clash-showcase"
      bench: true
      qr_flags: "none"
      artifact_suffix: "-gate-none-bench"

  capture-games-1:
    name: Capture games shard 1, none (macos-15)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "aura-clash-showcase,showcase-blockfall-reactor,showcase-aurora-lander"
      bench: false
      qr_flags: "none"
      artifact_suffix: "-gate-none-g1"

  capture-games-2:
    name: Capture games shard 2, none (macos-15)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "showcase-vault-breakers,showcase-bank-shot"
      bench: false
      qr_flags: "none"
      artifact_suffix: "-gate-none-g2"

  capture-games-3:
    name: Capture games shard 3, none (macos-15)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "showcase-aura-links-3d"
      bench: false
      qr_flags: "none"
      artifact_suffix: "-gate-none-g3"

  flag-capture-bench:
    name: Capture benchmark, flags=all, report-only (macos-15)
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "aura-clash-showcase"
      bench: true
      qr_flags: "all"
      artifact_suffix: "-gate-flags-bench"

  flag-capture-games-1:
    name: Capture games shard 1, flags=all, report-only (macos-15)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "aura-clash-showcase,showcase-blockfall-reactor,showcase-aurora-lander"
      bench: false
      qr_flags: "all"
      artifact_suffix: "-gate-flags-g1"

  flag-capture-games-2:
    name: Capture games shard 2, flags=all, report-only (macos-15)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "showcase-vault-breakers,showcase-bank-shot"
      bench: false
      qr_flags: "all"
      artifact_suffix: "-gate-flags-g2"

  flag-capture-games-3:
    name: Capture games shard 3, flags=all, report-only (macos-15)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/quality-rebuild-capture.yml
    with:
      games: "showcase-aura-links-3d"
      bench: false
      qr_flags: "all"
      artifact_suffix: "-gate-flags-g3"

  flag-captures-report:
    name: Flag captures report (report-only, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [flag-capture-bench, flag-capture-games-1, flag-capture-games-2, flag-capture-games-3]
    if: ${{ !cancelled() }}
    steps:
      - name: Print flag-on capture results
        env:
          BENCH: ${{ needs.flag-capture-bench.result }}
          G1: ${{ needs.flag-capture-games-1.result }}
          G2: ${{ needs.flag-capture-games-2.result }}
          G3: ${{ needs.flag-capture-games-3.result }}
        run: |
          {
            echo "## Flag-on captures (qr_flags=all) - report-only"
            echo
            echo "These results do not feed the gate verdict, which reads only the none captures."
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| flag-capture-bench | $BENCH |"
            echo "| flag-capture-games-1 | $G1 |"
            echo "| flag-capture-games-2 | $G2 |"
            echo "| flag-capture-games-3 | $G3 |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  analytic-pixels:
    name: Analytic pixel specs (macos-15, GPU-guarded)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Run pixel specs (GPU guard in global setup)
        run: pnpm exec playwright test --config playwright.quality-gate.config.ts
      - name: Upload pixel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-pixels
          path: tests/reports/quality-gate-pixels.json
          retention-days: 30
          if-no-files-found: warn

  metrics:
    name: Metrics (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [capture-bench, capture-games-1, capture-games-2, capture-games-3]
    # Only the none arm blocks. Shards are skipped on pull_request; failed or
    # cancelled none shards still block.
    if: >-
      !cancelled() && needs.capture-bench.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metric pins
        run: pip install -r tools/quality-gate/metrics/requirements.lock
      - name: Download capture artifacts (none arm only)
        uses: actions/download-artifact@v4
        with:
          pattern: "*-gate-none-*"
          path: artifacts
      - name: Collect items + run metrics
        run: |
          node tools/quality-gate/bin/collect-checkpoint.mjs --artifacts artifacts --k 0 --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
          mkdir -p gate
          cp artifacts/checkpoint/metrics.json gate/metrics.json
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-metrics
          path: artifacts/checkpoint/
          retention-days: 30
          if-no-files-found: warn

  gate:
    name: Gate verdicts (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [metrics, analytic-pixels]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          name: quality-gate-metrics
          path: gate
      - name: Evaluate gates
        run: |
          pnpm --dir tools/quality-gate gate -- \
            --metrics gate/metrics.json \
            --items gate/items.json \
            --goldens benchmarks/quality-rebuild/goldens/manifest.json \
            --out gate/verdicts.json
      - name: Step summary
        if: always()
        run: |
          pnpm --dir tools/quality-gate report -- \
            --verdicts gate/verdicts.json \
            --metrics gate/metrics.json \
            --out "$GITHUB_STEP_SUMMARY"
