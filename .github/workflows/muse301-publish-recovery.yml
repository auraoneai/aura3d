name: Muse 3.0.1 Exact Package Recovery

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact frozen 3.0.1 source commit
        required: true
      l01_run_id:
        description: Successful exact-source L01 pack-once run
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish-create-aura3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact frozen source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: git checkout --detach "$SOURCE_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Verify exact successful L01 source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          L01_RUN_ID: ${{ inputs.l01_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${L01_RUN_ID}")"
          test "$(jq -r .head_sha <<<"$run_json")" = "$SOURCE_COMMIT"
          test "$(jq -r .status <<<"$run_json")" = completed
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .path <<<"$run_json")" = .github/workflows/muse301-l01.yml

      - name: Restore exact L01 archives and release plan
        uses: actions/download-artifact@v4
        with:
          name: muse301-l01-${{ inputs.source_commit }}
          path: .
          run-id: ${{ inputs.l01_run_id }}
          github-token: ${{ github.token }}

      - name: Validate exact recovery archive
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync('tests/reports/release-tarballs/release-plan.json', 'utf8'));
          const entry = plan.packages.find(({ name }) => name === 'create-aura3d');
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          const lockfileSha256 = createHash('sha256').update(readFileSync('pnpm-lock.yaml')).digest('hex');
          if (plan.schema !== 'aura3d-release-plan/1.0' || plan.version !== '3.0.1' || plan.commit !== process.env.SOURCE_COMMIT || commit !== process.env.SOURCE_COMMIT || plan.source?.tree !== tree || plan.lockfileSha256 !== lockfileSha256 || plan.packages?.length !== 29) {
            throw new Error('Unexpected release plan source or inventory');
          }
          if (!entry || entry.version !== '3.0.1' || entry.sha256 !== '22726af1688198b8993e3ab7ffaa913b23e577a4590f0c86882ee6dffc10165b') {
            throw new Error('Unexpected create-aura3d release archive');
          }
          const bytes = readFileSync(entry.tarball);
          if (createHash('sha256').update(bytes).digest('hex') !== entry.sha256 || `sha512-${createHash('sha512').update(bytes).digest('base64')}` !== entry.integrity) throw new Error('Archive integrity mismatch');
          NODE
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}

      - name: Stage exact archive on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.0.1 \
            'tests/reports/release-tarballs/create-aura3d-3.0.1.tgz#Exact npm tarball for create-aura3d 3.0.1' \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Build exact npm publish payload
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'tests/reports/release-tarballs/create-aura3d-3.0.1.tgz';
          const bytes = readFileSync(path);
          const manifest = JSON.parse(execFileSync('tar', ['-xOzf', path, 'package/package.json'], { encoding: 'utf8' }));
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          const shasum = createHash('sha1').update(bytes).digest('hex');
          if (sha256 !== '22726af1688198b8993e3ab7ffaa913b23e577a4590f0c86882ee6dffc10165b' || integrity !== 'sha512-YsVORHaoZQ1xfVW8QMBZFKionNuY2HEyhmgPdexo4nb390yby4VUG6IRWFKDyttcL1v2CZFDXqm5bgTXwsPe8g==' || manifest.name !== 'create-aura3d' || manifest.version !== '3.0.1') throw new Error('Unexpected exact release archive');
          manifest._id = 'create-aura3d@3.0.1';
          manifest._nodeVersion = process.versions.node;
          manifest._npmVersion = '12.0.2';
          manifest.dist = { ...(manifest.dist ?? {}), integrity, shasum, tarball: 'http://registry.npmjs.org/create-aura3d/-/create-aura3d-3.0.1.tgz' };
          delete manifest.patchedDependencies;
          const metadata = {
            _id: manifest.name,
            name: manifest.name,
            description: manifest.description,
            'dist-tags': { latest: manifest.version },
            versions: { [manifest.version]: manifest },
            access: 'public',
            _attachments: { 'create-aura3d-3.0.1.tgz': { content_type: 'application/octet-stream', data: bytes.toString('base64'), length: bytes.length } }
          };
          writeFileSync('/tmp/composio-publish-body.json', JSON.stringify({
            endpoint: 'https://registry.npmjs.org/create-aura3d',
            method: 'PUT',
            connected_account_id: 'ca_wFVXSmU6Y5Vq',
            parameters: [{ in: 'header', name: 'content-type', value: 'application/json' }],
            body: metadata
          }), { mode: 0o600 });
          NODE

      - name: Publish through the existing Composio npm account
        env:
          COMPOSIO_USER_API_KEY: ${{ secrets.AURA3D_COMPOSIO_USER_API_KEY }}
        run: |
          test -n "$COMPOSIO_USER_API_KEY"
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 2 \
            -X POST 'https://backend.composio.dev/api/v3.1/tools/execute/proxy' \
            -H 'content-type: application/json' \
            -H "x-user-api-key: $COMPOSIO_USER_API_KEY" \
            -H 'x-org-id: ok_u_Gt9h9BHbSu' \
            -H 'x-project-id: pr_RUpCnFHyMNFC' \
            --data-binary @/tmp/composio-publish-body.json \
            -o /tmp/composio-publish-response.json
          node --input-type=module <<'NODE'
          import { readFileSync, unlinkSync } from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/composio-publish-response.json', 'utf8'));
          unlinkSync('/tmp/composio-publish-body.json');
          unlinkSync('/tmp/composio-publish-response.json');
          if (![200, 201, 202].includes(result.status)) throw new Error(`npm publish failed: ${JSON.stringify(result)}`);
          console.log(`npm registry accepted create-aura3d@3.0.1 with status ${result.status}`);
          NODE

      - name: Verify registry integrity
        run: |
          test "$(npm view create-aura3d@3.0.1 version)" = 3.0.1
          test "$(npm view create-aura3d@3.0.1 dist.integrity)" = 'sha512-YsVORHaoZQ1xfVW8QMBZFKionNuY2HEyhmgPdexo4nb390yby4VUG6IRWFKDyttcL1v2CZFDXqm5bgTXwsPe8g=='
