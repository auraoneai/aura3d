name: QR-09 route divergence

# PRD-09 Phase 0: serves each capture-flag-bearing route built from source and
# records the default view vs the ?capture=review/overview view, plus
# postprocess.actualPasses. Record-only — uploads PNG pairs and an updated
# baseline.json (postPass filled) as artifacts.

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Comma-separated game ids (empty = all affected routes)"
        required: false
        default: ""
      runner:
        # Default track0: hosted macos-14 never starts jobs for this repo.
        description: "Browser job runner: track0 (L4, default) | azure-gpu (self-hosted Linux L4, Vulkan ANGLE) | macos-14 (Metal)"
        type: choice
        options: [track0, azure-gpu, macos-14]
        default: track0
  pull_request:
    branches: [main]
    paths:
      - "packages/game/**"
      - "packages/audio/**"
      - "packages/engine/src/game/**"
      - "packages/engine/src/agent-api/GameAppRuntime.ts"
      - "packages/engine/src/agent-api/app/createGameApp.ts"
      - "packages/engine/src/agent-api/nodes/game/**"
      - "packages/engine/src/contracts/game.ts"
      - "packages/engine/src/contracts/stubs/game.ts"
      - "apps/common/**"
      - "apps/showcase-*/**"
      - "apps/aura-clash-showcase/**"
      - "tools/quality-rebuild-capture/route-composition.mjs"
      - "tools/quality-rebuild-capture/games.json"
      - "tools/showcase-library/game-capture-parity.mjs"
      - "tests/qr/prd09/**"
      - "docs/project/aura3d-quality-rebuild/migration/**"
      - "docs/project/aura3d-quality-rebuild/PRD-09-shared-game-runtime-route-extraction.md"
      - "eslint/qr/no-route-capture-flags.js"
      - "eslint/qr/prd09.js"
      - ".github/workflows/qr-prd09-routes.yml"
  # §4.0: lane workflows run on main pushes so a main run can be cited.
  push:
    branches: [main]
    paths:
      - "packages/game/**"
      - "packages/audio/**"
      - "packages/engine/src/game/**"
      - "packages/engine/src/agent-api/GameAppRuntime.ts"
      - "packages/engine/src/agent-api/app/createGameApp.ts"
      - "packages/engine/src/agent-api/nodes/game/**"
      - "packages/engine/src/contracts/game.ts"
      - "packages/engine/src/contracts/stubs/game.ts"
      - "apps/common/**"
      - "apps/showcase-*/**"
      - "apps/aura-clash-showcase/**"
      - "tools/quality-rebuild-capture/route-composition.mjs"
      - "tools/quality-rebuild-capture/games.json"
      - "tools/showcase-library/game-capture-parity.mjs"
      - "tests/qr/prd09/**"
      - "docs/project/aura3d-quality-rebuild/migration/**"
      - "docs/project/aura3d-quality-rebuild/PRD-09-shared-game-runtime-route-extraction.md"
      - "eslint/qr/no-route-capture-flags.js"
      - "eslint/qr/prd09.js"
      - ".github/workflows/qr-prd09-routes.yml"

permissions:
  contents: read

concurrency:
  group: qr-prd09-routes-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  capture_review_divergence:
    name: Capture-review divergence (macos-14, record-only)
    # Default macos-14; workflow_dispatch `runner` can move it to the Linux L4
    # pool (#956 pattern). Compare frames only within one runner class.
    runs-on: ${{ (inputs.runner || 'track0') == 'macos-14' && 'macos-14' || ((inputs.runner || 'track0') == 'track0' && fromJSON('["self-hosted","track0","gpu-l4"]')) || fromJSON('["self-hosted","azure-gpu","gpu-l4"]') }}
    timeout-minutes: 120
    env:
      QRC_GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Chromium GPU flags for this runner (#956 pattern)
        env:
          RUNNER_KIND: ${{ inputs.runner || 'track0' }}
          QR_AZURE_GPU_CHROME_ARGS: ${{ vars.QR_AZURE_GPU_CHROME_ARGS }}
        run: |
          set -euo pipefail
          case "$RUNNER_KIND" in
            macos-14) ;;  # configs keep their Metal defaults
            azure-gpu|track0)
              args="${QR_AZURE_GPU_CHROME_ARGS:---headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist}"
              { echo "QR_CHROMIUM_ARGS=$args"; echo "QRC_GPU_ARGS=$args"; } >> "$GITHUB_ENV"
              # Record the GPU so frames are only compared within this class.
              QR_CHROMIUM_ARGS="$args" node tools/quality-rebuild-capture/gpu-renderer.mjs | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::unknown runner '$RUNNER_KIND'"; exit 1 ;;
          esac

      - name: Regenerate route-composition baseline
        run: node tools/quality-rebuild-capture/route-composition.mjs --json docs/project/aura3d-quality-rebuild/migration/baseline.json

      # Red-flag revert: continue-on-error removed — build/divergence failures
      # must fail the job, not mask as green with an artifact upload.
      - name: Build affected routes from source
        id: build
        # --local-build: build every route from source. Plain --build-only
        # built only the 1 undeployed game, so 17 routes 404'd in the built
        # site and every spec failed "no live app" (run 38190608609).
        run: node tools/quality-rebuild-capture/capture-games.mjs --build-only --local-build

      - name: Record default vs capture=review views
        id: divergence
        env:
          A3D_DIVERGENCE_DIR: tests/qr/prd09/.out
        run: pnpm exec playwright test --config tests/qr/prd09/playwright.config.ts

      - name: Upload divergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd09-capture-divergence
          path: |
            tests/qr/prd09/.out/
            docs/project/aura3d-quality-rebuild/migration/baseline.json
            docs/project/aura3d-quality-rebuild/migration/baseline.md
          # The spec writes postpass.json + merged baseline.json + per-route PNGs
          # under .out/ — a hidden dir, silently dropped without this flag
          # (run 37774324469 uploaded baseline only despite 17 passing tests).
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Report step outcomes
        if: always()
        run: |
          echo "build=${{ steps.build.outcome }} divergence=${{ steps.divergence.outcome }}"
          test "${{ steps.divergence.outcome }}" = "success"
