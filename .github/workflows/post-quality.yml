name: QR-03 post quality

# Lane 03 (PRD-03) postprocessing quality gate. PR- and push-triggered on
# lane-03-owned paths only (other lanes' edits under packages/rendering do not
# run this workflow), plus a nightly checkpoint run. Unit checks on ubuntu,
# lane browser specs on macos-14 with ANGLE Metal (PRD-03 §15.2).
# `@integrated` specs are skipped in PR runs; they run at checkpoints with
# qr_flags=all. No secrets.

on:
  pull_request:
    paths:
      - "packages/rendering/src/post/**"
      - "packages/rendering/src/postprocess/**"
      - "packages/rendering/src/reference/**"
      - "packages/rendering/src/renderer/PostprocessExecution.ts"
      - "packages/rendering/src/forward/Velocity.ts"
      - "packages/rendering/src/webgl2/LegacyPost.ts"
      - "packages/rendering/src/RendererPostprocessPlan.ts"
      - "packages/rendering/src/PostProcessPass.ts"
      - "packages/rendering/src/TemporalHistory.ts"
      - "packages/engine/src/agent-api/postBridge.ts"
      - "packages/engine/src/agent-api/postPresets.ts"
      - "packages/engine/src/agent-api/compiler/postprocess.ts"
      - "packages/engine/src/agent-api/nodes/effects.post.ts"
      - "apps/postprocessing-*/**"
      - "tools/quality-rebuild/codemods/**"
      - "tests/browser/qr-prd03-*.spec.ts"
      - "tests/browser/qr-prd03-*harness.*"
      - "tests/unit/contracts/impl/prd03-*"
      - "evidence/prd03/**"
      - ".github/workflows/post-quality.yml"
      - ".github/workflows/qr-prd03-captures.yml"
  push:
    branches: [main]
    paths:
      - "packages/rendering/src/post/**"
      - "packages/rendering/src/postprocess/**"
      - "packages/rendering/src/reference/**"
      - "packages/rendering/src/renderer/PostprocessExecution.ts"
      - "packages/rendering/src/forward/Velocity.ts"
      - "packages/rendering/src/webgl2/LegacyPost.ts"
      - "packages/rendering/src/RendererPostprocessPlan.ts"
      - "packages/rendering/src/PostProcessPass.ts"
      - "packages/rendering/src/TemporalHistory.ts"
      - "packages/engine/src/agent-api/postBridge.ts"
      - "packages/engine/src/agent-api/postPresets.ts"
      - "packages/engine/src/agent-api/compiler/postprocess.ts"
      - "packages/engine/src/agent-api/nodes/effects.post.ts"
      - "apps/postprocessing-*/**"
      - "tools/quality-rebuild/codemods/**"
      - "tests/browser/qr-prd03-*.spec.ts"
      - "tests/browser/qr-prd03-*harness.*"
      - "tests/unit/contracts/impl/prd03-*"
      - "evidence/prd03/**"
      - ".github/workflows/post-quality.yml"
      - ".github/workflows/qr-prd03-captures.yml"
  schedule:
    # Nightly checkpoint at 02:17 US/Pacific (09:17 UTC during PDT).
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lane 03 unit (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck stays repo-wide per T0-31 (do not scope the gate away).
      - run: pnpm typecheck:raw
      - run: pnpm exec vitest run tests/unit/contracts/impl
      - name: Ownership audit (all changed files resolve to lane 03)
        run: git diff --name-only origin/main...HEAD | xargs node tools/qr-ownership/check.mjs

  browser:
    name: Lane 03 browser specs (macos-14, ANGLE Metal)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Lane 03 post specs (@integrated skipped)
        # P-08/03-CI1: the lane-03 spec list is explicit — a missing file is a
        # failure, not a pass. No glob-based green.
        run: |
          specs=(
            tests/browser/qr-prd03-fxaa.spec.ts
            tests/browser/qr-prd03-post-banding.spec.ts
            tests/browser/qr-prd03-post-lut.spec.ts
            tests/browser/qr-prd03-v2-tone.spec.ts
            tests/browser/qr-prd03-post-no-readback.spec.ts
            tests/browser/qr-prd03-phase4.spec.ts
            tests/browser/qr-prd03-capture-dsf2.spec.ts
            tests/browser/qr-prd03-wgsl-compile.spec.ts
            tests/browser/qr-prd03-phase6.spec.ts
          )
          for spec in "${specs[@]}"; do
            if [ ! -f "$spec" ]; then
              echo "missing lane-03 spec: $spec" >&2
              exit 1
            fi
          done
          pnpm exec playwright test "${specs[@]}" --grep-invert @integrated
      - name: Upload spec artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr03-post-quality-${{ github.run_id }}
          path: |
            tests/reports/browser.json
            test-results/
          retention-days: 30
          if-no-files-found: warn
