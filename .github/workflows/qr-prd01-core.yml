# QR lane 01 — rendering core / color / HDR / PBR (PRD-01 §16.4)
#
# Mirrors .github/workflows/qr-contracts.yml conventions: lint + unit gates on
# ubuntu, browser conformance on macos-14, evidence upload for the browser run.
#
# PRD-16 01-CI / P-07: runs on main pushes and nightly (not only qr/** branches),
# triggers on every lane-01 owned rendering dir, never cancels main runs, and has
# no masks (no `|| true` on lint, no owner-15 exemption in the ownership gate).

name: qr-prd01-core

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/rendering/src/**"
      - "packages/engine/src/agent-api/sceneGraph.ts"
      - "packages/engine/src/agent-api/color.ts"
      - "packages/engine/src/agent-api/colorUtils.ts"
      - "packages/engine/src/agent-api/compiler/sceneGraph.ts"
      - "packages/engine/src/agent-api/compiler/color.ts"
      - "packages/engine/src/lanes/prd01*/**"
      - "packages/engine/src/lanes/prd01.ts"
      - "packages/engine/src/agent-api/compiler/diagnosticOnly.prd01.ts"
      - "benchmarks/quality-rebuild/scenes/prd01/**"
      - "benchmarks/quality-rebuild/aura3d/scenes/prd01/**"
      - "benchmarks/quality-rebuild/three/scenes/prd01/**"
      - "tests/qr/prd01/**"
      - "tests/unit/contracts/impl/prd01-*"
      - ".github/workflows/qr-prd01-core.yml"
  push:
    # main only: qr/** branches run via pull_request (4bf9b007c cut the fan-out).
    branches: ["main"]
    paths:
      - "packages/rendering/src/**"
      - "packages/engine/src/agent-api/sceneGraph.ts"
      - "packages/engine/src/agent-api/color.ts"
      - "packages/engine/src/agent-api/colorUtils.ts"
      - "packages/engine/src/agent-api/compiler/sceneGraph.ts"
      - "packages/engine/src/agent-api/compiler/color.ts"
      - "packages/engine/src/lanes/prd01*/**"
      - "packages/engine/src/lanes/prd01.ts"
      - "packages/engine/src/agent-api/compiler/diagnosticOnly.prd01.ts"
      - "benchmarks/quality-rebuild/scenes/prd01/**"
      - "benchmarks/quality-rebuild/aura3d/scenes/prd01/**"
      - "benchmarks/quality-rebuild/three/scenes/prd01/**"
      - "tests/qr/prd01/**"
      - "tests/unit/contracts/impl/prd01-*"
      - ".github/workflows/qr-prd01-core.yml"
  schedule:
    # Nightly on main (06:17 UTC), so lane 01 has a main run even on quiet days.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      flags:
        description: "GPU job: flag sets for the lane capture (comma-separated, e.g. core or none,core)"
        required: false
        default: "core"
      scenes:
        description: "GPU job: comma-separated prd01 lane scene ids for the lane capture (empty = all six)"
        required: false
        default: ""
  # PRD-16 §2.5: callable from qr-required.
  workflow_call: {}

concurrency:
  # One group per caller workflow + event + ref (a qr-required workflow_call
  # never cancels the direct PR run); main runs get a unique group (#844) and
  # are never cancelled. Stale PR / lane-branch runs are superseded.
  group: qr-prd01-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-main-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: "1"
  NODE_VERSION: "22"

jobs:
  gate:
    name: Lane gate (lint + ownership + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ownership gate diffs against the merge base; a depth-1 clone has
          # no origin/main and used to make the diff (and the gate) silently empty.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QR ownership check (lane prd01 files)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Every changed prd01/PRD-01 path must resolve to owner 01 in
          # .github/QR_OWNERSHIP.json. No owner exemptions: an out-of-lane file
          # needs a qr-request + ownership change, not a pass from this gate.
          ZERO=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              BASE=$(git merge-base "origin/$PR_BASE_REF" HEAD) ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                BASE="$PUSH_BEFORE"
              else
                BASE=$(git merge-base origin/main HEAD)
              fi ;;
            *)
              BASE=$(git merge-base origin/main HEAD) ;;
          esac
          echo "ownership diff base: $BASE"
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          awk '/prd01|PRD-01/' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/lane.txt"
          if [ ! -s "$RUNNER_TEMP/lane.txt" ]; then
            echo "no prd01 paths changed vs $BASE"
            exit 0
          fi
          xargs node tools/qr-ownership/check.mjs < "$RUNNER_TEMP/lane.txt" > "$RUNNER_TEMP/owners.txt"
          cat "$RUNNER_TEMP/owners.txt"
          awk -F'\t' '$1 != "01"' "$RUNNER_TEMP/owners.txt" > "$RUNNER_TEMP/non-lane.txt"
          if [ -s "$RUNNER_TEMP/non-lane.txt" ]; then
            echo "::error::prd01 paths not owned by lane 01:"
            cat "$RUNNER_TEMP/non-lane.txt"
            exit 1
          fi
      - name: Typecheck lane files
        run: pnpm exec tsc -p tests/qr/prd01/tsconfig.json --noEmit
      - name: Lane unit specs
        run: pnpm exec vitest run --config tests/qr/prd01/vitest.config.ts --reporter=dot
      - name: Lint lane files
        run: |
          pnpm exec eslint \
            "packages/engine/src/lanes/prd01.ts" \
            "packages/engine/src/lanes/prd01/**/*.ts" \
            "packages/engine/src/agent-api/compiler/diagnosticOnly.prd01.ts" \
            "benchmarks/quality-rebuild/scenes/prd01/**/*.ts" \
            "benchmarks/quality-rebuild/aura3d/scenes/prd01/**/*.ts" \
            "benchmarks/quality-rebuild/three/scenes/prd01/**/*.ts" \
            "tests/qr/prd01/**/*.ts"

  build-harness:
    name: Build harness + lane capture smoke
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lane harness
        run: pnpm exec vite build --config tests/qr/prd01/harness/vite.config.ts --logLevel warn
      - name: Upload harness dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd01-harness-dist
          path: tests/qr/prd01/harness/dist/
          retention-days: 7

  browser:
    name: Browser conformance (macos-14 / chromium)
    runs-on: macos-14
    needs: build-harness
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: prd01-harness-dist
          path: tests/qr/prd01/harness/dist/
      - run: pnpm exec playwright install chromium
      - name: Lane browser specs
        run: pnpm exec playwright test --config tests/qr/prd01/playwright.config.ts
      - name: Lane capture (flags none + core)
        if: always()
        run: node tests/qr/prd01/capture.mjs --flags none,core --out tests/qr/prd01/out/capture
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd01-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/qr/prd01/out/
          retention-days: 14

  # GPU visual-proof path for lane-01 fixes (self-hosted NVIDIA L4 scale set,
  # Vulkan ANGLE): the prd01 browser specs (sharded across GPU runners) plus
  # the lane capture on a real GPU. workflow_dispatch only, so PR code
  # (including forks) never reaches the self-hosted runner. Bench-scene / game
  # GPU capture is qr-azure-gpu.yml's (lane 12, #956); this job does not
  # duplicate it. Chromium args come from vars.QR_AZURE_GPU_CHROME_ARGS (same
  # convention as qr-azure-gpu.yml); each leg fails when it is unset or when
  # the WebGL renderer is software.
  #
  # Every leg bounds its Playwright run with QR_PRD01_GLOBAL_TIMEOUT_MS so a
  # hanging spec ends the run (red, unfinished specs reported as not run) with
  # reports written and uploaded, instead of the job timeout killing the
  # runner before the evidence upload (run 38118187423 lost all of it).
  gpu:
    name: "GPU ${{ matrix.leg }} (self-hosted azure-gpu / Vulkan)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, azure-gpu]
    needs: build-harness
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        leg: [specs-1, specs-2, specs-3, specs-4, capture]
    env:
      QR_PRD01_CHANNEL: chromium
      QR_PRD01_GLOBAL_TIMEOUT_MS: "3000000"
      PRD01_GPU_LEG: ${{ matrix.leg }}
      PRD01_GPU_FLAGS: ${{ inputs.flags || 'core' }}
      PRD01_GPU_SCENES: ${{ inputs.scenes || '' }}
      QR_AZURE_GPU_CHROME_ARGS: ${{ vars.QR_AZURE_GPU_CHROME_ARGS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: prd01-harness-dist
          path: tests/qr/prd01/harness/dist/
      - run: pnpm exec playwright install chromium
      - name: Chromium GPU args (vars.QR_AZURE_GPU_CHROME_ARGS)
        run: |
          set -euo pipefail
          if [ -z "${QR_AZURE_GPU_CHROME_ARGS:-}" ]; then
            echo "::error::vars.QR_AZURE_GPU_CHROME_ARGS is unset; set it to the runner's Chromium GPU flags (e.g. --headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist)"
            exit 1
          fi
          echo "QR_PRD01_CHROME_ARGS=$QR_AZURE_GPU_CHROME_ARGS" >> "$GITHUB_ENV"
          echo "chromium args: $QR_AZURE_GPU_CHROME_ARGS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the WebGL renderer is the GPU (not SwiftShader / llvmpipe)
        run: |
          set -euo pipefail
          mkdir -p tests/qr/prd01/out
          node tests/qr/prd01/gpu-renderer.mjs | tee tests/qr/prd01/out/renderer.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runner: $RUNNER_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lane browser specs (GPU, shard ${{ matrix.leg }})
        if: startsWith(matrix.leg, 'specs-')
        timeout-minutes: 60
        run: |
          set -euo pipefail
          shard="${PRD01_GPU_LEG#specs-}"
          pnpm exec playwright test --config tests/qr/prd01/playwright.config.ts --shard="$shard/4"
      - name: Lane capture (GPU)
        if: matrix.leg == 'capture'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          scene_args=()
          if [ -n "$PRD01_GPU_SCENES" ]; then scene_args=(--scenes "$PRD01_GPU_SCENES"); fi
          node tests/qr/prd01/capture.mjs --flags "$PRD01_GPU_FLAGS" "${scene_args[@]}" --out tests/qr/prd01/out/capture-gpu
      - name: Upload GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd01-gpu-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/qr/prd01/out/
          retention-days: 14
