# QR lane 01 — rendering core / color / HDR / PBR (PRD-01 §16.4)
#
# Mirrors .github/workflows/qr-contracts.yml conventions: lint + unit gates on
# ubuntu, browser conformance on macos-14, evidence upload for the browser run.

name: qr-prd01-core

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/engine/src/lanes/prd01*/**"
      - "packages/engine/src/lanes/prd01.ts"
      - "packages/engine/src/agent-api/compiler/diagnosticOnly.prd01.ts"
      - "benchmarks/quality-rebuild/scenes/prd01/**"
      - "benchmarks/quality-rebuild/aura3d/scenes/prd01/**"
      - "benchmarks/quality-rebuild/three/scenes/prd01/**"
      - "tests/qr/prd01/**"
      - ".github/workflows/qr-prd01-core.yml"
  push:
    branches: ["qr/**"]
    paths:
      - "packages/engine/src/lanes/prd01*/**"
      - "packages/engine/src/lanes/prd01.ts"
      - "packages/engine/src/agent-api/compiler/diagnosticOnly.prd01.ts"
      - "benchmarks/quality-rebuild/scenes/prd01/**"
      - "benchmarks/quality-rebuild/aura3d/scenes/prd01/**"
      - "benchmarks/quality-rebuild/three/scenes/prd01/**"
      - "tests/qr/prd01/**"
      - ".github/workflows/qr-prd01-core.yml"
  workflow_dispatch: {}

concurrency:
  group: qr-prd01-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-main-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: "1"
  NODE_VERSION: "22"

jobs:
  gate:
    name: Lane gate (lint + ownership + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QR ownership check (lane prd01 files)
        run: |
          set -e
          # Lane-owned paths must resolve to owner 01. tests/qr/prd01/* currently
          # resolves to owner 15 — a doc-vs-JSON gap tracked in
          # docs/project/aura3d-quality-rebuild/qr-requests/prd01.md (Q-15-1).
          CHANGED=$(git diff --name-only origin/main...HEAD | grep -E 'prd01|PRD-01' || true)
          if [ -n "$CHANGED" ]; then
            node tools/qr-ownership/check.mjs $CHANGED
            NON_LANE=$(node tools/qr-ownership/check.mjs $CHANGED | awk -F'\t' '$1 != "01" && $1 != "15" {print}' || true)
            if [ -n "$NON_LANE" ]; then echo "$NON_LANE"; exit 1; fi
          fi
      - name: Typecheck lane files
        run: pnpm exec tsc -p tests/qr/prd01/tsconfig.json --noEmit
      - name: Lane unit specs
        run: pnpm exec vitest run --config tests/qr/prd01/vitest.config.ts --reporter=dot
      - name: Lint lane files
        run: |
          pnpm exec eslint \
            "packages/engine/src/lanes/prd01.ts" \
            "packages/engine/src/lanes/prd01/**/*.ts" \
            "packages/engine/src/agent-api/compiler/diagnosticOnly.prd01.ts" \
            "benchmarks/quality-rebuild/scenes/prd01/**/*.ts" \
            "benchmarks/quality-rebuild/aura3d/scenes/prd01/**/*.ts" \
            "benchmarks/quality-rebuild/three/scenes/prd01/**/*.ts" \
            "tests/qr/prd01/**/*.ts" || true

  build-harness:
    name: Build harness + lane capture smoke
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lane harness
        run: pnpm exec vite build --config tests/qr/prd01/harness/vite.config.ts --logLevel warn
      - name: Upload harness dist
        uses: actions/upload-artifact@v4
        with:
          name: prd01-harness-dist
          path: tests/qr/prd01/harness/dist/
          retention-days: 7

  browser:
    name: Browser conformance (macos-14 / chromium)
    runs-on: macos-14
    needs: build-harness
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: prd01-harness-dist
          path: tests/qr/prd01/harness/dist/
      - run: pnpm exec playwright install chromium
      - name: Lane browser specs
        run: pnpm exec playwright test --config tests/qr/prd01/playwright.config.ts
      - name: Lane capture (flags none + core, identical while unwired)
        run: node tests/qr/prd01/capture.mjs --flags none,core --out tests/qr/prd01/out/capture
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd01-capture-${{ github.sha }}
          path: |
            tests/qr/prd01/out/
          retention-days: 14
