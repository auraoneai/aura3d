name: QR prd13 authoring

# Lane-13 (PRD-13) authoring gate: typecheck, lint, the lane's unit tests, and
# the tests/qr/prd13 delta suite (its own vitest config — the repo config's
# include list is prd15-owned). Runs on PRs to main and pushes to qr/*.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: qr-prd13-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:raw
      - run: pnpm exec eslint packages/engine/src/agent-api/looks packages/engine/src/agent-api/nodes/prompt packages/engine/src/lanes/prd13.ts tests/qr tests/unit/agent-api/looks.test.ts tests/unit/agent-api/look-lint.test.ts tests/unit/agent-api/prompt-plan-v2.test.ts tests/unit/agent-api/structural-qa.test.ts tests/unit/contracts/impl
      # Lane-scoped: 3 unrelated agent-api files (paused-render-clock,
      # production-bridge-boundary, canvas2d) fail on the whole stack today.
      - run: pnpm exec vitest run tests/unit/agent-api/looks.test.ts tests/unit/agent-api/look-lint.test.ts tests/unit/agent-api/prompt-plan-v2.test.ts tests/unit/agent-api/structural-qa.test.ts tests/unit/agent-api/agent-api.test.ts tests/unit/contracts
      - name: PRD-13 delta suite (bundle delta ≤ 12 KB gz)
        run: pnpm exec vitest run --config tests/qr/prd13/vitest.qr-prd13.config.ts

  # 13-SPECS: the three §17.2 browser specs (looks-expansion,
  # template-look-floor, prompt-plan-render) on an Apple-silicon GPU runner
  # (ANGLE Metal, the template-lookdev.yml pattern). The config sets
  # forbidOnly and retries: 0; nothing here is continue-on-error. The report
  # uploads on every outcome; the job result is the spec result.
  browser:
    name: Browser specs (macos-14, ANGLE Metal)
    runs-on: macos-14
    timeout-minutes: 120
    env:
      PRD13_CHROMIUM_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build:raw
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: 13-SPECS browser specs
        run: pnpm exec playwright test -c tests/qr/prd13/playwright.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-prd13-browser-report
          path: tests/reports/prd13-browser/
          retention-days: 30
          if-no-files-found: warn
