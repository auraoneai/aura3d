name: QR contracts

# Aura3D Quality Rebuild contract gate (CONTRACTS.md §1.1, §3.8). Runs the
# unit conformance suites everywhere and the browser conformance specs on
# macos-14 (Chromium, ANGLE Metal) — the same runner class as
# quality-rebuild-capture.yml.

on:
  pull_request:
    branches: [main]
  # main only: a qr/** push with an open PR ran every job twice (push +
  # pull_request). Branches without a PR use workflow_dispatch.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qr-contracts-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-main-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:raw
      - run: pnpm lint
      - run: pnpm exec vitest run tests/unit/contracts
      - run: node tools/qr-ownership/check.mjs

  # Throughput: the macOS browser job runs on pull_request only when contract
  # code or specs change (job-level, so the required `browser` check reports
  # skipped rather than pending). main pushes and dispatch always run it.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            browser:
              - 'tests/browser/contracts/**'
              - 'packages/*/src/contracts/**'
              - 'packages/*/src/lanes/**'
              - 'playwright.config.ts'
              - '.github/workflows/qr-contracts.yml'

  browser:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.browser == 'true')) }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Browser conformance specs
        run: pnpm exec playwright test --config playwright.config.ts tests/browser/contracts
