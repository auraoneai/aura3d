name: QR contracts

# Aura3D Quality Rebuild contract gate (CONTRACTS.md §1.1, §3.8). Runs the
# unit conformance suites everywhere and the browser conformance specs on
# macos-15 (Chromium, ANGLE Metal) — the same runner class as
# quality-rebuild-capture.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qr-contracts-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prd02-depth-variants-glsl (#867) validates every composed depth variant
      # with glslangValidator and fails when the binary is missing.
      - name: Install glslang
        run: |
          if ! command -v glslangValidator >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq glslang-tools
          fi
          glslangValidator --version
      - run: pnpm typecheck:raw
      - run: pnpm lint
      - run: pnpm exec vitest run tests/unit/contracts
      - run: node tools/qr-ownership/check.mjs

  browser:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Browser conformance specs
        run: pnpm exec playwright test --config playwright.config.ts tests/browser/contracts
