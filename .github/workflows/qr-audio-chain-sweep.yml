name: QR audio chain sweep

# Runs tools/quality-rebuild-capture/audio-chain-sweep.mjs (OfflineAudioContext
# master-chain transparency / peak sweep) in headless Chrome on the L4 track0
# runner. Push to qr/audio-sweep/** (dispatch needs the file on main).
on:
  push:
    branches: ['qr/audio-sweep/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qr-audio-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ["self-hosted", "track0", "gpu-l4"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: set -o pipefail; node tools/quality-rebuild-capture/audio-chain-sweep.mjs | tee -a "$GITHUB_STEP_SUMMARY"
