name: Browser Matrix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-browser-and-visual:
    name: Chromium Browser And Visual Checks
    timeout-minutes: 330
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two heavy specs dominate wall clock (route-primary probes ~86 min,
        # advanced gallery ~47 min measured on the hosted software rasterizer),
        # and the Playwright config runs a single worker. Give each heavy spec
        # its own job so no shard approaches the six-hour job limit.
        include:
          - node: 22
            shard: route-primary
            specs: tests/browser/showcase-route-primary-probes.spec.ts
          - node: 22
            shard: gallery
            specs: tests/browser/advanced-examples-gallery.spec.ts
          # Q02 replays these producer outputs. Blockfall gets its own fresh
          # SwiftShader worker because its six synchronous PNG readbacks can
          # otherwise exhaust the per-test budget after Turbo and Skyline.
          - node: 22
            shard: q02
            specs: >-
              tests/browser/showcase-gameplay-proof.spec.ts
              tests/browser/smart-city-composition-301.spec.ts
            playwright_args: --grep-invert "blockfall reactor"
          - node: 22
            shard: blockfall
            specs: tests/browser/showcase-gameplay-proof.spec.ts
            playwright_args: --grep "blockfall reactor"
          - node: 22
            shard: routes
            specs: >-
              tests/browser/wow-showcase-screenshots.spec.ts
              tests/browser/current-routes-route-health.spec.ts
              tests/browser/current-routes-parity-evidence.spec.ts
              tests/browser/product-demos.spec.ts
              tests/browser/loader-instancing-evidence.spec.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace packages
        run: pnpm build:raw

      - name: Browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tests/reports/browser-matrix/${{ matrix.shard }}/browser.json
          # The gallery audit rejects focused-route reports as a complete
          # gallery run. This matrix shard executes all ten routes, so bind its
          # outputs to the full-gallery evidence contract explicitly.
          A3D_ADVANCED_GALLERY_EVIDENCE_MODE: ${{ matrix.shard == 'gallery' && 'full-gallery' || 'focused-route' }}
        run: pnpm exec playwright test ${{ matrix.specs }} ${{ matrix.playwright_args }}

      - name: Visual tests
        if: matrix.shard == 'routes'
        run: pnpm test:visual

      - name: Bind exact-source shard report
        run: >-
          node tools/release/browser-matrix-receipts.mjs receipt
          "${{ matrix.shard }}"
          "tests/reports/browser-matrix/${{ matrix.shard }}/browser.json"
          "${{ matrix.specs }}"

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-reports-node-${{ matrix.node }}-${{ matrix.shard }}
          path: |
            tests/reports/browser-matrix/${{ matrix.shard }}/
            tests/reports/visual.json
            tests/reports/visual-browser.json
            tests/reports/pbr-environment-validation.json
            # The route-primary probes and gallery route reports are the producer
            # outputs the evidence-freshness gate audits. Without retaining them a
            # passing shard proves the run happened but leaves the retained
            # artifacts stale, so the aggregate can never observe fresh evidence.
            tests/reports/showcase-route-primary-probes/
            tests/reports/advanced-examples-gallery/
            tests/reports/wow-showcase/
            tests/reports/showcase-gameplay/
            tests/reports/smart-city-composition-301/
            test-results/
          if-no-files-found: ignore
