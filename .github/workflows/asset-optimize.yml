name: QR PRD-05 asset optimize

# Lane 05 (PRD-05) Phase 2: runs tools/asset-optimize over manifest entries.
# Triggered for PRs touching the tool or asset sources, and manually via
# workflow_dispatch (optionally with an explicit asset id list).

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/asset-optimize/**'
      - 'packages/aura3d-cli/src/commands/prd05/**'
      - 'packages/aura3d-cli/src/asset-manifest.ts'
      - 'public/aura-assets/**'
      - 'aura.assets.json'
      - 'tests/unit/asset-optimize/**'
      - '.github/workflows/asset-optimize.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated manifest asset ids to optimize (empty = --dry-run all models)'
        required: false
        type: string

concurrency:
  group: asset-optimize-${{ github.ref }}-${{ github.event.inputs.ids }}${{ github.ref == 'refs/heads/main' && format('-main-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # GLB sources are LFS-tracked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: install tool dependencies
        # root .gitignore forbids committed package-lock.json (pnpm repo);
        # package.json carries exact pins so `npm install` is deterministic.
        run: npm install --no-audit --no-fund --prefix tools/asset-optimize

      - name: optimize determinism test
        # PRD-16 05-S5: the pipeline must be byte-deterministic — this job is
        # the only place tools/asset-optimize/node_modules exists, so the
        # runIf(hasDeps) guard in the spec only goes live here.
        run: node_modules/.bin/vitest run tests/unit/asset-optimize/determinism.test.ts

      - name: install ktx from tool-versions.json
        id: ktx
        run: |
          set -euo pipefail
          tool="tools/asset-optimize"
          url=$(jq -r '.tools.ktx.url' "$tool/tool-versions.json")
          sha=$(jq -r '.tools.ktx.sha256' "$tool/tool-versions.json")
          bin=$(jq -r '.tools.ktx.binary' "$tool/tool-versions.json")
          tarball=/tmp/ktx.tar.bz2
          curl -sSfL "$url" -o "$tarball"
          echo "$sha  $tarball" | sha256sum -c -
          mkdir -p "$tool/.ktx"
          tar -xjf "$tarball" -C "$tool/.ktx"
          ktx_bin="$tool/.ktx/$bin"
          chmod +x "$ktx_bin"
          # ktx links libktx.so.4 from its install's lib/ dir
          ktx_lib="$(dirname "$(dirname "$ktx_bin")")/lib"
          echo "LD_LIBRARY_PATH=$ktx_lib" >> "$GITHUB_ENV"
          echo "ktx_bin=$ktx_bin" >> "$GITHUB_OUTPUT"
          LD_LIBRARY_PATH="$ktx_lib" "$ktx_bin" --version

      - name: validate ktx flag contract vs tool source
        run: |
          set -euo pipefail
          # profiles.ts hard-codes the ktx create flags used for every texture
          # codec; if upstream ktx drops or renames one, fail here instead of
          # during a texture run.
          help=$(LD_LIBRARY_PATH="$LD_LIBRARY_PATH" "${{ steps.ktx.outputs.ktx_bin }}" create --help 2>&1)
          missing=0
          while IFS= read -r flag; do
            [ -z "$flag" ] && continue
            if ! grep -q -- "$flag" <<<"$help"; then
              echo "::error::ktx create no longer supports required flag: $flag"
              missing=1
            fi
          done < <(grep -oE '"--[a-z0-9-]+"' tools/asset-optimize/types.ts | tr -d '"' | sort -u)
          [ "$missing" -eq 0 ]

      - name: derived-ids.txt is fresh against games.json
        run: node_modules/.bin/tsx --tsconfig tsconfig.base.json tools/asset-optimize/game-referenced-ids.mts --check

      - name: run optimize
        env:
          # Schema-1.1 writer gate: a real --ids pass writes derived entries
          # into aura.assets.json as aura3d.assets/1.1 (C-17 stub rule).
          A3D_QR: assets
        run: |
          set -euo pipefail
          ktx="$(pwd)/${{ steps.ktx.outputs.ktx_bin }}"
          ids="${{ github.event.inputs.ids }}"
          args=(--ktx "$ktx" --report evidence/prd05/assets/optimize-ci.json --out-dir optimize-out)
          if [ -n "$ids" ]; then
            args+=(--ids "$ids" --allow-local-small --no-manifest)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--dry-run)
          else
            # 05-S10: push / plain dispatch run the real pass over the
            # game-referenced id set (derived entries + manifest + aggregate).
            ids="$(grep -v '^#' tools/asset-optimize/derived-ids.txt | grep -v '^$' | paste -sd, -)"
            [ -n "$ids" ] || { echo "::error::derived-ids.txt has no ids"; exit 1; }
            args+=(--ids "$ids" --allow-local-small)
          fi
          node_modules/.bin/tsx --tsconfig tsconfig.base.json tools/asset-optimize/index.ts "${args[@]}"

      - name: derived aggregate bytes (05-S10 <= 80 MB over the id set)
        if: github.event_name != 'pull_request' && github.event.inputs.ids == ''
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, re, sys
          ids = [l.strip() for l in open('tools/asset-optimize/derived-ids.txt')
                 if l.strip() and not l.startswith('#')]
          # Primary derived file only: <id>.<hash8>.glb (not .mobile / .collision).
          files = os.listdir('optimize-out')
          total = 0
          rows = []
          for i in ids:
              pat = re.compile(re.escape(i) + r'\.[0-9a-f]{8}\.glb$')
              hits = sorted(f for f in files if pat.match(f))
              if len(hits) != 1:
                  rows.append({'id': i, 'bytes': None, 'status': 'MISSING' if not hits else 'AMBIGUOUS', 'files': hits})
                  continue
              b = os.path.getsize(os.path.join('optimize-out', hits[0]))
              total += b
              rows.append({'id': i, 'file': hits[0], 'bytes': b})
          limit = 80 * 1024 * 1024
          bad = [r for r in rows if r['bytes'] is None]
          doc = {'schema': 'aura3d.derived-aggregate/1.0', 'ids': len(ids),
                 'derivedBytes': total, 'budgetBytes': limit,
                 'withinBudget': total <= limit, 'unmeasured': len(bad), 'rows': rows}
          os.makedirs('evidence/prd05/assets', exist_ok=True)
          json.dump(doc, open('evidence/prd05/assets/derived-aggregate.json', 'w'), indent=2)
          print(f"derived total: {total/1024/1024:.1f} MB over {len(ids)} ids (budget 80.0 MB); unmeasured: {len(bad)}")
          # Fail closed: every id must derive, and the total must fit the budget.
          if bad:
              print("::error::ids without exactly one derived GLB: " + ", ".join(r['id'] for r in bad))
              sys.exit(1)
          if total > limit:
              print(f"::error::derived total {total} B exceeds {limit} B")
              sys.exit(1)
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-optimize-${{ github.sha }}
          path: |
            evidence/prd05/assets/optimize-ci.json
            evidence/prd05/assets/derived-aggregate.json
            optimize-out/
            aura.assets.json
            src/aura-assets.ts
          retention-days: 14
