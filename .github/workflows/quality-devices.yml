name: Quality Devices

# PRD-12 T5.6. Real-device lane on AWS Device Farm (no Azure equivalent): the 18
# games' 03-mid timeline on 2 iOS Safari + 2 Android Chrome devices, ephemeral
# project tagged project=aura3d-quality-gate.
#
# Provisioning is an operator action, not performed by agents:
#   /Users/gurbakshchahal/AuraOne/scripts/setup-auraone-shared-aws.sh
#   profile auraone-production-operator
# Until secrets exist the job fails fast and prints the minimal grant — see
# evidence/prd12/phase-5-devices.md. The emulated lane (quality-gate.yml mobile
# run 390x844@3) stays the blocking path meanwhile.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # T5.6-CI: OIDC to AWS instead of stored access keys

jobs:
  device-farm:
    name: AWS Device Farm (2x iOS Safari + 2x Android Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: us-west-2
      # Repository variables (not secrets): the role is assumed via OIDC; no
      # long-lived AWS keys are stored in GitHub (T5.6-CI).
      DEVICE_FARM_ROLE_ARN: ${{ vars.DEVICE_FARM_ROLE_ARN }}
      DEVICE_FARM_PROJECT_ARN: ${{ vars.DEVICE_FARM_PROJECT_ARN }}
      DEVICE_POOL_IOS: ${{ vars.DEVICE_FARM_POOL_IOS }}
      DEVICE_POOL_ANDROID: ${{ vars.DEVICE_FARM_POOL_ANDROID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Device Farm configuration
        run: |
          missing=""
          for v in DEVICE_FARM_ROLE_ARN DEVICE_FARM_PROJECT_ARN DEVICE_POOL_IOS DEVICE_POOL_ANDROID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Device Farm not provisioned (repository variables missing:$missing). Owner action: create an IAM role trusting token.actions.githubusercontent.com for repo:auraoneai/aura3d:ref:refs/heads/main with devicefarm:* on project=aura3d-quality-gate resources, then set the variables (see evidence/prd12/phase-5-devices.md)."
            exit 1
          fi

      - name: Assume the Device Farm role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEVICE_FARM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Device Farm access
        run: aws devicefarm get-project --arn "$DEVICE_FARM_PROJECT_ARN" --query 'project.name' --output text

      # The previous "Schedule Device Farm runs" step passed the project ARN as
      # --app-arn with a BUILTIN_FUZZ test: it measured nothing about the games
      # (RF3, T5.6). Scheduling real 03-mid runs needs an uploaded web test
      # package; until that exists the job fails here instead of reporting a
      # fake device run.
      - name: Schedule 03-mid device runs
        run: |
          echo "::error::T5.6: no Device Farm web test package exists yet (Appium/Playwright 03-mid driver). Device runs are not implemented; nothing was scheduled."
          exit 1
