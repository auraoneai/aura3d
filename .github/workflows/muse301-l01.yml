name: Muse 3.0.1 L01 exact packages
# L01 is the exact-package gate: build, pack all 29 packages once, then replay
# every packaged check against those exact tarballs. package-acceptance.mjs
# requires a remote Linux worker with a stable provider-issued identity, so this
# gate cannot be earned on a developer machine by design.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit to certify
        required: true
permissions: {contents: read}
env:
  AURA3D_REMOTE_PROVIDER: github-actions
jobs:
  l01:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          lfs: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: {version: 11.1.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm, registry-url: 'https://registry.npmjs.org'}
      # The receipt binds HEAD and a clean tree; a dirty checkout would produce a
      # receipt that cannot be replayed against this source.
      - run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: L01 exact-package producer
        env:
          AURA3D_REMOTE_WORKER_ID: muse301-l01-${{ inputs.source_commit }}
        run: pnpm exec tsx --tsconfig tsconfig.base.json tools/release/l01-producer.ts tests/reports/muse3jsparity/l01/${{ inputs.source_commit }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse301-l01-${{ inputs.source_commit }}
          path: |
            tests/reports/muse3jsparity/l01/
            tests/reports/release-tarballs/
            release-artifacts/
          if-no-files-found: warn
