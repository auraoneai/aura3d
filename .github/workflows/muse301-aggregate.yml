name: Muse 3.0.1 Aggregate cd25919b
on:
  push:
    branches: [ops/muse301-agg-cd25919b]
permissions: {contents: read}
env:
  AURA3D_REMOTE_PROVIDER: github-actions
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    # The tarball lifecycle packs 29 packages and runs 19 installed scaffold
    # lifecycles, and the K1 gates re-earn their own producers. Local execution
    # SIGKILLed 12 installs from memory pressure; a dedicated remote runner has
    # the headroom this sequence needs.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd25919b1298d93c128554085551a2b74cff711f
          lfs: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: {version: 11.1.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm, registry-url: 'https://registry.npmjs.org'}
      - run: |
          test "$(git rev-parse HEAD)" = "cd25919b1298d93c128554085551a2b74cff711f"
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # Browser specs resolve @aura3d/* through built dist output, so the
      # workspace must be built before any spec runs. Without this the producers
      # fail with "Cannot find module .../dist/index.js" instead of executing.
      - name: Build workspace packages
        run: pnpm build:raw
      # The K1 freshness gate enforces the PRD 30-minute rule against its
      # dependent producers. Re-earn them immediately before the aggregate so the
      # window is satisfied by execution order rather than by relaxing the rule.
      - name: Re-earn K1 dependent producers
        run: |
          pnpm exec playwright test \
            tests/browser/shadow-family-b1.spec.ts \
            tests/browser/contact-shimmer-b1b2.spec.ts \
            tests/browser/clustered-lighting-b5.spec.ts \
            tests/browser/d4-flipbook-beam.spec.ts \
            tests/browser/batch-consolidator-shootout.spec.ts \
            tests/browser/muse3jsparity-301-visual.spec.ts \
            tests/browser/muse3jsparity-301-engine-perf.spec.ts \
            tests/browser/muse3jsparity-301-root-governor.spec.ts \
            --reporter=line
          # gpu-particle-a4 owns three K1 artifacts across separate tests. Run the
          # two that are device-independent; the 60-second Apple Metal acceptance
          # test is P01, already closed by native run 34045615840, and cannot pass
          # on a Linux runner.
          pnpm exec playwright test tests/browser/gpu-particle-a4.spec.ts \
            -g "route-health|soft-particle" --reporter=line
      - name: Muse 3.0.1 readiness aggregate
        env:
          AURA3D_REMOTE_WORKER_ID: muse301-aggregate-cd25919b1298d93c128554085551a2b74cff711f
        run: pnpm muse3jsparity:release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse301-aggregate-cd25919b1298d93c128554085551a2b74cff711f
          path: |
            tests/reports/muse3jsparity/readiness.json
            tests/reports/muse3jsparity/quarantine.json
            tests/reports/muse3jsparity/runs/
          if-no-files-found: warn
