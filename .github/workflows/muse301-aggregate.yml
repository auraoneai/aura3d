name: Muse 3.0.1 Aggregate
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit to aggregate
        required: true
permissions: {contents: read}
env:
  AURA3D_REMOTE_PROVIDER: github-actions
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    # The tarball lifecycle packs 29 packages and runs 19 installed scaffold
    # lifecycles, and the K1 gates re-earn their own producers. Local execution
    # SIGKILLed 12 installs from memory pressure; a dedicated remote runner has
    # the headroom this sequence needs.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          lfs: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: {version: 11.1.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm, registry-url: 'https://registry.npmjs.org'}
      - run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # Browser specs resolve @aura3d/* through built dist output, so the
      # workspace must be built before any spec runs. Without this the producers
      # fail with "Cannot find module .../dist/index.js" instead of executing.
      - name: Build workspace packages
        run: pnpm build:raw
      - name: Muse 3.0.1 readiness aggregate
        env:
          AURA3D_REMOTE_WORKER_ID: muse301-aggregate-${{ inputs.source_commit }}
        run: pnpm muse3jsparity:release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse301-aggregate-${{ inputs.source_commit }}
          path: |
            tests/reports/muse3jsparity/readiness.json
            tests/reports/muse3jsparity/quarantine.json
            tests/reports/muse3jsparity/runs/
          if-no-files-found: warn
