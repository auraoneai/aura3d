name: Muse 3.0.1 Final Source Gallery e300225d
on:
  push:
    branches: [ops/muse301-gallery-926465f2]
permissions: {contents: read}
env: {SOURCE_COMMIT: e300225d5beeaafb6f84d93ee3ed38998773b2f4}
jobs:

  routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {ref: e300225d5beeaafb6f84d93ee3ed38998773b2f4, lfs: true}
      - uses: pnpm/action-setup@v4
        with: {version: 11.1.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" && test -z "$(git status --porcelain --untracked-files=all)"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: pnpm build:raw
      - run: pnpm exec playwright test tests/browser/showcase-gameplay-proof.spec.ts --grep "skyline runner" --reporter=line
      - run: pnpm exec playwright test tests/browser/smart-city-composition-301.spec.ts --reporter=line
      - run: node tools/release/muse301-gallery.mjs receipt gallery-routes final-route-review tests/reports/muse301-gallery/routes/receipt.json 20 tests/reports/showcase-gameplay tests/reports/smart-city-composition-301
      - uses: actions/upload-artifact@v4
        with: {name: gallery-routes, path: "tests/reports/showcase-gameplay/\ntests/reports/smart-city-composition-301/\ntests/reports/muse301-gallery/routes/receipt.json", if-no-files-found: error}


