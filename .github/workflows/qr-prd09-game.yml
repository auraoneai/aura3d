name: QR-09 game runtime

# PRD-09 lane workflow. Runs the @aura3d/game unit suites, the capture-parity
# tool gates, the beacon size-limit check, and builds the table fixture the
# route migration CI will serve.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/game/**"
      - "packages/audio/**"
      - "packages/engine/src/game/**"
      - "packages/engine/src/nodes/game/**"
      - "packages/engine/src/lanes/prd09.ts"
      - "packages/engine/src/agent-api/GameAppRuntime.ts"
      - "packages/engine/src/agent-api/app/createGameApp.ts"
      - "packages/engine/src/agent-api/nodes/game/**"
      - "packages/input/src/TouchLayouts.ts"
      - "apps/common/**"
      - "assets/packs/game-sfx-core/**"
      - "eslint/qr/**"
      - "tools/showcase-library/game-capture-parity.mjs"
      - "tools/quality-rebuild-capture/route-composition.mjs"
      - "tests/unit/game/**"
      - "tests/unit/engine/game-app-runtime.test.ts"
      - "tests/unit/tools/game-capture-parity.test.ts"
      - "tests/unit/tools/no-route-capture-flags.test.ts"
      - "tests/unit/contracts/impl/prd09-game.test.ts"
      - "tests/browser/game-shell/**"
      - "tests/browser/layout.spec.ts"
      - "tests/browser/touch.spec.ts"
      - "tests/browser/audio-live.spec.ts"
      - "tests/browser/example-dev-server.ts"
      - "tests/browser/mobile-touch-contract.ts"
      - "migration/**"
      - "packages/create-aura3d/templates/**"
      - "tools/showcase-library/template-creategame-audit.mjs"
      - "playwright.prd09.config.ts"
      - "tests/qr/prd09/no-skipped-reporter.ts"
      - ".github/workflows/qr-prd09-game.yml"
  push:
    branches: ["qr/prd09-*", "main"]
  # Nightly sweep of the owned source — catches drift PR gates can't see.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# §4.0: never cancel main runs. On main each run gets its own group (run_id),
# so a newer push neither cancels nor replaces a pending main run; other refs
# keep superseding their own in-flight runs.
concurrency:
  group: qr-prd09-game-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PRD-09 unit suites
        run: >
          pnpm exec vitest run
          tests/unit/game
          tests/unit/tools/game-capture-parity.test.ts
          tests/unit/tools/no-route-capture-flags.test.ts
          tests/unit/engine/game-app-runtime.test.ts
          tests/unit/contracts/impl/prd09-game.test.ts
      - name: Capture-parity tool gates
        run: |
          node tools/showcase-library/game-capture-parity.mjs --routes aura-clash-showcase --fail-on-any
          node tools/showcase-library/game-capture-parity.mjs
      - name: Beacon size-limit (< 0.5 kB gz)
        working-directory: packages/game
        run: pnpm exec size-limit --config size-limit.json

  all-routes-shadow:
    # Shadow-migration proof (PRD-09 §10): apply every shipped patch set onto a
    # pristine main worktree, then gate `game-capture-parity --fail-on-any` per
    # route and record the route-composition before/after (migration/after.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply every migration patch set to a main worktree
        run: |
          git config user.email "qr-prd09@example.invalid"
          git config user.name "qr-prd09 shadow"
          git worktree add /tmp/all-shadow origin/main --detach
          cd /tmp/all-shadow
          for dir in "$GITHUB_WORKSPACE"/docs/project/aura3d-quality-rebuild/migration/patches/*/; do
            git am "$dir"*.patch
          done
      - name: Capture-parity gate on the migrated tree
        run: |
          # Per-route gate first (clear failure attribution), then the fleet
          # sweep so routes without a patch set stay honest too.
          for dir in docs/project/aura3d-quality-rebuild/migration/patches/*/; do
            route=$(basename "$dir")
            node tools/showcase-library/game-capture-parity.mjs \
              --root /tmp/all-shadow --routes "$route" --fail-on-any
          done
          node tools/showcase-library/game-capture-parity.mjs \
            --root /tmp/all-shadow --fail-on-art --fail-on-framing --fail-on-transient
      - name: Route-composition before/after
        run: |
          node tools/quality-rebuild-capture/route-composition.mjs --json /tmp/composition-before.json
          node tools/quality-rebuild-capture/route-composition.mjs --root /tmp/all-shadow --json /tmp/composition-after.json
      - name: Upload composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd09-route-composition
          path: |
            /tmp/composition-before.json
            /tmp/composition-after.json
          retention-days: 30
          if-no-files-found: warn

  templates-creategame:
    # PRD-09 §12 (Q-13-1): generate every game template into a scratch dir and
    # assert the shared-runtime contract — createGame mount, game-sfx-core cues,
    # juice event map, HUD theme + touch preset, 0 `?capture` branches, 0 synth
    # cues. Generation is source-level (no install/build), so the audit runs on
    # ubuntu and stays honest when @aura3d/game ships via the engine tarball.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the five game templates into a scratch dir
        run: |
          for t in mini-game racing-starter falling-blocks-starter fighting-game character-controller; do
            pnpm exec tsx --tsconfig tsconfig.base.json packages/create-aura3d/src/cli.ts "/tmp/tpl-$t" --template "$t" --no-agent
          done
      - name: Assert createGame + 0 capture branches + 0 synth cues
        run: node tools/showcase-library/template-creategame-audit.mjs --root /tmp

  browser-macos:
    # PRD-09 §18: the lane's browser gate on real browsers — Chromium (ANGLE
    # Metal) as primary, plus the WebKit and Firefox projects. Specs self-serve
    # the repo root via tests/browser/example-dev-server.ts, which also exposes
    # packages/game/fixtures/* to the specs that need fixture routes.
    name: Browser specs (macos-14)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit firefox

      - name: Game-shell + layout + touch + audio-live specs (Chromium/WebKit/Firefox)
        env:
          # Resolved against the config dir (repo root); matches the upload path.
          PLAYWRIGHT_JSON_OUTPUT_NAME: tests/reports/browser-prd09-macos.json
        run: pnpm exec playwright test --config playwright.prd09.config.ts

      - name: Beacon size-limit (< 0.5 kB gz)
        working-directory: packages/game
        run: pnpm exec size-limit --config size-limit.json

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd09-browser-macos
          path: |
            tests/reports/browser-prd09-macos.json
            test-results/
          retention-days: 30
          if-no-files-found: warn
