name: QR-09 game runtime

# PRD-09 lane workflow. Runs the @aura3d/game unit suites, the capture-parity
# tool gates, the beacon size-limit check, and builds the table fixture the
# route migration CI will serve.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/game/**"
      - "packages/engine/src/nodes/game/**"
      - "packages/engine/src/lanes/prd09.ts"
      - "packages/engine/src/agent-api/GameAppRuntime.ts"
      - "eslint/qr/**"
      - "tools/showcase-library/game-capture-parity.mjs"
      - "tests/unit/game/**"
      - "tests/unit/engine/game-app-runtime.test.ts"
      - "tests/unit/tools/game-capture-parity.test.ts"
      - "tests/unit/tools/no-route-capture-flags.test.ts"
      - "tests/unit/contracts/impl/prd09-game.test.ts"
      - "migration/**"
      - ".github/workflows/qr-prd09-game.yml"
  push:
    branches: ["qr/prd09-*"]
  workflow_dispatch:

concurrency:
  group: qr-prd09-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PRD-09 unit suites
        run: >
          pnpm exec vitest run
          tests/unit/game
          tests/unit/tools/game-capture-parity.test.ts
          tests/unit/tools/no-route-capture-flags.test.ts
          tests/unit/engine/game-app-runtime.test.ts
          tests/unit/contracts/impl/prd09-game.test.ts
      - name: Capture-parity tool gates
        run: |
          node tools/showcase-library/game-capture-parity.mjs --routes aura-clash-showcase --fail-on-any
          node tools/showcase-library/game-capture-parity.mjs
      - name: Beacon size-limit (< 0.5 kB gz)
        working-directory: packages/game
        run: pnpm exec size-limit --config size-limit.json

  all-routes-shadow:
    # Shadow-migration proof (PRD-09 §10): apply every shipped patch set onto a
    # pristine main worktree, then gate `game-capture-parity --fail-on-any` per
    # route and record the route-composition before/after (migration/after.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply every migration patch set to a main worktree
        run: |
          git config user.email "qr-prd09@example.invalid"
          git config user.name "qr-prd09 shadow"
          git worktree add /tmp/all-shadow origin/main --detach
          cd /tmp/all-shadow
          for dir in "$GITHUB_WORKSPACE"/docs/project/aura3d-quality-rebuild/migration/patches/*/; do
            git am "$dir"*.patch
          done
      - name: Capture-parity gate on the migrated tree
        run: |
          # Per-route gate first (clear failure attribution), then the fleet
          # sweep so routes without a patch set stay honest too.
          for dir in docs/project/aura3d-quality-rebuild/migration/patches/*/; do
            route=$(basename "$dir")
            node tools/showcase-library/game-capture-parity.mjs \
              --root /tmp/all-shadow --routes "$route" --fail-on-any
          done
          node tools/showcase-library/game-capture-parity.mjs \
            --root /tmp/all-shadow --fail-on-art --fail-on-framing --fail-on-transient
      - name: Route-composition before/after
        run: |
          node tools/quality-rebuild-capture/route-composition.mjs --json /tmp/composition-before.json
          node tools/quality-rebuild-capture/route-composition.mjs --root /tmp/all-shadow --json /tmp/composition-after.json
      - name: Upload composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd09-route-composition
          path: |
            /tmp/composition-before.json
            /tmp/composition-after.json
          retention-days: 30
          if-no-files-found: warn
