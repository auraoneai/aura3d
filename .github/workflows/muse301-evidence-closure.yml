name: Muse 3.0.1 Evidence Closure

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit to close
        required: true
      browser_run_id:
        description: Successful Browser Matrix run for the exact source
        required: true
      l01_run_id:
        description: Successful L01 run for the exact source
        required: true
      h2h_run_id:
        description: Successful installed head-to-head run for the exact source
        required: true

permissions:
  contents: read
  actions: read

env:
  AURA3D_REMOTE_PROVIDER: github-actions

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          lfs: true
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify exact successful producer runs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BROWSER_RUN_ID: ${{ inputs.browser_run_id }}
          L01_RUN_ID: ${{ inputs.l01_run_id }}
          H2H_RUN_ID: ${{ inputs.h2h_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          for run_id in "$BROWSER_RUN_ID" "$L01_RUN_ID" "$H2H_RUN_ID"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "$SOURCE_COMMIT"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
          done

      - name: Restore exact browser producer evidence
        uses: actions/download-artifact@v4
        with:
          pattern: browser-matrix-reports-node-22-*
          path: .
          merge-multiple: true
          run-id: ${{ inputs.browser_run_id }}
          github-token: ${{ github.token }}

      - name: Restore exact installed head-to-head evidence
        uses: actions/download-artifact@v4
        with:
          # H2H uploads only paths below tests/reports, so upload-artifact strips
          # that common prefix. Restore beneath it explicitly.
          name: muse301-h2h-${{ inputs.source_commit }}
          path: tests/reports
          run-id: ${{ inputs.h2h_run_id }}
          github-token: ${{ github.token }}

      - name: Restore exact L01 evidence
        uses: actions/download-artifact@v4
        with:
          # L01 also uploads root-level files, so its archive preserves full
          # repository-relative paths. Restore it last so its certified tarballs
          # remain authoritative if H2H produced the same archives independently.
          name: muse301-l01-${{ inputs.source_commit }}
          path: .
          run-id: ${{ inputs.l01_run_id }}
          github-token: ${{ github.token }}

      - name: Install dependencies and browser
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium

      - name: Build workspace packages
        run: pnpm build:raw

      - name: Produce Q02 source, route, asset, and final-claims receipt
        env:
          AURA3D_REMOTE_WORKER_ID: muse301-q02-${{ inputs.source_commit }}
        run: |
          pnpm exec tsx --tsconfig tsconfig.base.json tools/release/build-final-claims-input.ts
          pnpm exec tsx --tsconfig tsconfig.base.json tools/release/q02-producer.ts "tests/reports/muse3jsparity/q02/${{ inputs.source_commit }}"

      - name: Collect all source-exact work-order receipts
        env:
          AURA3D_REMOTE_WORKER_ID: muse301-work-orders-${{ inputs.source_commit }}
        run: |
          pnpm exec tsx --tsconfig tsconfig.base.json tools/release/collect-work-orders.ts \
            --pool "tests/reports/muse3jsparity/pool-${{ inputs.source_commit }}" \
            --receipts "tests/reports/muse3jsparity/wo-${{ inputs.source_commit }}"

      - name: Finalize evidence manifest
        run: |
          pnpm exec tsx --tsconfig tsconfig.base.json tools/release/finalize-evidence-manifest.ts \
            tests/reports/muse3jsparity/evidence-manifest.json \
            "tests/reports/muse3jsparity/l01/${{ inputs.source_commit }}/validation.json" \
            "tests/reports/muse3jsparity/q02/${{ inputs.source_commit }}/validation.json"

      - name: Run full readiness aggregate
        env:
          AURA3D_REMOTE_WORKER_ID: muse301-aggregate-${{ inputs.source_commit }}
        run: pnpm muse3jsparity:release --evidence-manifest=tests/reports/muse3jsparity/evidence-manifest.json

      - name: Upload source-bound closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse301-evidence-closure-${{ inputs.source_commit }}
          path: |
            tests/reports/muse3jsparity/evidence-manifest.json
            tests/reports/muse3jsparity/q02/
            tests/reports/muse3jsparity/readiness.json
            tests/reports/muse3jsparity/quarantine.json
            tests/reports/muse3jsparity/runs/
            tests/reports/muse3jsparity/wo-${{ inputs.source_commit }}/
            tests/reports/muse3jsparity-final-claims-input.json
            release-artifacts/3.0.1/archive/
          if-no-files-found: warn
