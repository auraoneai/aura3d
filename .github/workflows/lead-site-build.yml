name: lead-site-build
# Program-lead release helper: builds the marketing site + showcase apps from this
# commit on a remote runner and uploads marketing/dist. No secrets; the deploy is
# done separately from the operator machine with the existing Vercel CLI login.
on:
  push:
    branches: ['qr/lead-site-build']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.3 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir marketing build
      - run: du -sh marketing/dist && ls marketing/dist | head -40
      - uses: actions/upload-artifact@v4
        with: { name: marketing-dist, path: marketing/dist, retention-days: 3, if-no-files-found: error }
