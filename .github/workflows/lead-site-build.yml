name: Lead site build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-site-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build marketing site with materialized LFS assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Materialize game assets from Git LFS
        run: |
          set -euo pipefail
          git lfs version >/dev/null 2>&1 || { echo "::error::git-lfs is not installed on this runner"; exit 1; }
          git lfs pull --include="public/aura-assets/**,apps/*/public/**,examples/*/public/**"

      - run: pnpm install --frozen-lockfile

      - name: Build engine and marketing routes
        run: |
          set -euo pipefail
          pnpm build
          pnpm --dir marketing build

      - name: Verify deployed asset payloads are real binaries
        run: |
          set -euo pipefail
          sample="$(find marketing/dist/aura-assets -type f -name '*.glb' | sort | head -n 1)"
          test -n "$sample"
          magic="$(head -c 4 "$sample")"
          test "$magic" = "glTF"
          {
            echo "### Lead site build"
            echo
            echo "- sample GLB: $sample"
            echo "- sample magic: $magic"
            echo "- GLBs: $(find marketing/dist/aura-assets -type f -name '*.glb' | wc -l | tr -d ' ')"
            echo "- output size: $(du -sh marketing/dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: marketing/dist
          retention-days: 14
          if-no-files-found: error
