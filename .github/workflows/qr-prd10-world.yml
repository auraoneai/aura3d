name: QR PRD-10 World

# Lane 10 (world building & environment systems) gate. Unit + ownership checks
# run on ubuntu; browser specs run on macos-14 (Chromium, ANGLE Metal) — the
# same runner class as quality-rebuild-capture.yml, which the `capture` job
# dispatches with the C-33 `qr_flags` input for both `world` and `none` on the
# `prd10-*` scenes.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/engine/src/agent-api/world/**"
      - "packages/engine/src/lanes/prd10.ts"
      - "packages/engine/src/production-runtime/world/**"
      - "packages/rendering/src/world/**"
      - "packages/rendering/src/lanes/prd10.ts"
      - "packages/aura3d-cli/src/commands/prd10/**"
      - "benchmarks/quality-rebuild/**/prd10/**"
      - "tests/unit/contracts/impl/prd10-*.ts"
      - "tests/browser/qr-prd10-*.ts"
      - ".github/workflows/qr-prd10-world.yml"
  push:
    branches: [main, "qr/**"]
    paths:
      - "packages/engine/src/agent-api/world/**"
      - "packages/engine/src/lanes/prd10.ts"
      - "packages/engine/src/production-runtime/world/**"
      - "packages/rendering/src/world/**"
      - "packages/rendering/src/lanes/prd10.ts"
      - "packages/aura3d-cli/src/commands/prd10/**"
      - "benchmarks/quality-rebuild/**/prd10/**"
      - "tests/unit/contracts/impl/prd10-*.ts"
      - "tests/browser/qr-prd10-*.ts"
      - ".github/workflows/qr-prd10-world.yml"
  workflow_dispatch:
  # Reusable — other lane/meta workflows may invoke this gate in place.
  workflow_call:
  # Nightly lane audit so a broken main cannot sit green-looking until a PR
  # touches it (10-CI).
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read
  actions: write # capture job dispatches quality-rebuild-capture.yml

concurrency:
  group: qr-prd10-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:raw
      - run: pnpm lint
      # lane unit tests + the full contract suite (C-26 runs stub + real)
      - run: pnpm exec vitest run tests/unit/contracts tests/unit/contracts/impl
      - run: node tools/qr-ownership/check.mjs

  browser:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dist/ is required: specs import @aura3d/* package specifiers whose
      # exports map to ./dist (package exports), not src. Without this the
      # browser step collected 0 tests silently (browser.json expected:0).
      - run: pnpm build:raw
      - run: pnpm exec playwright install chromium
      # T1.14/10-CI: every qr-prd10-*.spec.ts on disk runs — no masks, no
      # continue-on-error; a red spec must red the lane.
      - name: prd10 browser specs (all qr-prd10-*.spec.ts)
        run: pnpm exec playwright test --config playwright.config.ts tests/browser/qr-prd10-chunks.spec.ts tests/browser/qr-prd10-world-pass-depth.spec.ts tests/browser/qr-prd10-time-of-day.spec.ts tests/browser/qr-prd10-flag-off-identity.spec.ts tests/browser/qr-prd10-terrain-cracks.spec.ts tests/browser/qr-prd10-terrain-gpu-cpu.spec.ts tests/browser/qr-prd10-terrain-splat-bake.spec.ts
      # 10-CI: an empty collection or a skipped test is a red job — never a
      # green report on nothing. Collected/skipped counts come from the JSON
      # report Playwright writes next to the HTML one.
      - name: Fail on 0 collected or any skipped
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const f = "tests/reports/browser.json";
            if (!fs.existsSync(f)) { console.error("no playwright json report at " + f); process.exit(1); }
            const r = JSON.parse(fs.readFileSync(f, "utf8"));
            const s = r.stats || {};
            const collected = (s.expected ?? 0) + (s.unexpected ?? 0) + (s.flaky ?? 0);
            const skipped = s.skipped ?? 0;
            console.log(`collected=${collected} skipped=${skipped}`);
            if (collected === 0 || skipped > 0) process.exit(1);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-prd10-browser-${{ github.run_id }}
          path: tests/reports/
          if-no-files-found: ignore

  capture:
    # GPU evidence routes to the GitLab mirror (qr-gitlab-ci bridge) for the
    # prd10 scenes under both flag arms. Dispatch only — reports and diffs
    # live in that pipeline's artifacts.
    runs-on: ubuntu-latest
    steps:
      # T1.14/10-CI: GPU evidence routes to the GitLab mirror (qr-gitlab-ci
      # bridge on saas-macos-medium-m1) — the honest failure modes apply:
      # dispatch errors fail the job instead of `|| echo` masking them, and
      # the run lookup is pinned to runs created after dispatch (the old
      # `-L 1` grab raced other dispatches and could report a stale run).
      - name: Dispatch GitLab benchmark (qr_flags=world)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run qr-gitlab-ci.yml \
            -R "${GITHUB_REPOSITORY}" \
            --ref "$GITHUB_REF_NAME" \
            -f suite=benchmark \
            -f flags=world \
            -f requester=prd10
          sleep 5
          run_id=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow=qr-gitlab-ci.yml --branch "$GITHUB_REF_NAME" -L 5 --json databaseId,createdAt -q "map(select(.createdAt > \"$dispatched_at\")) | .[0].databaseId")
          echo "### capture (world) run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch GitLab benchmark (qr_flags=none)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run qr-gitlab-ci.yml \
            -R "${GITHUB_REPOSITORY}" \
            --ref "$GITHUB_REF_NAME" \
            -f suite=benchmark \
            -f flags=none \
            -f requester=prd10
          sleep 5
          run_id=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow=qr-gitlab-ci.yml --branch "$GITHUB_REF_NAME" -L 5 --json databaseId,createdAt -q "map(select(.createdAt > \"$dispatched_at\")) | .[0].databaseId")
          echo "### capture (none) run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
