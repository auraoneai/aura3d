name: QR prd08 camera/loop/feel

# Lane-08 gate (PRD-08 §4.1, CONTRACTS.md §1.1): typecheck, lint (repo-wide,
# same as qr-contracts), the lane's unit suites under both flag states
# (A3D_QR=none and A3D_QR=camera), the camera-cast codemod fixtures, and
# ownership coverage for lane-08 paths.
#
# Remote-only per PRD-08 §15: browser conformance + frame pacing run on
# macos-15 (Chromium, ANGLE Metal); motion-scene captures run on macos-15 and
# upload strips/webm as artifacts. The canonical judged frames route through
# the GitLab mirror via `[qr-gitlab:benchmark flags=camera]` push tags
# (CI-ROUTING.md); this workflow never compares frames across providers.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/engine/src/agent-api/{camera,feel,time,controls,vehicle}/**'
      - 'packages/engine/src/agent-api/app/{frameAlpha,frameLoopDefaults}.ts'
      - 'packages/engine/src/{FrameLoop,GameRuntime,GameFeel,GameCameraRigs,CameraChoreographer,VehicleChassis,GameSceneGeometryBindings,GameGenreKits,PlatformerMotion}.ts'
      - 'packages/engine/src/agent-api/nodes/camera.ts'
      - 'packages/engine/src/lanes/prd08.ts'
      - 'packages/rendering/src/lanes/prd08.ts'
      - 'packages/rendering/src/shaders/camera-fade.glsl.ts'
      - 'packages/physics/src/{Raycast,ScenePhysicsBridge}.ts'
      - 'packages/scene/src/MathTypes.ts'
      - 'packages/input/**'
      - 'tools/camera-cast-codemod/**'
      - 'benchmarks/quality-rebuild/motion/**'
      - 'benchmarks/quality-rebuild/scenes/prd08/**'
      - 'benchmarks/quality-rebuild/aura3d/scenes/prd08/**'
      - 'benchmarks/quality-rebuild/three/scenes/prd08/**'
      - 'packages/aura3d-cli/src/commands/prd08/**'
      - 'tests/qr/prd08/**'
      - 'tests/unit/engine/{fixed-step-determinism,game-camera-rigs,game-feel,platformer-motion,vehicle-chassis}.test.ts'
      - 'tests/unit/contracts/impl/prd08-*.ts'
      - 'docs/project/aura3d-quality-rebuild/PRD-08-camera-controls-game-feel.md'
      - 'docs/project/aura3d-quality-rebuild/evidence/prd08/**'
      - '.github/workflows/qr-prd08-camera.yml'
  push:
    branches: [main]
    paths:
      - 'packages/engine/src/agent-api/{camera,feel,time,controls,vehicle}/**'
      - 'packages/engine/src/agent-api/app/{frameAlpha,frameLoopDefaults}.ts'
      - 'packages/engine/src/{FrameLoop,GameRuntime,GameFeel,GameCameraRigs,CameraChoreographer,VehicleChassis,GameSceneGeometryBindings,GameGenreKits,PlatformerMotion}.ts'
      - 'packages/engine/src/agent-api/nodes/camera.ts'
      - 'packages/engine/src/lanes/prd08.ts'
      - 'packages/rendering/src/lanes/prd08.ts'
      - 'packages/rendering/src/shaders/camera-fade.glsl.ts'
      - 'packages/physics/src/{Raycast,ScenePhysicsBridge}.ts'
      - 'packages/scene/src/MathTypes.ts'
      - 'packages/input/**'
      - 'tools/camera-cast-codemod/**'
      - 'benchmarks/quality-rebuild/motion/**'
      - 'benchmarks/quality-rebuild/scenes/prd08/**'
      - 'benchmarks/quality-rebuild/aura3d/scenes/prd08/**'
      - 'benchmarks/quality-rebuild/three/scenes/prd08/**'
      - 'packages/aura3d-cli/src/commands/prd08/**'
      - 'tests/qr/prd08/**'
      - 'tests/unit/engine/{fixed-step-determinism,game-camera-rigs,game-feel,platformer-motion,vehicle-chassis}.test.ts'
      - 'tests/unit/contracts/impl/prd08-*.ts'
      - 'docs/project/aura3d-quality-rebuild/PRD-08-camera-controls-game-feel.md'
      - 'docs/project/aura3d-quality-rebuild/evidence/prd08/**'
      - '.github/workflows/qr-prd08-camera.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      # #956 pattern: macOS GPU jobs can run on the Linux L4 pools when macOS
      # is starved. azure-gpu / track0 are Linux (Vulkan ANGLE, Chrome args
      # from vars.QR_AZURE_GPU_CHROME_ARGS). Default is track0 (L4): hosted
      # macos-15 never picked up a job for this repo (2026-10-11: 81 queued,
      # 0 completed), and queued runs held the main concurrency group so no
      # main run ever completed. Frames compare only within one runner class.
      runner:
        description: "GPU runner for browser-gpu + motion-capture"
        type: choice
        options: [track0, azure-gpu, macos-15]
        default: track0
  workflow_call:

concurrency:
  group: qr-prd08-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-d-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  QRC_RUNNER: ${{ inputs.runner || 'track0' }}
  QRC_GPU_ARGS: ${{ (inputs.runner || 'track0') == 'macos-15' && '--use-angle=metal --enable-gpu --ignore-gpu-blocklist' || (vars.QR_AZURE_GPU_CHROME_ARGS || '--headless=new --use-angle=vulkan --enable-features=Vulkan --ignore-gpu-blocklist') }}

jobs:
  unit:
    name: "unit (A3D_QR=${{ matrix.flags }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags: [none, camera]
    env:
      A3D_QR: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lane-08 unit suites (frame loop, time, interpolation, spring, spline, framing, noise, bicycle, fromSpec parity, codemod)
        run: pnpm exec vitest run --config tests/qr/prd08/vitest.config.ts
      - name: Lane-08 engine unit files
        run: pnpm exec vitest run tests/unit/engine/fixed-step-determinism.test.ts tests/unit/engine/game-camera-rigs.test.ts tests/unit/engine/game-feel.test.ts tests/unit/engine/platformer-motion.test.ts tests/unit/engine/vehicle-chassis.test.ts
      - name: C-22/C-23 impl conformance
        run: pnpm exec vitest run tests/unit/contracts/impl/prd08-time.test.ts tests/unit/contracts/impl/prd08-camera.test.ts
      - name: camera-cast codemod report (must list every known cast site)
        run: |
          node tools/camera-cast-codemod/index.mjs apps packages/create-aura3d/templates --report \
            | tee /tmp/camera-cast.md
          # Lane 14 moved the pre-v2 game sources to src/legacy/; same cast sites.
          grep -q 'showcase-courier-rush/src/legacy/main.ts:1394' /tmp/camera-cast.md
          grep -q 'showcase-patrol-wing/src/legacy/main.ts:796' /tmp/camera-cast.md
          grep -q 'showcase-turbo-drift-circuit/src/legacy/main.ts:2760' /tmp/camera-cast.md
          grep -q 'showcase-cinematic-architecture/src/main.ts:500' /tmp/camera-cast.md
          grep -q 'showcase-skyline-runner/src/legacy/feel.ts' /tmp/camera-cast.md
          grep -q 'showcase-blockfall-reactor/src/legacy/camera-feel.ts' /tmp/camera-cast.md
      - run: node tools/qr-ownership/check.mjs
      # Repo-wide gates run after the lane suites so lane results are always
      # reported. T0-31 (lane 15) tracks pre-existing typecheck errors on main;
      # these steps stay unmasked — no continue-on-error per the program rule.
      - run: pnpm typecheck:raw
      - run: pnpm lint

  browser-gpu:
    name: browser-gpu (${{ (inputs.runner || 'track0') == 'macos-15' && 'macos-15, ANGLE Metal' || format('{0} L4, ANGLE Vulkan', inputs.runner || 'track0') }})
    runs-on: ${{ (inputs.runner || 'track0') == 'azure-gpu' && fromJSON('["self-hosted","azure-gpu","gpu-l4"]') || ((inputs.runner || 'track0') == 'track0' && fromJSON('["self-hosted","track0","gpu-l4"]')) || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # Fail closed on a software rasterizer (SwiftShader/llvmpipe) before any
      # GPU evidence is recorded; renderer.txt is uploaded with the reports.
      - name: GPU preflight (reject software rendering)
        env:
          CHROME_ARGS: ${{ env.QRC_GPU_ARGS }}
        run: node tests/qr/prd08/gpu-preflight.mjs
      - name: L-9 frame pacing + camera/feel specs (S1/S2/S3, scripted rAF)
        env:
          A3D_QR: camera
          CHROME_ARGS: ${{ env.QRC_GPU_ARGS }}
        run: pnpm exec playwright test --config tests/qr/prd08/playwright.config.ts
      - name: Frame-pacing CSV evidence (§20 item 3)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd08-frame-pacing-${{ github.run_id }}
          path: tests/reports/prd08/
          if-no-files-found: error
      - name: Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd08-playwright-${{ github.run_id }}
          path: tests/qr/prd08/playwright-report/
          if-no-files-found: error

  motion-capture:
    name: motion scenes (${{ (inputs.runner || 'track0') == 'macos-15' && 'macos-15, ANGLE Metal' || format('{0} L4, ANGLE Vulkan', inputs.runner || 'track0') }})
    runs-on: ${{ (inputs.runner || 'track0') == 'azure-gpu' && fromJSON('["self-hosted","azure-gpu","gpu-l4"]') || ((inputs.runner || 'track0') == 'track0' && fromJSON('["self-hosted","track0","gpu-l4"]')) || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # Fail closed: the six prd08-motion-* scenes (motion/scenes.ts) must be
      # discovered, built and captured; no "none registered" skip path.
      - name: Discover registered prd08-motion scenes
        id: scenes
        run: |
          IDS="$(grep -oE 'prd08-motion-[a-z0-9-]+' benchmarks/quality-rebuild/motion/scenes.ts | sort -u | paste -sd, -)"
          if [ -z "${IDS}" ]; then
            echo "::error::no prd08-motion-* scenes found in benchmarks/quality-rebuild/motion/scenes.ts"
            exit 1
          fi
          echo "ids=${IDS}" >> "$GITHUB_OUTPUT"
          echo "motion scenes: ${IDS}"
      - name: Build benchmark bundle
        run: pnpm exec vite build --config benchmarks/quality-rebuild/vite.config.ts
      # capture.mjs exits non-zero when no scene is captured or any capture is
      # not ready (T0-11/P-01), so quarantined scenes fail this step.
      - name: Capture prd08-motion-* (12-frame strip + WebM, flags=camera)
        env:
          QR_BENCH_CHROME_ARGS: ${{ env.QRC_GPU_ARGS }}
        run: |
          node benchmarks/quality-rebuild/capture.mjs \
            --scenes "${{ steps.scenes.outputs.ids }}" \
            --engines aura3d,three --flags camera \
            --out benchmarks/quality-rebuild/out/prd08-motion
      # S9: `aura3d prd08 motion-report` renders report.json (strips +
      # trajectory metrics) to markdown; exits non-zero on incomplete evidence
      # (missing scene/engine, non-ready capture, stub camera, short/blank strip).
      - name: prd08 motion-report
        run: |
          pnpm exec tsx --tsconfig tsconfig.base.json packages/aura3d-cli/src/cli.ts prd08 motion-report \
            --report benchmarks/quality-rebuild/out/prd08-motion/report.json \
            --out benchmarks/quality-rebuild/out/prd08-motion/motion-report \
            --scenes "${{ steps.scenes.outputs.ids }}"
          cat benchmarks/quality-rebuild/out/prd08-motion/motion-report/motion-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload motion report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd08-motion-report-${{ github.run_id }}
          path: benchmarks/quality-rebuild/out/prd08-motion/motion-report/
          if-no-files-found: error
      - name: Upload motion strips + report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd08-motion-${{ github.run_id }}
          path: benchmarks/quality-rebuild/out/prd08-motion/
          if-no-files-found: error
