<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070A0C" />
    <meta
      name="description"
      content="Aura3D public platformer presentation proof with a typed runner, certified playable-surface geometry, styled hazards, checkpoints, finish state, and keyboard-driven progression."
    />
    <title>Aura3D Showcase - Public Platformer Presentation Proof</title>
    <link rel="stylesheet" href="/apps/showcase-public-platformer-presentation-proof/src/styles.css" />
  </head>
  <body>
    <div id="app" class="platformer-stage" aria-label="Public platformer presentation proof"></div>
    <main class="platformer-hud" aria-label="Platformer status">
      <section class="hud-cluster hud-cluster--identity" aria-label="Route identity">
        <p>Aura3D Showcase</p>
        <h1>Public Platformer Presentation</h1>
      </section>
      <section class="hud-cluster hud-cluster--metrics" aria-label="Platformer metrics">
        <article><span>X</span><strong id="x-value">0.00</strong></article>
        <article><span>Score</span><strong id="score-value">0</strong></article>
        <article><span>Deaths</span><strong id="death-value">0</strong></article>
        <article><span>Ready</span><strong id="ready-value">No</strong></article>
      </section>
      <section class="hud-cluster hud-cluster--route" aria-label="Route evidence">
        <span id="surface-value">Surface map pending</span>
        <span id="presentation-value">Presentation pending</span>
      </section>
    </main>
    <nav class="platformer-controls" aria-label="Platformer controls">
      <span>D move</span>
      <span>Space jump</span>
      <span>R reset</span>
    </nav>
    <script type="module" src="/apps/showcase-public-platformer-presentation-proof/src/main.ts"></script>
  </body>
</html>
