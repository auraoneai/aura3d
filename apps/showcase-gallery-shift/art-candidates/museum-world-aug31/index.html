<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery Shift museum-world candidate preview</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, #preview { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #071018; }
      #preview canvas { display: block; width: 100%; height: 100%; }
      .caption {
        position: fixed; left: 22px; bottom: 20px; z-index: 2; max-width: 470px;
        padding: 11px 14px; border: 1px solid rgba(127, 240, 216, .28);
        border-radius: 8px; background: rgba(4, 12, 18, .84); color: #d7e8e9;
        font-size: 12px; letter-spacing: .04em; line-height: 1.45;
      }
      .caption strong { display: block; margin-bottom: 2px; color: #80f3cf; font-size: 13px; }
    </style>
  </head>
  <body>
    <main id="preview" aria-label="Aura3D isolated museum candidate preview"></main>
    <aside class="caption">
      <strong>GALLERY SHIFT · WORLD ART CANDIDATE</strong>
      Isolated root-API render · exact review camera · no route/runtime integration
    </aside>
    <script type="module" src="/main.js"></script>
  </body>
</html>
