<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Tunnel high-fidelity V5 candidate review</title>
    <style>
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08121c; }
      canvas { display: block; width: 100%; height: 100%; }
      .review-hud { position: fixed; z-index: 2; inset: 16px 24px auto; display: grid; grid-template-columns: 1.8fr repeat(4, auto); gap: 25px; align-items: center; box-sizing: border-box; max-width: 1120px; margin: auto; padding: 10px 16px; border: 1px solid rgba(102, 222, 238, .32); border-radius: 7px; background: rgba(3, 11, 20, .88); color: #edf8ff; font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; }
      .review-hud strong { display: block; font-size: 14px; letter-spacing: .14em; }
      .review-hud small { display: block; margin-bottom: 2px; color: #ff8f67; font-size: 9px; letter-spacing: .2em; }
      .review-hud span { color: #8be7f6; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="stage" aria-label="Pulse Tunnel high-fidelity V5 isolated candidate"></div>
    <aside class="review-hud" aria-label="Candidate gameplay HUD">
      <div><small>FINAL BEAT</small><strong>BREACH THE WATCHER</strong></div>
      <div><small>SHIELDS</small><span>● ● ●</span></div>
      <div><small>STYLE</small><span>x2.4</span></div>
      <div><small>CHAIN</small><span>16</span></div>
      <div><small>SECTION</small><span>FINALE</span></div>
    </aside>
    <script type="module" src="./pulse-high-fidelity-v5.ts"></script>
  </body>
</html>
