<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Roadster Rush 3D — Aura3D Port of roadster-rush.ai.studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/local.css" />
    <link rel="stylesheet" href="/roadster-rush/game.css" />
    <style>
      :root {
        --font-sans: "Whitney", "Graphik", sans-serif;
        --font-display: "DIN Pro", "Graphik", sans-serif;
        --font-mono: "Monument Grotesk Mono", monospace;
        --font: "Whitney", "Graphik", sans-serif;
      }
      body, html {
        margin: 0;
        padding: 0;
        background: #140b1c;
        color: #f4f6fb;
        font-family: "Whitney", "Graphik", sans-serif;
        overflow: hidden;
      }
      .aura3d-top-bar {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(11, 12, 20, 0.84);
        border: 1px solid rgba(95, 230, 255, 0.32);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-family: "Whitney", sans-serif;
        font-size: 12px;
        color: #f4f6fb;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        max-width: calc(100vw - 440px);
      }
      .aura3d-top-bar .aura-badge {
        font-family: "DIN Pro", sans-serif;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #5fe6ff;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(95, 230, 255, 0.14);
        border: 1px solid rgba(95, 230, 255, 0.25);
        font-size: 11px;
        white-space: nowrap;
      }
      .aura3d-top-bar .aura-sep {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.16);
        margin: 0 2px;
      }
      .aura3d-top-bar button {
        appearance: none;
        border: 1px solid rgba(244, 246, 251, 0.2);
        background: rgba(255, 255, 255, 0.07);
        color: #f4f6fb;
        font-family: "Whitney", sans-serif;
        font-size: 12px;
        font-weight: 500;
        height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      }
      .aura3d-top-bar button:hover {
        background: rgba(95, 230, 255, 0.2);
        border-color: rgba(95, 230, 255, 0.6);
        color: #ffffff;
      }
      .aura3d-top-bar button.active {
        background: #ff2a3a;
        border-color: #ff5260;
        color: #ffffff;
      }
      .aura3d-top-bar button[data-aura-tod].active {
        background: #5fe6ff;
        border-color: #5fe6ff;
        color: #091018;
      }
      .aura3d-controls-hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 45;
        padding: 5px 14px;
        border-radius: 999px;
        background: rgba(11, 12, 20, 0.8);
        border: 1px solid rgba(244, 246, 251, 0.18);
        color: #e2e8f0;
        font-family: "Monument Grotesk Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.03em;
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      }
      @media (max-width: 1100px) {
        .aura3d-top-bar {
          top: auto;
          bottom: 44px;
          max-width: calc(100vw - 24px);
        }
      }
      @media (max-width: 760px) {
        .aura3d-controls-hint { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="aura3d-top-bar" role="toolbar" aria-label="Aura3D Roadster Rush Quick Switcher" data-ui="true">
      <span class="aura-badge">AURA3D 4.0 · ROADSTER RUSH</span>
      <button type="button" id="aura-btn-freeway" class="active" title="Live Sunset Freeway Run (Interactive + Smart Autopilot)">Live Freeway</button>
      <button type="button" id="aura-btn-sky" title="Launch into Sky-Lane Dogfight at y=14m with Oncoming Roadsters">Sky Dogfight</button>
      <button type="button" id="aura-btn-ramp" title="Stage Heavy Carrier Ramp Launch & Roof-Runner Chain Ahead">Carrier Ramp</button>
      <button type="button" id="aura-btn-roll" title="Execute Cold-Gas Thruster Barrel Roll">Barrel Roll</button>
      <button type="button" id="aura-btn-rocket" title="Activate Rocket Overdrive Powerup">Rocket Send</button>
      <span class="aura-sep" aria-hidden="true"></span>
      <button type="button" data-aura-tod="0" class="active" title="Golden Sunset Lighting">Sunset</button>
      <button type="button" data-aura-tod="0.5" title="Twilight Dusk Lighting">Dusk</button>
      <button type="button" data-aura-tod="1" title="Neon Night Freeway Lighting">Night</button>
    </div>
    <div class="aura3d-controls-hint" id="aura-controls-hint">
      STEER: A/D or ARROWS · HOP / FLY: SPACE or W (HOLD) · BARREL ROLL: Q / E · BOOST: SHIFT · DIVE: S · PAUSE: P
    </div>
    <canvas id="game" width="1280" height="800" aria-label="Roadster Rush 3D freeway view"></canvas>
    <div id="hud" aria-live="polite"></div>
    <div id="boot" class="boot done">
      <div class="boot-mark">Roadster Rush</div>
      <div class="boot-meter">
        <div class="boot-line"><i></i></div>
        <div class="boot-label"><span>Loading</span><span class="boot-pct">100%</span></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
