    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0">Apex Overdrive — an Aura3D browser game</h1>
    <div class="aura3d-top-bar" role="toolbar" aria-label="Apex Overdrive showcase controls" data-ui="true" hidden>
      <button type="button" id="aura-showcase-chip" class="aura-chip" aria-expanded="false" aria-controls="aura-showcase-panel">SHOWCASE</button>
      <div id="aura-showcase-panel" class="aura-showcase-panel" hidden>
        <button type="button" id="aura-btn-freeway" title="Refill air and keep driving">Live Freeway</button>
        <button type="button" id="aura-btn-sky" title="Launch into the sky lane at 14 m with oncoming interceptors">Sky Dogfight</button>
        <button type="button" id="aura-btn-ramp" title="Stage a carrier ramp launch and roof-runner chain ahead">Carrier Ramp</button>
        <button type="button" id="aura-btn-roll" title="Cold-gas barrel roll">Barrel Roll</button>
        <button type="button" id="aura-btn-rocket" title="Rocket Send power-up">Rocket Send</button>
        <button type="button" id="aura-btn-auto" title="Toggle autopilot">Auto</button>
        <button type="button" data-aura-tod="0" title="Pin sunset (press again to follow the run)">Sunset</button>
        <button type="button" data-aura-tod="0.5" title="Pin dusk (press again to follow the run)">Dusk</button>
        <button type="button" data-aura-tod="1" title="Pin night (press again to follow the run)">Night</button>
      </div>
    </div>
    <div class="aura3d-controls-hint" id="aura-controls-hint">
      STEER: A/D or ARROWS · HOP / FLY: SPACE or W (HOLD) · BARREL ROLL: Q / E · BOOST: SHIFT · DIVE: S · PAUSE: P
    </div>
    <canvas id="game" width="1280" height="800" aria-label="Apex Overdrive 3D freeway view"></canvas>
    <div id="hud"></div>
    <div id="boot" class="boot">
      <div class="boot-mark">Apex Overdrive</div>
      <div class="boot-meter">
        <div class="boot-line"><i></i></div>
        <div class="boot-label"><span>Loading</span><span class="boot-pct">0%</span></div>
      </div>
    </div>
