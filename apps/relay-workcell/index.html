<header><nav aria-label="Main navigation"><a class="brand" href="/"><img src="/store-assets/brand/aura3d-logo-light.svg" alt="Aura3D" width="96" height="24"></a><span>/</span><a href="/docs/#examples">Examples</a></nav><a href="./stage.ts.txt">Scene source ↗</a></header>
<main>
<div class="lab">
<section class="view" aria-label="Interactive workcell">
<canvas id="viewport" aria-label="Six-axis arm with two moveable workstations" aria-describedby="instruction"></canvas>
<img class="poster" src="/previews/showcase-index/relay-workcell.webp" alt="Relay industrial manipulator on its machined fixture table">
<div class="nameplate"><p>Robotics lab</p><h1>Relay Workcell</h1></div>
<p id="instruction"><i></i> Planned tool path <span>·</span> Drag a station to reposition</p>
</section>
<aside aria-label="Cycle controls">
<div class="panel-head"><p class="eyebrow">Motion controller</p><span id="phase">Offline</span></div>
<h2>Pick &amp; place</h2>
<div class="metrics"><div><small>Cycle time</small><strong id="time">0.00 s</strong></div><div><small>Completed</small><strong id="count">0</strong></div></div>
<div class="actions"><button id="run" disabled>Run cycle</button><button id="reset" disabled>Reset</button></div>
<p id="status" role="status">Connecting to workcell…</p>
<fieldset><legend>Station coordinates <small>mm</small></legend>
<div class="coords"><span></span><span>X</span><span>Z</span>
<label class="station pick" for="pick-x">Pick</label><input id="pick-x" aria-label="Pick X in millimeters" type="number" step="10" value="-450" disabled><input id="pick-z" aria-label="Pick Z in millimeters" type="number" step="10" value="480" disabled>
<label class="station drop" for="drop-x">Drop</label><input id="drop-x" aria-label="Drop X in millimeters" type="number" step="10" value="550" disabled><input id="drop-z" aria-label="Drop Z in millimeters" type="number" step="10" value="380" disabled></div>
</fieldset>
<div class="telemetry"><p class="eyebrow">Tool center point <small>mm</small></p><div id="tcp"></div>
<p class="eyebrow">Joint position <small>deg</small></p><div id="joints"></div></div>
<footer><a href="/models/relay-workcell/robot.glb" download="relay-r6.glb">Robot model ↓</a><a href="./kinematics.ts.txt">Kinematics ↗</a></footer>
</aside>
</div></main><script type="module" src="./src/main.ts"></script></body></html>
