<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aura3D Equirectangular Panorama Renderer Proof</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #06080f; color: #f1f6ff; }
      main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 48px; }
      h1 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 42px); letter-spacing: -0.035em; }
      header p { margin: 0 0 28px; max-width: 800px; color: #aebbd0; line-height: 1.55; }
      code { color: #86e7ff; }
      .views { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #2a3850; border-radius: 14px; background: #0d1320; }
      canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
      figcaption { display: flex; justify-content: space-between; padding: 11px 13px; }
      figcaption span { color: #dce7f8; }
      @media (max-width: 760px) { .views { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Equirectangular panorama: camera-directed sampling</h1>
        <p>A single 2:1 directional panorama is rendered from three camera yaws through
          <code>Renderer.environmentBackground → EnvironmentBackgroundPass</code>.
          The changing horizon bands are GPU projection output, not page backgrounds.</p>
      </header>
      <section class="views" aria-label="Three rendered equirectangular panorama views">
        <figure><canvas data-yaw="left" width="320" height="240"></canvas><figcaption><span>Yaw −90°</span><code>left</code></figcaption></figure>
        <figure><canvas data-yaw="forward" width="320" height="240"></canvas><figcaption><span>Yaw 0°</span><code>forward</code></figcaption></figure>
        <figure><canvas data-yaw="right" width="320" height="240"></canvas><figcaption><span>Yaw +90°</span><code>right</code></figcaption></figure>
      </section>
    </main>
    <script type="module" src="/apps/advanced-examples-gallery/src/equirectPanoramaProof.ts"></script>
  </body>
</html>
