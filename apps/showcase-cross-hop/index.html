<!doctype html>
<html lang="en" data-density="compact">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <meta
      name="description"
      content="Aura3D Cross Hop showcase, an endless lane-hopping game: dodge cars, trams, trains, rivers and lava across 6 remixed themes, rescue critters, chase the high score."
    >
    <link rel="stylesheet" href="/fonts/local.css" />
    <title>Cross Hop — Aura3D Endless Lane Hopper</title>
    <!-- SEO pass — 2026-10-20: canonical + OG/Twitter wired to the brand renders. https://aura3d.auraone.ai is the placeholder base — swap at deploy. -->
    <link rel="canonical" href="https://aura3d.auraone.ai/apps/showcase-cross-hop/" />
    <meta property="og:title" content="Cross Hop — Aura3D Endless Lane Hopper" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aura3d.auraone.ai/apps/showcase-cross-hop/" />
    <meta property="og:image" content="https://aura3d.auraone.ai/store-assets/brand/social/og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cross Hop — Aura3D Endless Lane Hopper" />
    <meta name="twitter:image" content="https://aura3d.auraone.ai/store-assets/brand/social/twitter-1200x600.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <div class="aura3d-top-bar" role="toolbar" aria-label="Cross Hop quick switcher">
      <button type="button" id="ch-bar-quick" class="active" title="Start a quick run">Quick Play</button>
      <span class="aura-sep" aria-hidden="true"></span>
      <button type="button" class="venue" data-ch-theme="0" title="World 1: Meadow Roads">Meadow</button>
      <button type="button" class="venue" data-ch-theme="1" title="World 2: Downtown Trams">Downtown</button>
      <button type="button" class="venue" data-ch-theme="2" title="World 3: Riverbend">Riverbend</button>
      <button type="button" class="venue" data-ch-theme="3" title="World 4: Emberline">Emberline</button>
      <button type="button" class="venue" data-ch-theme="4" title="World 5: Neon District">Neon</button>
      <button type="button" class="venue" data-ch-theme="5" title="World 6: Critter Core">Critter Core</button>
      <a class="a3d-credit" href="/" title="Built with Aura3D">Built with Aura3D</a>
    </div>
    <div id="app" class="stage" aria-label="Cross Hop 3D lane field"></div>
    <div id="hud" class="hud-root" aria-live="polite"></div>
    <nav id="touch-controls" class="touch-root" aria-label="Cross Hop touch controls"></nav>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
