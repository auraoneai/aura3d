<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura3D — Deep Recovery</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04101e;
        color: #e6f4ff;
        font-family: "Whitney", "DIN Pro", "Monument Grotesk Mono", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .a3g-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: block;
        z-index: 10;
      }
      .a3g-hud-slot {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 180px;
        pointer-events: none;
      }
      .a3g-hud-slot[data-slot="top-left"] {
        top: 10px;
        left: 12px;
        align-items: flex-start;
      }
      .a3g-hud-slot[data-slot="top-right"] {
        top: 10px;
        right: 12px;
        align-items: flex-end;
      }
      .a3g-hud-slot[data-slot="top"],
      .a3g-hud-slot[data-slot="bottom"],
      .a3g-hud-slot[data-slot="bottom-left"],
      .a3g-hud-slot[data-slot="bottom-right"],
      .a3g-hud-slot[data-slot="center"] {
        display: none;
      }
      .a3g-w {
        pointer-events: none;
        background: rgba(4, 16, 30, 0.72);
        border: 1px solid rgba(56, 242, 228, 0.28);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        line-height: 1.25;
        color: #d8f6ff;
        backdrop-filter: blur(4px);
        width: fit-content;
        max-width: 170px;
        box-sizing: border-box;
      }
      .a3g-w-label {
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #63d7e8;
        opacity: 0.85;
      }
      .a3g-w-value {
        font-size: 12px;
        font-weight: 500;
        color: #f0fbff;
        font-variant-numeric: tabular-nums;
      }
      .a3g-meter-track {
        width: 110px;
        height: 5px;
        background: rgba(14, 42, 66, 0.85);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 2px;
      }
      .a3g-meter-fill {
        height: 100%;
        background: linear-gradient(90deg, #22d3ee, #38f2e4);
        transition: width 120ms ease-out;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
