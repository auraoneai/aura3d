<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aura FC 3D — Street & Stadium Football · Aura3D Showcase</title>
    <!-- SEO pass — 2026-10-20: canonical + OG/Twitter wired to the brand renders. https://aura3d.auraone.ai is the placeholder base — swap at deploy. -->
    <link rel="canonical" href="https://aura3d.auraone.ai/apps/showcase-aura-fc-3d/" />
    <meta property="og:title" content="Aura FC 3D — Street & Stadium Football · Aura3D Showcase" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aura3d.auraone.ai/apps/showcase-aura-fc-3d/" />
    <meta property="og:image" content="https://aura3d.auraone.ai/store-assets/brand/social/og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura FC 3D — Street & Stadium Football · Aura3D Showcase" />
    <meta name="twitter:image" content="https://aura3d.auraone.ai/store-assets/brand/social/twitter-1200x600.png" />
    <meta
      name="description"
      content="Aura FC 3D: five-a-side broadcast football on the Aura3D engine — six venues from a favela cage to a glacier dome, Shootout & Touch Labs, a 32-team World Circuit, and a Player Studio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/aura-fonts.css" />
    <style>
      :root {
        --bg: #06110f;
        --ink: #f3f0dc;
        --muted: #93a29a;
        --rule: rgba(243, 240, 220, 0.14);
        --accent: #d8ff3e;
        --cyan: #7dfcff;
        --font-display: "DIN Pro", "Whitney", -apple-system, sans-serif;
        --font-sans: "Whitney", -apple-system, sans-serif;
        --font-mono: "Monument Grotesk Mono", ui-monospace, monospace;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: var(--bg); color: var(--ink);
        font-family: var(--font-sans); font-size: 13px; line-height: 1.4;
        overflow: hidden; user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      #game-stage { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 0%, #0d2018 0%, #081410 60%, #050a08 100%); }
      #app { position: absolute; inset: 0; width: 100%; height: 100%; }
      #app canvas { display: block; width: 100% !important; height: 100% !important; }

      /* The bar itself comes from apps/showcase-port-shared/quickbar.css; FC sets accents and the title. */
      :root {
        --a3d-accent: var(--accent);
        --a3d-accent-ink: #0b1f1c;
        --a3d-accent-2: var(--cyan);
        --a3d-accent-2-ink: #04161a;
        --a3d-gold: var(--accent);
        --a3d-edge: var(--rule);
        --a3d-bg: rgba(5, 12, 10, 0.92);
      }
      .aura3d-top-bar .title {
        font-family: var(--font-display); font-weight: 800; font-size: 14px;
        letter-spacing: 0.12em; white-space: nowrap; margin-right: 6px;
      }
      .aura3d-top-bar .title em { font-style: normal; color: var(--accent); }
      .aura3d-top-bar button.venue { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; }

      .hint {
        position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
        font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
        color: rgba(243, 240, 220, 0.55); z-index: 25; pointer-events: none;
        text-align: center; white-space: nowrap;
        background: rgba(5, 12, 10, 0.55); padding: 4px 14px; border-radius: 8px;
      }
      #render-error {
        position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
        background: #0a0d0b; color: var(--ink); font-family: var(--font-mono); font-size: 13px;
      }
      #render-error[hidden] { display: none; }
      @media (max-width: 760px) { .hint { display: none; } }
      /* FC-E3: on phones the six venue buttons collapse into one Venue picker so every mode button fits the bar */
      .venue-pick { display: none; }
      .venue-pick .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .venue-pick select {
        font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink);
        background: rgba(255, 255, 255, 0.07); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; min-height: 44px;
      }
      @media (max-width: 760px) {
        .aura3d-top-bar button.venue { display: none; }
        .venue-pick { display: inline-flex; align-items: center; }
      }
    </style>
  </head>
  <body>
    <nav class="aura3d-top-bar" aria-label="Aura FC 3D quick switcher">
      <span class="title">AURA <em>FC 3D</em></span>
      <button data-fc-venue="favela" class="venue">FAVELA</button>
      <button data-fc-venue="munich" class="venue active">MUNICH</button>
      <button data-fc-venue="lagos" class="venue">LAGOS</button>
      <button data-fc-venue="kyoto" class="venue">KYOTO</button>
      <button data-fc-venue="uyuni" class="venue">UYUNI</button>
      <button data-fc-venue="glacier" class="venue">GLACIER</button>
      <label class="venue-pick"><span class="sr">Venue</span>
        <select id="fc-venue-select" aria-label="Venue">
          <option value="favela">Favela</option><option value="munich" selected>Munich</option><option value="lagos">Lagos</option>
          <option value="kyoto">Kyoto</option><option value="uyuni">Uyuni</option><option value="glacier">Glacier</option>
        </select>
      </label>
      <span class="aura-sep"></span>
      <button id="fc-btn-menu" title="Modes & tour hub">Modes & Tour</button>
      <button id="fc-btn-lab" title="Shootout lab">Skill Lab</button>
      <button id="fc-btn-demo" title="Watch CPU vs CPU">Demo</button>
      <button id="fc-btn-play" class="active" title="Two 90s halves vs the CPU">Quick Play</button>
      <a class="a3d-credit" href="https://aura3d.auraone.ai/" target="_blank" rel="noopener">Built with Aura3D</a>
    </nav>

    <main id="game-stage" class="game-shell">
      <div id="app"></div>
    </main>

    <p class="hint">WASD move · E pass · R driven · SPACE shoot (hold) · J/K skills · Q switch · P pause</p>
    <div id="render-error" hidden>WebGL could not start on this device.</div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
