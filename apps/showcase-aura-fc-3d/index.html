<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aura FC 3D — Street & Stadium Football · Aura3D Showcase</title>
    <meta
      name="description"
      content="Aura FC 3D: five-a-side broadcast football on the Aura3D engine — six venues from a favela cage to a glacier dome, Shootout & Touch Labs, a 32-team World Circuit, and a Player Studio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/aura-fonts.css" />
    <style>
      :root {
        --bg: #06110f;
        --ink: #f3f0dc;
        --muted: #93a29a;
        --rule: rgba(243, 240, 220, 0.14);
        --accent: #d8ff3e;
        --cyan: #7dfcff;
        --font-display: "DIN Pro", "Whitney", -apple-system, sans-serif;
        --font-sans: "Whitney", -apple-system, sans-serif;
        --font-mono: "Monument Grotesk Mono", ui-monospace, monospace;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: var(--bg); color: var(--ink);
        font-family: var(--font-sans); font-size: 13px; line-height: 1.4;
        overflow: hidden; user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      #game-stage { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 0%, #0d2018 0%, #081410 60%, #050a08 100%); }
      #app { position: absolute; inset: 0; width: 100%; height: 100%; }
      #app canvas { display: block; width: 100% !important; height: 100% !important; }

      /* ---- top toolbar ---- */
      .topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 40;
        display: flex; align-items: center; gap: 14px;
        padding: 8px 14px;
        background: linear-gradient(180deg, rgba(5, 12, 10, 0.92), rgba(5, 12, 10, 0.55) 78%, transparent);
        border-bottom: 1px solid var(--rule);
      }
      .topbar .brand {
        font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em;
        color: var(--muted); white-space: nowrap;
      }
      .topbar .title {
        font-family: var(--font-display); font-weight: 800; font-size: 15px;
        letter-spacing: 0.12em; white-space: nowrap;
      }
      .topbar .title em { font-style: normal; color: var(--accent); }
      .topbar nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
      .topbar button {
        appearance: none; cursor: pointer;
        font: 600 11.5px var(--font-sans); letter-spacing: 0.05em;
        color: var(--ink); background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--rule); border-radius: 8px; padding: 6px 11px;
        transition: border-color 0.15s, background 0.15s;
      }
      .topbar button:hover { border-color: var(--accent); }
      .topbar button.primary { background: linear-gradient(135deg, #d8ff3e, #9be84e); color: #0b1f1c; border-color: #d8ff3e; }
      .venue-row { display: flex; gap: 4px; }
      .venue-row button {
        font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em;
        color: var(--muted); padding: 5px 8px;
      }
      .venue-row button.active { color: #0b1f1c; background: var(--accent); border-color: var(--accent); }

      .hint {
        position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
        font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
        color: rgba(243, 240, 220, 0.55); z-index: 25; pointer-events: none;
        text-align: center; white-space: nowrap;
        background: rgba(5, 12, 10, 0.55); padding: 4px 14px; border-radius: 8px;
      }
      #render-error {
        position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
        background: #0a0d0b; color: var(--ink); font-family: var(--font-mono); font-size: 13px;
      }
      #render-error[hidden] { display: none; }
      @media (max-width: 980px) {
        .venue-row { display: none; }
        .topbar .brand { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { .topbar button { transition: none; } }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">AURA3D ENGINE</span>
      <span class="title">AURA <em>FC 3D</em></span>
      <nav class="venue-row" aria-label="Venue quick switch">
        <button data-fc-venue="favela">FAVELA</button>
        <button data-fc-venue="munich" class="active">MUNICH</button>
        <button data-fc-venue="lagos">LAGOS</button>
        <button data-fc-venue="kyoto">KYOTO</button>
        <button data-fc-venue="uyuni">UYUNI</button>
        <button data-fc-venue="glacier">GLACIER</button>
      </nav>
      <nav>
        <button id="fc-btn-menu" title="Modes & tour hub">Modes & Tour</button>
        <button id="fc-btn-lab" title="Shootout lab">Skill Lab</button>
        <button id="fc-btn-demo" title="Watch CPU vs CPU">Demo</button>
        <button id="fc-btn-play" class="primary" title="Two 90s halves vs the CPU">Quick Play</button>
      </nav>
    </header>

    <main id="game-stage" class="game-shell">
      <div id="app"></div>
    </main>

    <p class="hint">WASD move · E pass · R driven · SPACE shoot (hold) · J/K skills · Q switch · P pause</p>
    <div id="render-error" hidden>WebGL could not start on this device.</div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
