<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura3D Context-Loss Recovery Diagnostic</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #05070b; color: #dbeafe; }
      main { min-height: 100vh; display: grid; grid-template-rows: minmax(320px, 1fr) auto; }
      canvas { width: 100%; height: 100%; min-height: 320px; display: block; }
      section { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; padding: 1rem; background: #0b1220; border-top: 1px solid #243244; }
      button { border: 1px solid #3b82f6; border-radius: 0.5rem; padding: 0.65rem 0.9rem; background: #172554; color: #eff6ff; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      output { min-width: 16rem; color: #93c5fd; }
      p { flex-basis: 100%; margin: 0; color: #94a3b8; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="aura-context-loss-canvas" width="960" height="540" aria-label="Aura3D context-loss diagnostic scene"></canvas>
      <section aria-label="Context lifecycle controls">
        <button id="lose-context" type="button">Lose WebGL context</button>
        <button id="restore-context" type="button" disabled>Restore WebGL context</button>
        <button id="unsubscribe-loss" type="button">Unsubscribe loss listener</button>
        <output id="context-status" aria-live="polite">Mounting Aura3D…</output>
        <p>Internal diagnostic: the app observes browser context loss and restoration through <code>createAuraApp</code>. Aura3D does not claim automatic GPU-resource recreation.</p>
      </section>
    </main>
    <script type="module" src="/apps/context-loss-recovery/src/main.ts"></script>
  </body>
</html>
