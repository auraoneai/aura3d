<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Aura3D Animation Studio timeline</title>
  <desc id="desc">A stylized animation editor with a scene viewport, director prompt, and multi-track timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10151b"/><stop offset="1" stop-color="#050709"/></linearGradient>
    <radialGradient id="stage"><stop stop-color="#34d399" stop-opacity=".32"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="58" rx="12" fill="#141a20" stroke="#2b343e"/>
  <circle cx="58" cy="57" r="7" fill="#f5b454"/><circle cx="82" cy="57" r="7" fill="#4ade9d"/><circle cx="106" cy="57" r="7" fill="#61707e"/>
