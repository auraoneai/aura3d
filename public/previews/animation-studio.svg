  <rect x="52" y="164" width="244" height="116" rx="12" fill="#151d24"/>
  <text x="68" y="194" fill="#b9c4cc" font-family="system-ui, sans-serif" font-size="15">“Stage a cinematic office</text><text x="68" y="219" fill="#b9c4cc" font-family="system-ui, sans-serif" font-size="15">conversation, then cut to</text><text x="68" y="244" fill="#b9c4cc" font-family="system-ui, sans-serif" font-size="15">the city at dusk.”</text>
