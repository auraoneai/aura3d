  <text x="52" y="384" fill="#70808c" font-family="ui-monospace, monospace" font-size="13">CAST     2 HUMANOIDS</text><text x="52" y="414" fill="#70808c" font-family="ui-monospace, monospace" font-size="13">SHOTS    4 VALIDATED</text><text x="52" y="444" fill="#70808c" font-family="ui-monospace, monospace" font-size="13">RUNTIME  DETERMINISTIC</text>
