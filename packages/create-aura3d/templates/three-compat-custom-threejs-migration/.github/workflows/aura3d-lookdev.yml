name: Aura3D look-dev

# Captures this scene's screenshot tests on an Apple-silicon GPU runner
# (ANGLE Metal) and uploads the report as the `lookdev` artifact.
# `aura3d look capture --runner gh-actions` dispatches this workflow and
# downloads the artifacts; it can also be run manually from the Actions tab.
# No secrets are used; workflow_dispatch only — never runs forked code.

on:
  workflow_dispatch:
    inputs:
      shots:
        description: "Shot names to capture (comma-separated; the template's defaults when empty)"
        required: false
        default: ""
      viewports:
        description: "Viewport names (comma-separated; the template's defaults when empty)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  capture:
    name: Look-dev captures (macos-14, ANGLE Metal)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      QRC_GPU_ARGS: "--use-angle=metal --enable-gpu --ignore-gpu-blocklist"
      A3D_LOOKDEV_SHOTS: ${{ inputs.shots }}
      A3D_LOOKDEV_VIEWPORTS: ${{ inputs.viewports }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Capture screenshots
        run: npx playwright test tests/screenshot.spec.ts --reporter=line
        env:
          CHROMIUM_FLAGS: ${{ env.QRC_GPU_ARGS }}

      - name: Upload look-dev artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lookdev
          path: |
            tests/reports/**
          if-no-files-found: warn
          retention-days: 30
