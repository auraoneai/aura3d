<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura3D Arena Shooter</title>
    <style>
      html, body { margin: 0; background: #05070f; color: #e6e6e6; font-family: system-ui, sans-serif; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      #app { position: relative; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      #hud .hud__panel { position: absolute; background: rgba(8, 12, 24, 0.72); border: 1px solid rgba(157, 184, 255, 0.28); border-radius: 8px; padding: 10px 12px; font: 600 13px/1.45 Inter, system-ui, sans-serif; color: #eef3ff; }
      #hud .hud__panel--status { left: 16px; top: 16px; min-width: 240px; }
      #hud .hud__panel--status h1 { margin: 0 0 4px; font-size: 15px; }
      #hud .hud__panel--status p { margin: 0 0 6px; font-size: 11px; color: #9db8ff; text-transform: uppercase; letter-spacing: 0.08em; }
      #hud .hud__bars { display: grid; gap: 2px; }
      #hud .hud__bar { display: flex; justify-content: space-between; gap: 12px; }
      #hud .hud__bar b { color: #9db8ff; font-weight: 600; }
      #hud .hud__panel--meta { left: 16px; bottom: 16px; display: grid; gap: 2px; font-size: 12px; }
      #hud .hud__panel--controls { right: 16px; bottom: 16px; pointer-events: auto; display: flex; gap: 8px; align-items: center; }
      #hud button { background: #1f2b45; color: #eef3ff; border: 1px solid rgba(157, 184, 255, 0.45); border-radius: 6px; padding: 6px 10px; font: 600 12px Inter, system-ui, sans-serif; cursor: pointer; }
      #hud button:hover { background: #2a3a5c; }
      #hud .hud__help { font-size: 11px; color: #8fa4d0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
