<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vector Nine — Aura3D Arcade</title>
    <meta name="description" content="Vector Nine: thruster-assisted stunt driving on a decommissioned tidal barrage. One flux pool feeds both boost and wall grip — you cannot have both." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 24 L16 6 L28 24' fill='none' stroke='%23ffb648' stroke-width='2.5'/%3E%3Cpath d='M9 24 L16 13 L23 24' fill='none' stroke='%2359e0ff' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      /* Licensed UI face, committed with the game (public/fonts/graphik). */
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Regular-Web.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Medium-Web.woff2") format("woff2");
        font-weight: 500; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "DIN Pro";
        src: url("/fonts/din-pro/DINPro-Regular.woff") format("woff");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "DIN Pro";
        src: url("/fonts/din-pro/DINPro-Medium.woff") format("woff");
        font-weight: 500; font-style: normal; font-display: swap;
      }
      :root { color-scheme: light; }
      html, body, #app { width: 100vw; height: 100vh; margin: 0; overflow: hidden; }
      /* Dark backdrop behind the game scene is content, not chrome. */
      html, body { position: fixed; inset: 0; background: #070d1f; }
      #app { position: relative; }
      #app canvas { display: block; width: 100vw !important; height: 100vh !important; }

      /* Frame 1 is gated on app.ready(): the gate only clears once lighting,
         shadows and the GLB silhouettes can actually be drawn. */
      #boot-gate {
        position: fixed; inset: 0; z-index: 50;
        display: grid; place-items: center;
        background:
          radial-gradient(circle at 50% 38%, #ffffff 0%, #f0ede7 46%, #e6dfd2 78%, #d9cfbe 100%);
        transition: opacity 320ms ease;
        font-family: "Graphik", system-ui, sans-serif;
        font-synthesis: none;
      }
      #boot-gate .ring {
        width: 46px; height: 46px; margin: 0 auto 22px;
        border-radius: 50%; position: relative;
        border: 2px solid rgba(89, 224, 255, 0.16);
        border-top-color: #ffb648;
        animation: spin 860ms linear infinite;
      }
      #boot-gate .ring::after {
        content: ""; position: absolute; inset: 7px;
        border-radius: 50%;
        border: 2px solid rgba(255, 182, 72, 0.14);
        border-bottom-color: #59e0ff;
        animation: spin 1350ms linear infinite reverse;
      }
      #boot-gate .mark {
        font: 700 30px/1.15 "Graphik", system-ui, sans-serif;
        letter-spacing: 0.045em;
        background: linear-gradient(98deg, #ffb648 0%, #ff8a3d 46%, #59e0ff 100%);
        -webkit-background-clip: text; background-clip: text;
        color: transparent;
      }
      #boot-gate .tag {
        margin: 12px auto 0; max-width: 34ch;
        font: 400 12.5px/1.55 "Graphik", system-ui, sans-serif;
        letter-spacing: 0;
        color: #4d5866;
      }
      #boot-gate .tag strong { font-weight: 500; color: #b45309; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-gate">
      <div style="text-align:center">
        <div class="ring"></div>
        <div class="mark">Vector Nine</div>
        <div class="tag">Boost and wall grip share <strong>one flux pool</strong> — spend it well.<br />Tidal barrage · golden hour · flux coupe</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
