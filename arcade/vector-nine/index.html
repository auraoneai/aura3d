<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vector Nine — Aura3D Arcade</title>
    <meta name="description" content="Vector Nine: thruster-assisted stunt driving on a decommissioned tidal barrage. One flux pool feeds both boost and wall grip — you cannot have both." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 24 L16 6 L28 24' fill='none' stroke='%23ffb648' stroke-width='2.5'/%3E%3Cpath d='M9 24 L16 13 L23 24' fill='none' stroke='%2359e0ff' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      html, body, #app { width: 100vw; height: 100vh; margin: 0; overflow: hidden; }
      html, body { position: fixed; inset: 0; background: #070d1f; }
      #app { position: relative; }
      #app canvas { display: block; width: 100vw !important; height: 100vh !important; }

      /* Frame 1 is gated on app.ready(): the gate only clears once lighting,
         shadows and the GLB silhouettes can actually be drawn. */
      #boot-gate {
        position: fixed; inset: 0; z-index: 50;
        display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #14224a 0%, #0a1330 55%, #070d1f 100%);
        transition: opacity 320ms ease;
      }
      #boot-gate .mark {
        font: 700 15px/1.4 Inter, system-ui, sans-serif;
        letter-spacing: 0.46em;
        color: #ffb648;
        text-transform: uppercase;
        opacity: 0.92;
      }
      #boot-gate .tag {
        margin-top: 10px;
        font: 500 11px/1.5 Inter, system-ui, sans-serif;
        letter-spacing: 0.14em;
        color: #7ea4d8;
        text-transform: uppercase;
        opacity: 0.75;
      }
      #boot-gate .ring {
        width: 48px; height: 48px; margin: 0 auto 20px;
        border: 2px solid rgba(89, 224, 255, 0.20);
        border-top-color: #ffb648;
        border-radius: 50%;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-gate">
      <div style="text-align:center">
        <div class="ring"></div>
        <div class="mark">Vector Nine</div>
        <div class="tag">Flux Grip · Tidal Barrage · Golden Hour</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
