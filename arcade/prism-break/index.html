<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Prism Break — Aura3D Arcade</title>
    <meta name="description" content="Prism Break: a circular brick-breaker. The paddle orbits the rim, bricks fill concentric rings, and the core splits into shards that shrink your defence." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234de8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ff7ab8'/%3E%3C/svg%3E" />
    <style>
      /* Licensed UI face, committed with the game (public/fonts/graphik). */
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Regular-Web.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Medium-Web.woff2") format("woff2");
        font-weight: 500; font-style: normal; font-display: swap;
      }
      :root { color-scheme: dark; }
      html, body, #app { width: 100vw; height: 100vh; margin: 0; overflow: hidden; }
      /* Dark backdrop behind the game scene is content, not chrome. */
      html, body { position: fixed; inset: 0; background: #05070c; }
      #app { position: relative; }
      #app canvas { display: block; width: 100vw !important; height: 100vh !important; }

      /* Frame 1 is gated on app.ready(): the gate only clears once lighting,
         shadows and the GLB silhouettes can actually be drawn. The gate mirrors
         the arena itself — cyan rim dial, magenta core — so the fade into the
         scene reads as one continuous frame. */
      #boot-gate {
        position: fixed; inset: 0; z-index: 50;
        display: grid; place-items: center;
        background: radial-gradient(circle at 50% 44%, #0c1322 0%, #05070c 72%);
        transition: opacity 320ms ease;
        font-family: "Graphik", system-ui, sans-serif;
        font-synthesis: none;
      }
      #boot-gate .dial { position: relative; width: 54px; height: 54px; margin: 0 auto 20px; }
      #boot-gate .dial .bezel {
        position: absolute; inset: 0; border-radius: 50%;
        border: 1px solid rgba(77, 232, 255, 0.16);
      }
      #boot-gate .dial .arc {
        position: absolute; inset: 6px; border-radius: 50%;
        background: conic-gradient(from 0deg,
          rgba(77, 232, 255, 0) 0deg, rgba(77, 232, 255, 0) 250deg,
          #4de8ff 350deg, #ff7ab8 360deg);
        -webkit-mask: radial-gradient(circle, transparent 15px, #000 16px);
        mask: radial-gradient(circle, transparent 15px, #000 16px);
        animation: spin 1150ms linear infinite;
        filter: drop-shadow(0 0 7px rgba(77, 232, 255, 0.5));
      }
      #boot-gate .dial .hub {
        position: absolute; left: 50%; top: 50%;
        width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
        border-radius: 50%; background: #ff7ab8;
        box-shadow: 0 0 8px rgba(255, 122, 184, 0.8);
      }
      #boot-gate .title {
        font: 700 15px/1.4 "Graphik", system-ui, sans-serif;
        letter-spacing: 0.32em; text-indent: 0.32em;
        background: linear-gradient(93deg, #4de8ff 8%, #9d8cf5 55%, #ff7ab8 95%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #boot-gate .caption {
        margin-top: 7px;
        font: 600 8.5px/1.4 "Graphik", system-ui, sans-serif;
        letter-spacing: 0.3em; text-indent: 0.3em;
        color: rgba(150, 186, 212, 0.6);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-gate">
      <div style="text-align:center">
        <div class="dial"><div class="bezel"></div><div class="arc"></div><div class="hub"></div></div>
        <div class="title">PRISM BREAK</div>
        <div class="caption">SPINNING UP THE ARENA</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
