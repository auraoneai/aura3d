<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Backspin — Aura3D Arcade</title>
    <meta name="description" content="Backspin: a one-button trick chainer. Tap to flip, tap again to extend, hold to hover — and land inside a cone that narrows as your Link climbs." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%234de8ff' stroke-width='2'/%3E%3Cpath d='M10 20 L22 12' stroke='%23ff7ab8' stroke-width='3'/%3E%3C/svg%3E" />
    <style>
      /* Licensed UI face, committed with the game (public/fonts/graphik). */
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Regular-Web.woff2") format("woff2");
        font-weight: 400; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Graphik";
        src: url("/fonts/graphik/Graphik-Medium-Web.woff2") format("woff2");
        font-weight: 500; font-style: normal; font-display: swap;
      }
      :root { color-scheme: dark; }
      html, body, #app { width: 100vw; height: 100vh; margin: 0; overflow: hidden; }
      /* Dark backdrop behind the game scene is content, not chrome. */
      html, body { position: fixed; inset: 0; background: #05070c; }
      #app { position: relative; }
      #app canvas { display: block; width: 100vw !important; height: 100vh !important; }
      #boot-gate {
        position: fixed; inset: 0; z-index: 50;
        display: grid; place-items: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(77, 232, 255, 0.07) 0%, rgba(7, 11, 22, 0) 46%),
          radial-gradient(circle at 50% 45%, #101b33 0%, #0a1120 58%, #05070c 100%);
        transition: opacity 320ms ease;
        font-family: "Graphik", system-ui, sans-serif;
        font-synthesis: none;
      }
      #boot-gate .ring {
        width: 46px; height: 46px; margin: 0 auto 20px;
        border: 2px solid rgba(77, 232, 255, 0.14);
        border-top-color: #4de8ff;
        border-radius: 50%;
        box-shadow: 0 0 22px rgba(77, 232, 255, 0.14), inset 0 0 12px rgba(77, 232, 255, 0.06);
        animation: spin 1150ms cubic-bezier(0.65, 0.15, 0.35, 0.85) infinite;
      }
      #boot-gate .mark {
        font: 600 15px/1.4 "Graphik", system-ui, sans-serif;
        letter-spacing: 0.46em; text-indent: 0.46em;
        text-transform: uppercase; text-align: center;
        background: linear-gradient(180deg, #eef7ff 0%, #9fd8ff 78%, #4de8ff 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      #boot-gate .sub {
        margin-top: 7px; text-align: center;
        font: 500 8.5px/1.4 "Graphik", system-ui, sans-serif;
        letter-spacing: 0.34em; text-indent: 0.34em;
        text-transform: uppercase; color: #5a7ba6;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-gate">
      <div style="text-align:center">
        <div class="ring"></div>
        <div class="mark">Backspin</div>
        <div class="sub">Rooftop Run</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
