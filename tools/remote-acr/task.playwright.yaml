version: v1.1.0
# All --set values below are nonsecret. Native artifacts use the task's
# preauthorized managed identity, or (ARTIFACT_TRANSPORT=legacy-sas, no
# identity task) a short-lived container SAS that arrives only through the
# --values file in the run context (tools/remote-acr/sas-transport.sh). Neither
# access tokens nor SAS values appear in CLI arguments, image layers, task
# definitions, or output; other launches pass ARTIFACTS_SAS=none.
steps:
  - id: playwright
    cmd: {{.Values.LOGIN_SERVER}}/{{.Values.IMAGE}}
    workingDirectory: /repo
    env:
      - CI=1
      - AURA3D_RUN_ID={{.Values.RUN_ID}}
      - NATIVE_ACCEPTANCE_RUN_ID={{.Values.RUN_ID}}
      - AURA3D_SPECS_CSV={{.Values.SPECS_CSV}}
      - AURA3D_REPORTER={{.Values.REPORTER}}
      - AURA3D_NATIVE_ACCEPTANCE={{.Values.NATIVE_ACCEPTANCE}}
      - AURA3D_ACCEPTANCE_KIND={{.Values.ACCEPTANCE_KIND}}
      - AURA3D_HISTORICAL_INPUTS={{.Values.HISTORICAL_INPUTS}}
      - AURA3D_EXTERNAL_CODEC_LOCK={{.Values.EXTERNAL_CODEC_LOCK}}
      - AURA3D_EXTERNAL_CODEC_NPM_INPUTS={{.Values.EXTERNAL_CODEC_NPM_INPUTS}}
      - AURA3D_CODE_COMPLETE_GATE={{.Values.CODE_COMPLETE_GATE}}
      - AURA3D_BROWSER_PROJECT={{.Values.BROWSER_PROJECT}}
      - A3D_RELEASE_PLAN={{.Values.RELEASE_PLAN}}
      - NATIVE_CONSUMER_SOURCE_REPORT={{.Values.CONSUMER_SOURCE_REPORT}}
      - NATIVE_MATRIX_SOURCE_REPORT={{.Values.MATRIX_SOURCE_REPORT}}
      - NATIVE_EXAMPLES_SOURCE_REPORT={{.Values.EXAMPLES_SOURCE_REPORT}}
      - NATIVE_NETWORK_REPORT={{.Values.NETWORK_REPORT}}
      - NATIVE_MEASUREMENT_REPORT={{.Values.MEASUREMENT_REPORT}}
      - NATIVE_PERF_DEVICE_B64={{.Values.PERF_DEVICE_B64}}
      - NATIVE_PERF_DRIVER_B64={{.Values.PERF_DRIVER_B64}}
      - AURA3D_ARTIFACTS_BLOB_URL={{.Values.ARTIFACTS_BLOB_URL}}
      - AURA3D_ARTIFACTS_CLIENT_ID={{.Values.ARTIFACTS_CLIENT_ID}}
      - AURA3D_ARTIFACT_TRANSPORT={{.Values.ARTIFACT_TRANSPORT}}
      - AURA3D_ARTIFACTS_SAS={{.Values.ARTIFACTS_SAS}}
      - AURA3D_PW_SHARD={{.Values.PW_SHARD}}
      - AURA3D_PW_GLOBAL_TIMEOUT_MS={{.Values.PW_GLOBAL_TIMEOUT_MS}}
      - AURA3D_PLAYWRIGHT_CONFIG={{.Values.PLAYWRIGHT_CONFIG}}
      - PLAYWRIGHT_JSON_OUTPUT_NAME=tests/reports/remote-acr-report.json
    timeout: 3600
