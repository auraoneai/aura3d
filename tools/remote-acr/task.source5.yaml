version: v1.1.0
# Aura3D 5.0 source pass, one stage per run (no browser). All --set values are
# nonsecret. ARTIFACTS_SAS is a short-lived container SAS that reaches packed-a,
# packed-b1, packed-b2 and the example shard stages packed-c1..cN only through the 0600 --values file
# in the run context (tools/remote-acr/sas-transport.sh); every other stage gets
# ARTIFACTS_SAS=none. PLAN_GENERATED_AT is the frozen commit's UTC committer time, so
# every packed stage writes a byte-identical candidate plan. EXAMPLE_SHARDS is N of the
# packed examples' shard stages packed-c1..packed-cN (agent-examples --shard I/N).
steps:
  - id: source5
    cmd: {{.Values.LOGIN_SERVER}}/{{.Values.IMAGE}} /repo/tools/remote-acr/source5-run.sh
    workingDirectory: /repo
    env:
      - CI=1
      - NATIVE_RUN_ID={{.Values.RUN_ID}}
      - NATIVE_RELEASE_KIND={{.Values.RELEASE_KIND}}
      - SOURCE5_STAGE={{.Values.STAGE}}
      - A3D_PLAN_GENERATED_AT={{.Values.PLAN_GENERATED_AT}}
      - SOURCE5_EXAMPLE_SHARDS={{.Values.EXAMPLE_SHARDS}}
      - AURA3D_ARTIFACTS_SAS={{.Values.ARTIFACTS_SAS}}
    timeout: 3600
